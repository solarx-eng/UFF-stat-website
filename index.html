<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFF — United Football League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --lime:#c8f135;
  --cyan:#00d4ff;
  --blue:#1d6ef5;
  --red:#ff3b3b;
  --gold:#f0b429;
  --muted:#4b5a6e;
  --surface:#080e17;
  --surface2:#0d1520;
  --surface3:#121f2e;
  --surface4:#182638;
  --border:#1a2a3d;
  --border2:#1e3248;
  --text:#dce8f5;
  --text2:#6b8099;
}

/* ── LOADING SCREEN ── */
#loading-screen{
  position:fixed;inset:0;z-index:9999;
  background:#f1ead7;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity .5s ease;
  overflow:hidden;
}
#loading-screen::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,35,63,.055) 1px,transparent 1px),linear-gradient(rgba(16,35,63,.055) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(to bottom,transparent,black 28%,black 72%,transparent);}
#loading-screen::after{content:'UFF';position:absolute;right:-1vw;bottom:-9vw;font:900 clamp(180px,34vw,560px)/.72 'Barlow Condensed',sans-serif;color:rgba(16,35,63,.035);letter-spacing:-18px;pointer-events:none;}
#loading-screen.fade-out{opacity:0;pointer-events:none}
.ls-shell{position:relative;z-index:2;width:min(560px,calc(100% - 40px));border-top:5px solid #d8382c;border-bottom:1px solid rgba(16,35,63,.25);padding:38px 0 28px;text-align:left;}
.ls-brand-row{display:flex;align-items:center;gap:20px;margin-bottom:34px;}
.ls-logo-wrap{position:relative;width:82px;height:82px;flex:0 0 82px;}
.ls-ring{
  position:absolute;inset:-7px;border-radius:50%;
  border:2px solid transparent;
  border-top-color:#15b9e6;
  border-right-color:rgba(21,185,230,.28);
  animation:lspin 1.2s linear infinite;
}
@keyframes lspin{to{transform:rotate(360deg)}}
.ls-logo{width:82px;height:82px;border-radius:50%;object-fit:cover;display:block;border:1px solid #10233f;background:#fff;}
.ls-kicker{font:700 10px 'Inter',sans-serif;letter-spacing:3.5px;text-transform:uppercase;color:#d8382c;margin-bottom:5px;}
.ls-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:42px;letter-spacing:1px;text-transform:uppercase;color:#10233f;line-height:.9;}
.ls-sub{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:6px;text-transform:uppercase;color:#15a8d1;margin-top:8px;}
.ls-status-row{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px;}
.ls-track{width:100%;height:7px;background:rgba(16,35,63,.12);overflow:hidden;margin-bottom:12px;}
.ls-fill{height:100%;width:0%;background:linear-gradient(90deg,#d8382c 0%,#d8382c 72%,#15b9e6 100%);transition:width .2s ease;position:relative;}
.ls-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:24px;background:rgba(255,255,255,.45);filter:blur(8px);}
.ls-pct{font:900 34px/1 'Barlow Condensed',sans-serif;letter-spacing:0;color:#10233f;}
.ls-msg{font:700 10px 'Inter',sans-serif;letter-spacing:2.5px;text-transform:uppercase;color:#647084;}
.ls-season{display:flex;justify-content:space-between;padding-top:13px;border-top:1px solid rgba(16,35,63,.16);font:700 9px 'Inter',sans-serif;letter-spacing:2px;text-transform:uppercase;color:#10233f;}
@media(max-width:520px){.ls-shell{padding-top:28px}.ls-brand-row{gap:15px}.ls-logo-wrap,.ls-logo{width:68px;height:68px}.ls-logo-wrap{flex-basis:68px}.ls-title{font-size:32px}.ls-sub{font-size:14px;letter-spacing:4px}}

/* ── BODY ── */
html,body{height:100%;overflow-x:hidden;}
body{
  font-family:'Inter',sans-serif;
  background:var(--surface);
  color:var(--text);
  min-height:100vh;
}

/* ── TOP BAR ── */
.top-bar{
  position:fixed;top:0;left:0;right:0;
  height:58px;z-index:200;
  background:rgba(8,14,23,.95);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 1.25rem;
  gap:1rem;
  backdrop-filter:blur(12px);
}
.top-bar-left{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.top-bar-logo{width:36px;height:36px;border-radius:8px;object-fit:cover;border:1.5px solid rgba(200,241,53,.3);}
.top-bar-brand{}
.top-bar-name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;letter-spacing:2px;text-transform:uppercase;color:#fff;line-height:1;}
.top-bar-sub{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--lime);line-height:1;}
.top-bar-right{flex:1;max-width:320px;}
.top-search-wrap{display:flex;align-items:center;gap:8px;background:var(--surface3);border:1px solid var(--border);border-radius:8px;padding:7px 12px;}
.top-search-icon{font-size:13px;color:var(--text2);flex-shrink:0;}
.top-search{background:none;border:none;outline:none;color:var(--text);font-size:12px;width:100%;font-family:'Inter',sans-serif;}
.top-search::placeholder{color:var(--text2)}

/* ── PAGE BODY ── */
.page-body{
  margin-top:58px;
  margin-bottom:64px;
  min-height:calc(100vh - 58px - 64px);
}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:64px;z-index:200;
  background:rgba(8,14,23,.97);
  border-top:1px solid var(--border);
  display:flex;align-items:center;
  backdrop-filter:blur(12px);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;cursor:pointer;padding:6px 4px;
  transition:all .15s;
}
.bn-item:hover .bn-icon{color:#fff}
.bn-item:hover .bn-label{color:#fff}
.bn-icon{font-size:18px;color:var(--text2);transition:all .15s;line-height:1;}
.bn-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2);transition:all .15s;}
.bn-item.active .bn-icon{color:var(--lime);}
.bn-item.active .bn-label{color:var(--lime);}
.bn-item.active{position:relative;}
.bn-item.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:32px;height:2px;background:var(--lime);border-radius:0 0 4px 4px;
}

/* ── HOME WRAP ── */
.home-wrap{padding-bottom:.5rem;}

/* ── HOME HERO ── */
.home-hero-section{
  padding:1rem 1.25rem .75rem;
  background:var(--surface);
}
.home-hero-search{
  display:flex;align-items:center;gap:10px;
  background:var(--surface3);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 14px;
}
.hhs-icon{font-size:14px;color:var(--text2);}
.hhs-input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;font-family:'Inter',sans-serif;}
.hhs-input::placeholder{color:var(--text2)}

/* ── INFO CARDS ROW ── */
.home-info-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
  gap:.5rem;
  padding:.75rem 1.25rem;
  background:var(--surface);
}
.info-card{
  background:var(--surface3);
  border:1px solid var(--border);
  border-radius:10px;
  padding:.75rem .9rem;
  min-width:0;
}
.info-card-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:4px;font-family:'Barlow Condensed',sans-serif;}
.info-card-val{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;line-height:1;color:var(--lime);}
.info-card-sub{font-size:9px;color:var(--text2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── HOME MAIN GRID ── */
.home-main-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:.75rem;
  padding:.75rem 1.25rem;
}
@media(max-width:900px){.home-main-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.home-main-grid{grid-template-columns:1fr;}}

/* ── HM CARD ── */
.hm-card{
  background:var(--surface3);
  border:1px solid var(--border);
  border-radius:12px;
  padding:1rem;
  margin:0 1.25rem .75rem;
}
.home-main-grid .hm-card{margin:0;}
.hm-card-hdr{
  display:flex;align-items:center;gap:7px;
  margin-bottom:.85rem;
  padding-bottom:.6rem;
  border-bottom:1px solid var(--border);
}
.hm-card-icon{font-size:13px;opacity:.7;}
.hm-card-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
  color:#fff;flex:1;
}
.hm-card-action{
  font-size:10px;font-weight:600;
  color:var(--lime);cursor:pointer;
  letter-spacing:.5px;transition:opacity .15s;
  white-space:nowrap;
}
.hm-card-action:hover{opacity:.7}

/* ── PERFORMERS ── */
.perf-list{display:flex;flex-direction:column;gap:6px;}
.perf-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);}
.perf-row:last-child{border-bottom:none}
.perf-avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,rgba(200,241,53,.2),rgba(0,212,255,.1));
  border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;
  color:var(--lime);flex-shrink:0;
}
.perf-info{flex:1;min-width:0;}
.perf-name{font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.perf-team{font-size:9px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.perf-right{text-align:right;flex-shrink:0;}
.perf-val{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--lime);}
.perf-cat{font-size:8px;letter-spacing:1.5px;color:var(--text2);text-transform:uppercase;font-weight:600;}

/* ── POWER RANKINGS ── */
.rank-list{display:flex;flex-direction:column;gap:5px;}
.rank-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);}
.rank-row:last-child{border-bottom:none}
.rank-pos{
  width:22px;height:22px;border-radius:6px;
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.rank-pos-1{background:rgba(200,241,53,.15);color:var(--lime);}
.rank-pos-2{background:rgba(148,163,184,.1);color:#94a3b8;}
.rank-pos-3{background:rgba(205,127,50,.1);color:#cd7f32;}
.rank-pos-4,.rank-pos-5{background:var(--surface4);color:var(--text2);}
.rank-name{flex:1;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-rec{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text2);flex-shrink:0;}

/* ── CONF LEADERS ── */
.home-section-grid{
  display:grid;grid-template-columns:1fr 2fr;
  gap:.75rem;padding:.25rem 1.25rem;
}
@media(max-width:700px){.home-section-grid{grid-template-columns:1fr;}}
.conf-list{display:flex;flex-direction:column;gap:.6rem;}
.conf-group{padding:.6rem 0;border-bottom:1px solid var(--border);}
.conf-group:last-child{border-bottom:none}
.conf-group-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:5px;font-family:'Barlow Condensed',sans-serif;}
.conf-team-row{display:flex;align-items:center;justify-content:space-between;}
.conf-team-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;letter-spacing:1px;color:#fff;text-transform:uppercase;}
.conf-team-rec{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text2);}

/* ── QUICK ACCESS GRID ── */
.qa-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:.5rem;
}
.qa-item{
  background:var(--surface4);
  border:1px solid var(--border);
  border-radius:10px;
  padding:.75rem .6rem;
  cursor:pointer;transition:all .15s;
  text-align:center;
}
.qa-item:hover{border-color:var(--lime);background:rgba(200,241,53,.06);}
.qa-icon{font-size:18px;margin-bottom:5px;}
.qa-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#fff;line-height:1.1;}
.qa-sub{font-size:9px;color:var(--text2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── HM WIDGET ROWS ── */
.hm-perf-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);}
.hm-perf-row:last-child{border-bottom:none}
.hm-perf-rank{width:16px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--text2);flex-shrink:0;}
.hm-perf-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,rgba(200,241,53,.2),rgba(0,212,255,.1));border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;color:var(--lime);flex-shrink:0;}
.hm-perf-info{flex:1;min-width:0;}
.hm-perf-name{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hm-perf-team{font-size:9px;color:var(--text2);margin-top:1px;}
.hm-perf-right{text-align:right;flex-shrink:0;}
.hm-perf-val{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--lime);}
.hm-perf-cat{font-size:8px;letter-spacing:1.5px;color:var(--text2);text-transform:uppercase;}
.hm-rank-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);}
.hm-rank-row:last-child{border-bottom:none}
.hm-rank-pos{width:20px;height:20px;border-radius:5px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hm-rank-pos-1{background:rgba(200,241,53,.15);color:var(--lime);}
.hm-rank-pos-2{background:rgba(148,163,184,.1);color:#94a3b8;}
.hm-rank-pos-3{background:rgba(205,127,50,.1);color:#cd7f32;}
.hm-rank-pos-n{background:var(--surface4);color:var(--text2);}
.hm-rank-name{flex:1;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hm-rank-rec{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--text2);flex-shrink:0;}
.hm-conf-list{display:flex;flex-direction:column;gap:.5rem;}
.hm-conf-group{padding:.5rem 0;border-bottom:1px solid var(--border);}
.hm-conf-group:last-child{border-bottom:none}
.hm-conf-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--lime);margin-bottom:5px;font-family:'Barlow Condensed',sans-serif;}
.hm-conf-row{display:flex;align-items:center;justify-content:space-between;}
.hm-conf-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;color:#fff;text-transform:uppercase;}
.hm-conf-rec{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--text2);}
.hm-empty{font-size:11px;color:var(--text2);padding:.5rem 0;text-align:center;}

.de-toggle-label{display:flex;align-items:center;gap:4px;cursor:pointer;padding:3px 7px;border-radius:6px;border:1px solid rgba(200,241,53,.3);background:rgba(200,241,53,.06);transition:all .15s;}
.de-toggle-label:has(input:checked){background:rgba(200,241,53,.16);border-color:var(--lime);}
.de-tak-toggle{accent-color:var(--lime);width:12px;height:12px;cursor:pointer;}
.de-toggle-text{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--lime);text-transform:uppercase;}

/* ── RECENT GAMES ── */
.rg-row{
  display:flex;align-items:center;gap:.5rem;
  padding:8px 0;border-bottom:1px solid var(--border);
}
.rg-row:last-child{border-bottom:none}
.rg-side{display:flex;align-items:center;gap:7px;flex:1;min-width:0;}
.rg-side-r{flex-direction:row-reverse;text-align:right;}
.rg-logo{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border);}
.rg-logo-ph{background:var(--surface4);display:flex;align-items:center;justify-content:center;font-size:10px;}
.rg-tname{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:#fff;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rg-mid{text-align:center;flex-shrink:0;min-width:80px;}
.rg-score{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;color:#fff;}
.rg-st{font-size:8px;letter-spacing:2px;text-transform:uppercase;font-weight:700;}
.empty-sm{font-size:11px;color:var(--text2);padding:.75rem 0;text-align:center;}

/* ── INNER PAGES (Games/LB/Teams/Admin) ── */
.inner-page{min-height:100%;}
.inner-page-header{
  padding:1.25rem 1.25rem 1rem;
  background:var(--surface2);
  border-bottom:1px solid var(--border);
}
.iph-eyebrow{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:3px;
  text-transform:uppercase;color:var(--lime);margin-bottom:.3rem;
}
.iph-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:32px;font-weight:900;letter-spacing:1px;
  text-transform:uppercase;color:#fff;line-height:1;
}
.iph-title .role-badge{font-size:12px;vertical-align:middle;margin-left:8px;}
.iph-sub{font-size:11px;color:var(--text2);margin-top:.3rem;}

.role-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:2px 10px;border-radius:20px;text-transform:uppercase;}
.role-owner{background:rgba(167,139,250,.15);color:#a78bfa;border:1px solid rgba(167,139,250,.3);}
.role-admin{background:rgba(200,241,53,.1);color:var(--lime);border:1px solid rgba(200,241,53,.25);}

.inner-content{padding:1.25rem;}

/* ── CARDS / FORMS ── */
.card{background:var(--surface3);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--lime);margin-bottom:.9rem;}
textarea{width:100%;background:var(--surface4);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-family:'Inter',sans-serif;font-size:12px;resize:vertical;min-height:140px;outline:none;transition:border-color .2s;}
textarea:focus{border-color:var(--lime)}
input[type=text],input[type=password]{background:var(--surface4);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;font-family:'Inter',sans-serif;font-size:13px;outline:none;width:100%;transition:border-color .2s;}
input[type=text]:focus,input[type=password]:focus{border-color:var(--lime)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem}
label{font-size:9px;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:5px;font-weight:600;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--lime);color:#080e17}
.btn-primary:hover{background:#d8f540;}
.btn-publish{background:linear-gradient(135deg,var(--lime),var(--cyan));color:#080e17;width:100%;justify-content:center;padding:12px;font-size:12px;font-weight:800;letter-spacing:1.5px;border-radius:8px;}
.btn-publish:hover{opacity:.9}
.btn-danger{background:rgba(255,59,59,.1);color:#ff6666;border:1px solid rgba(255,59,59,.25);}
.btn-danger:hover{background:rgba(255,59,59,.2)}
.btn-sm{padding:5px 10px;font-size:10px}
.err{background:rgba(255,59,59,.08);border:1px solid rgba(255,59,59,.25);border-radius:8px;padding:9px 12px;color:#ff7070;font-size:11px;margin-top:8px;}
.ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:8px;padding:9px 12px;color:#4ade80;font-size:11px;margin-top:8px;}

/* ── TABS ── */
.stat-tabs{display:flex;gap:3px;margin-bottom:1rem;flex-wrap:wrap;background:var(--surface4);padding:4px;border-radius:10px;border:1px solid var(--border);}
.stat-tab{padding:7px 14px;border-radius:7px;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;color:var(--text2);transition:all .15s;border:none;background:transparent;}
.stat-tab:hover{color:#fff}
.stat-tab.active{background:var(--lime);color:#080e17;font-weight:700}

.lb-tab-dropdown{position:relative;display:inline-block;}
/* Awards page transparent glass style */
.awards-glass-bg{
  background:linear-gradient(135deg,rgba(8,14,23,.85) 0%,rgba(13,21,32,.9) 100%);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.lb-tab-drop-btn{padding:6px 14px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;color:var(--text2);transition:all .15s;border:1px solid transparent;white-space:nowrap;font-family:'Barlow Condensed',sans-serif;display:flex;align-items:center;gap:5px;user-select:none;}
.lb-tab-drop-btn:hover,.lb-tab-drop-btn.active{color:#fff;background:var(--surface4);}
.lb-tab-drop-btn.active{background:var(--lime);color:#080e17;}
.lb-drop-arrow{font-size:8px;opacity:.7;}
.lb-drop-menu{position:absolute;top:calc(100% + 5px);left:0;background:var(--surface3);border:1px solid var(--border2);border-radius:9px;min-width:180px;z-index:300;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5);}
.lb-drop-item{padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;color:var(--text2);transition:background .12s;font-family:'Barlow Condensed',sans-serif;border-bottom:1px solid var(--border);}
.lb-drop-item:last-child{border-bottom:none;}
.lb-drop-item:hover{background:var(--surface4);color:#fff;}
.lb-drop-item.selected{color:var(--lime);}

/* ── LEADERBOARD PAGE ── */
.lb-page{display:flex;flex-direction:column;min-height:100%;}
.lb-page-hdr{padding:1rem 1.25rem .6rem;background:var(--surface2);border-bottom:1px solid var(--border);}
.lb-page-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#fff;line-height:1;}
.lb-page-sub{font-size:10px;color:var(--text2);margin-top:2px;letter-spacing:.5px;}
.lb-tabs-wrap{background:var(--surface2);padding:.5rem 1.25rem .75rem;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.lb-tabs{display:flex;gap:4px;min-width:max-content;}
.lb-tab{padding:6px 14px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;color:var(--text2);transition:all .15s;border:1px solid transparent;white-space:nowrap;font-family:'Barlow Condensed',sans-serif;}
.lb-tab:hover{color:#fff;background:var(--surface4);}
.lb-tab.active{background:var(--lime);color:#080e17;border-color:var(--lime);}
.lb-body{padding:.75rem 1.25rem 1rem;flex:1;}

/* ── LB TABLE ── */
.lb-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.lb-table th{padding:9px 10px;text-align:left;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text2);border-bottom:1px solid var(--border);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-table td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-table tr:last-child td{border-bottom:none}
.lb-table tr:hover td{background:rgba(255,255,255,.02)}
.rank-1{color:var(--lime);font-weight:700}.rank-2{color:#94a3b8;font-weight:700}.rank-3{color:#cd7f32;font-weight:700}.rank-n{color:var(--muted)}
.pcell{font-weight:700;color:#fff}
.tpill{background:var(--surface4);padding:2px 8px;border-radius:5px;font-size:9px;color:var(--text2);letter-spacing:1px;display:inline-block;border:1px solid var(--border);}
.sval{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--lime)}
.empty{text-align:center;padding:2.5rem;color:var(--text2);font-size:11px;letter-spacing:1px}

/* ── GAME CARDS ── */
.games-list{display:grid;gap:.65rem}
.gc{background:var(--surface3);border:1px solid var(--border);border-radius:12px;padding:1rem;cursor:pointer;transition:all .2s;}
.gc:hover{border-color:var(--lime);background:var(--surface4);}
.gc-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gc-score{display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center}
.gc-team{text-align:center}
.gc-tname{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2);margin-bottom:3px;}
.gc-pts{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:900;color:#fff;line-height:1;}
.gc-vs{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--text2);text-align:center;font-weight:700;}
.gc-meta{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;}
.tab-content{display:none}.tab-content.active{display:block}
.back-btn{font-size:11px;color:var(--text2);cursor:pointer;letter-spacing:1px;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px;margin-bottom:1rem;font-weight:600;transition:color .15s;}
.back-btn:hover{color:var(--lime)}

/* ── LOGIN ── */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:70vh;padding:1.5rem;}
.login-box{background:var(--surface3);border:1px solid var(--border);border-radius:16px;padding:2rem 1.75rem;width:100%;max-width:360px;text-align:center;}
.login-logo{width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 1rem;border:2px solid rgba(200,241,53,.25);display:block;}
.login-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#fff;margin-bottom:3px;}
.login-sub{font-size:11px;color:var(--text2);letter-spacing:1px;margin-bottom:1.75rem}
.login-field{margin-bottom:.85rem;text-align:left}

/* ── SCORE BANNER ── */
.score-banner{background:var(--surface3);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
.score-banner-inner{display:grid;grid-template-columns:1fr auto 1fr;gap:.75rem;align-items:center}
.sb-team{text-align:center}
.sb-name{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:6px;}
.sb-score{font-family:'Barlow Condensed',sans-serif;font-size:48px;font-weight:900;color:#fff;line-height:1;}
.sb-divider{text-align:center}
.sb-vs{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--text2);font-weight:700;display:block;}
.sb-final{font-size:8px;color:var(--text2);letter-spacing:2px;text-transform:uppercase;margin-top:4px;display:block;}

/* ── TEAMS ── */
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;margin-bottom:1rem}
.team-card{background:var(--surface3);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .2s;}
.team-card:hover{border-color:rgba(200,241,53,.35);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3);}
.team-card-img-wrap{width:100%;height:200px;background:var(--surface4);display:flex;align-items:center;justify-content:center;padding:1.25rem;}
.team-card-img{width:100%;height:100%;object-fit:contain;display:block;}
.team-card-img-placeholder{width:100%;height:200px;background:var(--surface4);display:flex;align-items:center;justify-content:center;font-size:52px;color:var(--border);}
.team-card-body{padding:1rem 1.1rem 1.2rem}
.team-card-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#fff;margin-bottom:.65rem;line-height:1.1;}
.team-card-info{display:flex;flex-direction:column;gap:6px}
.team-card-row{display:flex;gap:8px;align-items:baseline}
.team-card-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--lime);min-width:75px;flex-shrink:0;}
.team-card-val{font-size:12px;color:var(--text2)}

/* ── ADMIN ── */
.team-block{background:var(--surface4);border:1px solid var(--border);border-radius:10px;padding:.9rem;margin-bottom:.9rem;}
.team-header{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#fff;margin-bottom:.6rem;padding-bottom:7px;border-bottom:1px solid var(--border);}
.player-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);gap:.5rem;flex-wrap:wrap;}
.player-row:last-child{border-bottom:none}
.pname{font-size:12px;color:#fff;min-width:110px;font-weight:600}
.pstats{font-size:10px;color:var(--text2);flex:1}
.passign select{background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:4px 7px;border-radius:6px;font-size:10px;outline:none;}
.sec-div{font-size:9px;color:var(--text2);letter-spacing:2px;text-transform:uppercase;padding:4px 0;margin:5px 0;border-top:1px solid var(--border);}
.game-row-admin{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);gap:.5rem;}
.game-row-admin:last-child{border-bottom:none}
.player-avatar{width:34px;height:34px;border-radius:50%;background:rgba(200,241,53,.1);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--lime);flex-shrink:0;border:1px solid rgba(200,241,53,.2);font-weight:700;}
.player-name{font-size:12px;font-weight:700;color:#fff;flex:1;min-width:100px}
.player-stats-mini{font-size:10px;color:var(--text2);margin-top:2px}
.player-controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.mini-select{background:var(--surface3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 7px;font-size:11px;outline:none;transition:border-color .2s;max-width:130px;}
.mini-select:focus{border-color:var(--lime)}
.team-section-hdr{display:flex;align-items:center;gap:9px;padding:10px 0 7px;border-bottom:2px solid var(--border);margin-bottom:2px;}
.team-section-logo{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--surface3);border:1px solid var(--border);flex-shrink:0;}
.team-section-name{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:#fff;letter-spacing:1.5px;text-transform:uppercase;}
.team-section-count{font-size:9px;color:var(--text2);margin-left:auto}
.admin-team-row{display:flex;align-items:center;gap:.7rem;padding:9px 0;border-bottom:1px solid var(--border);}
.admin-team-row:last-child{border-bottom:none}
.admin-team-thumb{width:40px;height:40px;border-radius:8px;background:var(--surface4);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--border);}
.admin-team-info{flex:1;min-width:0}
.admin-team-name{font-size:12px;font-weight:700;color:#fff}
.admin-team-meta{font-size:10px;color:var(--text2);margin-top:2px}
.img-preview{width:100%;height:110px;object-fit:cover;border-radius:8px;margin-top:8px;display:none;}
.pos-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:5px;text-transform:uppercase;border:1px solid;font-family:'Barlow Condensed',sans-serif;}
.pos-qb{background:rgba(255,59,59,.12);color:#ff7070;border-color:rgba(255,59,59,.25)}
.pos-wr{background:rgba(0,212,255,.12);color:#00d4ff;border-color:rgba(0,212,255,.25)}
.pos-te{background:rgba(34,197,94,.12);color:#4ade80;border-color:rgba(34,197,94,.25)}
.pos-rb{background:rgba(200,241,53,.12);color:var(--lime);border-color:rgba(200,241,53,.25)}
.pos-de{background:rgba(139,92,246,.12);color:#a78bfa;border-color:rgba(139,92,246,.25)}
.pos-lb{background:rgba(249,115,22,.12);color:#fb923c;border-color:rgba(249,115,22,.25)}
.pos-db{background:rgba(236,72,153,.12);color:#f472b6;border-color:rgba(236,72,153,.25)}
.pos-k{background:rgba(107,114,128,.12);color:#9ca3af;border-color:rgba(107,114,128,.25)}
.gc-team-logo{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface4);display:block;margin:0 auto 5px;border:1px solid var(--border);}
.gc-team-logo-placeholder{width:32px;height:32px;border-radius:50%;background:var(--surface4);display:flex;align-items:center;justify-content:center;font-size:12px;margin:0 auto 5px;}
.sb-team-logo{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--surface4);border:2px solid var(--border);display:block;margin:0 auto 8px;}
.sb-team-logo-placeholder{width:52px;height:52px;border-radius:50%;background:var(--surface4);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 8px;}
.ag-team-preview{display:flex;align-items:center;gap:10px;margin-top:8px;padding:9px 12px;background:var(--surface4);border-radius:8px;border:1px solid var(--border);min-height:46px;}
.ag-team-preview-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--surface3);border:1px solid var(--border);flex-shrink:0;}
.ag-team-preview-name{font-size:12px;font-weight:700;color:#fff}
.ag-team-preview-empty{font-size:11px;color:var(--text2);font-style:italic}
.team-select{background:var(--surface4);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;font-family:'Inter',sans-serif;font-size:13px;outline:none;width:100%;transition:border-color .2s;}
.team-select:focus{border-color:var(--lime)}
.natty-card{background:var(--surface3);border:1px solid var(--border);border-radius:12px;padding:1.1rem;}
.natty-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--lime);display:flex;align-items:center;gap:6px;margin-bottom:.65rem;}
.natty-body{font-size:11px;color:var(--text2);text-align:center;padding:.75rem 0;font-style:italic}

/* 2026 LEAGUE HUB REDESIGN */
:root{
  --cream:#f1ead7;--cream2:#e5dcc3;--ink:#10233f;--ink2:#172d4d;
  --scarlet:#d8382c;--sky:#15b9e6;--line:rgba(16,35,63,.18);
}
body{background:var(--cream);color:var(--ink)}
.page-body{margin:76px 0 0;min-height:calc(100vh - 76px);background:var(--cream)}
.top-bar{height:76px;padding:0 clamp(18px,4vw,64px);background:rgba(241,234,215,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
.top-bar-logo{width:44px;height:44px;border-radius:50%;border:1px solid var(--ink);background:#fff}
.top-bar-name{color:var(--ink);font-size:19px;letter-spacing:2.5px}.top-bar-sub{color:var(--scarlet);letter-spacing:4px}
.league-nav{height:100%;display:flex;align-items:center;gap:28px;margin-left:30px}
.league-nav-item{position:relative;height:100%;display:flex;align-items:center;font:800 15px 'Barlow Condensed',sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);cursor:pointer}
.league-nav-item:hover,.league-nav-item.active{color:var(--scarlet)}
.league-nav-item.active:after{content:'';position:absolute;left:0;right:0;bottom:19px;height:2px;background:var(--scarlet)}
.top-bar-right{display:flex;justify-content:flex-end;gap:10px;max-width:none}
.hub-search,.verify-pill,.discord-pill,.account-pill{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:11px 16px;font:800 12px 'Barlow Condensed',sans-serif;letter-spacing:1.4px;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap}
.account-pill{background:var(--ink);color:#fff}.hub-search:hover{background:var(--ink);color:#fff}
.verify-pill{border-color:var(--scarlet);color:var(--scarlet)}.verify-pill:hover{background:var(--scarlet);color:#fff}
.discord-pill{border-color:#5865f2;color:#4250d5}.discord-pill:hover{background:#5865f2;color:#fff}
.verified-team-badge{display:flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid rgba(16,35,63,.2);font:800 10px 'Inter',sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--ink)}
.verified-team-badge::before{content:'✓';display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#18a66a;color:#fff;font-size:10px}
.bottom-nav{display:none}

.score-ribbon{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));background:var(--ink);color:#fff;border-bottom:4px solid var(--scarlet);overflow:auto}
.score-tile{padding:14px 18px;border-right:1px solid rgba(255,255,255,.12);min-height:112px;cursor:pointer}
.score-meta{display:flex;justify-content:space-between;color:#9fb2cc;font:700 10px 'Inter',sans-serif;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:10px}
.score-team{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;font:800 19px 'Barlow Condensed',sans-serif;letter-spacing:.6px;margin:6px 0}
.score-team span:last-child{font-size:24px}.score-empty{color:#9fb2cc;font:600 12px 'Inter',sans-serif;padding-top:18px}

.league-home{max-width:1500px;margin:auto;padding:42px clamp(18px,4vw,62px) 72px}
.dashboard-kicker,.section-kicker{color:var(--scarlet);font:700 11px 'Inter',sans-serif;letter-spacing:4px;text-transform:uppercase}
.dashboard-title{font:900 clamp(56px,8vw,118px)/.82 'Barlow Condensed',sans-serif;letter-spacing:-3px;text-transform:uppercase;color:var(--ink);max-width:850px;margin:14px 0 22px}
.dashboard-title em{display:block;color:var(--sky);font-style:normal}
.dashboard-deck{max-width:600px;font-size:15px;line-height:1.7;color:#536177}
.hero-action{display:inline-flex;margin-top:28px;background:var(--scarlet);color:#fff;padding:14px 22px;font:800 13px 'Barlow Condensed',sans-serif;letter-spacing:1.8px;text-transform:uppercase;cursor:pointer}
.hero-action:hover{background:var(--ink)}
.dashboard-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr);gap:60px;align-items:center;padding-bottom:48px;border-bottom:1px solid var(--line)}
.season-card{background:var(--ink);color:#fff;padding:34px;min-height:310px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.season-card:after{content:'UFF';position:absolute;right:-10px;bottom:-42px;font:900 140px 'Barlow Condensed',sans-serif;color:rgba(255,255,255,.04)}
.season-card-label{color:#8cdcf3;font:700 10px 'Inter',sans-serif;letter-spacing:3px;text-transform:uppercase}.season-number{font:900 96px/1 'Barlow Condensed',sans-serif;color:var(--sky)}
.season-card-row{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.15);padding-top:15px;font:700 11px 'Inter',sans-serif;letter-spacing:1.5px;text-transform:uppercase}

.legacy-archive{margin-top:54px;padding:46px 0 52px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.archive-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:20px}
.archive-title{font:900 clamp(38px,5vw,66px)/.9 'Barlow Condensed',sans-serif;text-transform:uppercase;color:var(--ink);margin-top:8px}
.archive-intro{max-width:430px;color:#647084;font-size:13px;line-height:1.65}
.archive-feature{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,.55fr);background:var(--ink);min-height:420px}
.archive-feature-media{position:relative;overflow:hidden;min-height:420px}
.archive-feature-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s ease}
.archive-feature:hover img{transform:scale(1.025)}
.archive-feature-copy{position:relative;padding:34px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden}
.archive-feature-copy::after{content:'01';position:absolute;right:-4px;bottom:-34px;font:900 160px 'Barlow Condensed',sans-serif;color:rgba(255,255,255,.045)}
.archive-stamp{color:var(--sky);font:700 9px 'Inter',sans-serif;letter-spacing:3px;text-transform:uppercase}
.archive-feature-copy h3{font:900 38px/.95 'Barlow Condensed',sans-serif;text-transform:uppercase;max-width:230px;margin-top:12px}

/* ══════ ODDS / FLAGCOINS TAB ══════ */
.odds-page{padding:0 0 3rem;}
.odds-hero{background:linear-gradient(135deg,#080e17 0%,#0d1a2e 60%,#0a1520 100%);border-bottom:2px solid rgba(240,180,41,.25);padding:1.5rem 1.25rem 1rem;position:relative;overflow:hidden;}

.odds-hero-kicker{font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
.odds-hero-title{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#fff;line-height:.95;margin-bottom:6px;}

.odds-coins-pill .coin-icon{font-size:16px;}

.odds-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin:0;background:var(--surface2);}
.odds-tab{padding:13px 20px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;}
.odds-tab:hover{color:#fff;}
.odds-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.odds-section{padding:1rem 1.25rem;}
.odds-section-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--lime);margin-bottom:.75rem;display:flex;align-items:center;gap:8px;}
.odds-section-title::before{content:'';display:inline-block;width:3px;height:14px;background:var(--lime);border-radius:2px;}
/* Season bracket */
.season-bracket{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.65rem;}
.season-bracket-card{background:var(--surface3);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .15s;}

.sbcard-guess-box.selected{border-color:var(--gold);background:rgba(240,180,41,.18);color:var(--gold);}

.fc-rank-row:hover{border-color:rgba(240,180,41,.3);}

</style>
<!-- Firebase Persistence -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, query, orderBy, limit, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyDUFgudK3DG_oDVlbvzPtg8aB3OC6KO31o",
  authDomain: "uff-league-website.firebaseapp.com",
  projectId: "uff-league-website",
  storageBucket: "uff-league-website.firebasestorage.app",
  messagingSenderId: "823407844978",
  appId: "1:823407844978:web:85535ef71113a255a26ceb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// Split across multiple documents to stay under Firestore's 1MB-per-doc limit.
// Each doc holds a slice of state. Teams/games are the biggest (logos, stat blocks).
const REF_TEAMS    = doc(db, 'league', 'teams');     // teams + conferences + playoffBracket
const REF_GAMES    = doc(db, 'league', 'games');     // publishedGames (can be large w/ stats)
const REF_MISC     = doc(db, 'league', 'misc');      // playerRegistry, awardsData, settings, accounts

function playerEmail(username){return String(username).trim().toLowerCase()+'@players.uff.app'}
function cleanUsername(username){
  const value=String(username||'').trim();
  if(!/^[A-Za-z0-9_]{3,20}$/.test(value)) throw new Error('Use 3–20 letters, numbers, or underscores.');
  return value;
}
function authMessage(error){
  const code=error&&error.code||'';
  if(code.includes('email-already-in-use')) return 'That player name is already taken.';
  if(code.includes('invalid-credential')) return 'Incorrect player name or password.';
  if(code.includes('weak-password')) return 'Use a password with at least 6 characters.';
  if(code.includes('operation-not-allowed')) return 'Player accounts need Email/Password enabled in Firebase Authentication.';
  return error&&error.message?error.message:'Player access is unavailable right now.';
}
window._playerSignup=async function(username,password){
  try{
    const clean=cleanUsername(username);
    const credential=await createUserWithEmailAndPassword(auth,playerEmail(clean),String(password||''));
    const profile={uid:credential.user.uid,username:clean,displayName:clean,teamName:'Unassigned',createdAt:Date.now()};
    await setDoc(doc(db,'playerProfiles',credential.user.uid),profile);
    return profile;
  }catch(error){throw new Error(authMessage(error))}
};
window._playerLogin=async function(username,password){
  try{await signInWithEmailAndPassword(auth,playerEmail(cleanUsername(username)),String(password||''));return true}
  catch(error){throw new Error(authMessage(error))}
};
window._playerLogout=async function(){await signOut(auth)};
window._updatePlayerTeam=async function(uid, newTeam){
  try{
    await setDoc(doc(db,'playerProfiles',uid),{teamName:newTeam},{merge:true});
    return true;
  }catch(e){console.warn('Failed to update player team in Firebase:',e);return false;}
};
window._getPlayerProfiles=async function(){
  const snap=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js').then(m=>m.getDocs(collection(db,'playerProfiles')));
  return snap.docs.map(d=>({id:d.id,...d.data()}));
};
window._submitPlayerPost=async function(text){
  const user=auth.currentUser;
  if(!user) throw new Error('Log in through Player Access before posting.');
  const profileSnap=await getDoc(doc(db,'playerProfiles',user.uid));
  const profile=profileSnap.exists()?profileSnap.data():{};
  const body=String(text||'').trim();
  if(!body||body.length>500) throw new Error('Posts must be between 1 and 500 characters.');
  const derivedTeam=typeof window._getCurrentPlayerTeam==='function'?window._getCurrentPlayerTeam():'';
  await addDoc(collection(db,'playerFeed'),{authorUid:user.uid,username:profile.username||'Player',displayName:profile.displayName||profile.username||'Player',teamName:derivedTeam||profile.teamName||'Unassigned',text:body,createdAt:serverTimestamp(),createdAtMs:Date.now()});
};
onAuthStateChanged(auth,async user=>{
  let profile=null;
  if(user){const ref=doc(db,'playerProfiles',user.uid),snap=await getDoc(ref);if(snap.exists())profile=snap.data();else{const username=String(user.email||'player').split('@')[0];profile={uid:user.uid,username,displayName:username,teamName:'Unassigned',createdAt:Date.now()};await setDoc(ref,profile)}}
  if(typeof window._setPlayerSession==='function')window._setPlayerSession(profile);
});
onSnapshot(collection(db,'playerProfiles'),snap=>{
  const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
  if(typeof window._setPlayerAccounts==='function')window._setPlayerAccounts(rows);
});
onSnapshot(query(collection(db,'playerFeed'),orderBy('createdAtMs','desc'),limit(50)),snap=>{
  const posts=snap.docs.map(d=>({id:d.id,...d.data()}));
  if(typeof window._setFeedPosts==='function')window._setFeedPosts(posts);
});

window._dbSave = async function() {
  const s = window._S;
  if (!s) return;
  const jobs = [];
  jobs.push(setDoc(REF_TEAMS, {
    teams: s.teams,
    conferences: s.conferences,
    playoffBracket: s.playoffBracket,
    playoffEnabled: s.playoffEnabled,
  }, {merge:true}).catch(e=>console.warn('Save teams failed (likely >1MB — use image URLs, not uploaded files):', e)));

  jobs.push(setDoc(REF_GAMES, {
    publishedGames: s.publishedGames,
  }, {merge:true}).catch(e=>console.warn('Save games failed:', e)));

  jobs.push(setDoc(REF_MISC, {
    playerRegistry: s.playerRegistry,
    awardsData: s.awardsData,
    adminAccounts: s.adminAccounts,
    nattyEnabled: s.nattyEnabled,
    seasonNum: s.seasonNum,
    seasonStatus: s.seasonStatus,
    currentAwardsSeason: s.currentAwardsSeason,
    oddsData: s.oddsData || {},
    seriesOddsData: s.seriesOddsData || {},
    flagCoins: s.flagCoins || {},
    shopItems: s.shopItems || [],
    redeemPurchases: s.redeemPurchases || [],
    redeemAwardClaims: s.redeemAwardClaims || {},
    seasonChampions: s.seasonChampions || {},
  }, {merge:true}).catch(e=>console.warn('Save misc failed:', e)));

  await Promise.all(jobs);
};

function applyTeamsData(d) {
  const s = window._S;
  if (!s) return;
  if (Array.isArray(d.teams)) s.teams = d.teams;
  if (d.conferences && typeof d.conferences==='object') s.conferences = d.conferences;
  if (d.playoffBracket && typeof d.playoffBracket==='object') s.playoffBracket = d.playoffBracket;
  if (typeof d.playoffEnabled!=='undefined') s.playoffEnabled = d.playoffEnabled;
}
function applyGamesData(d) {
  const s = window._S;
  if (!s) return;
  if (Array.isArray(d.publishedGames)) s.publishedGames = d.publishedGames;
}
function applyMiscData(d) {
  const s = window._S;
  if (!s) return;
  if (d.playerRegistry && typeof d.playerRegistry==='object') s.playerRegistry = d.playerRegistry;
  if (d.awardsData && typeof d.awardsData==='object') s.awardsData = d.awardsData;
  if (Array.isArray(d.adminAccounts)) s.adminAccounts = d.adminAccounts;
  if (typeof d.nattyEnabled!=='undefined') s.nattyEnabled = d.nattyEnabled;
  if (d.seasonNum) s.seasonNum = d.seasonNum;
  if (d.seasonStatus) s.seasonStatus = d.seasonStatus;
  if (d.currentAwardsSeason) s.currentAwardsSeason = d.currentAwardsSeason;
  if (d.oddsData && typeof d.oddsData==='object') s.oddsData = d.oddsData;
  if (d.seriesOddsData && typeof d.seriesOddsData==='object') s.seriesOddsData = d.seriesOddsData;
  if (d.flagCoins && typeof d.flagCoins==='object') s.flagCoins = d.flagCoins;
  if (Array.isArray(d.shopItems) && d.shopItems.length) s.shopItems = d.shopItems;
  if (Array.isArray(d.redeemPurchases)) s.redeemPurchases = d.redeemPurchases;
  if (d.redeemAwardClaims && typeof d.redeemAwardClaims==='object') s.redeemAwardClaims = d.redeemAwardClaims;
  if (d.seasonChampions && typeof d.seasonChampions==='object') s.seasonChampions = d.seasonChampions;
}

// Load all three docs on start, then re-render once
let _loadCount = 0;
function _checkLoadDone(){
  _loadCount++;
  if(_loadCount>=3){
    window._dbReady = true;
    if (typeof window._firebaseReady === 'function') window._firebaseReady();
    else if (typeof window._render === 'function') window._render();
  }
}

getDoc(REF_TEAMS).then(snap => { if (snap.exists()) applyTeamsData(snap.data()); _checkLoadDone(); }).catch(()=>_checkLoadDone());
getDoc(REF_GAMES).then(snap => { if (snap.exists()) applyGamesData(snap.data()); _checkLoadDone(); }).catch(()=>_checkLoadDone());
getDoc(REF_MISC).then(snap => { if (snap.exists()) applyMiscData(snap.data()); _checkLoadDone(); }).catch(()=>_checkLoadDone());

// Live updates from other sessions
onSnapshot(REF_TEAMS, snap => {
  if (!window._dbReady || !snap.exists()) return;
  applyTeamsData(snap.data());
  if (typeof window._render === 'function') window._render();
});
onSnapshot(REF_GAMES, snap => {
  if (!window._dbReady || !snap.exists()) return;
  applyGamesData(snap.data());
  if (typeof window._render === 'function') window._render();
});
onSnapshot(REF_MISC, snap => {
  if (!window._dbReady || !snap.exists()) return;
  applyMiscData(snap.data());
  if (typeof window._render === 'function') window._render();
});
</script>

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── EXPORT ALL STATS TO CSV, ORGANIZED BY SEASON & TAB ──────────────────
function csvEscape(v){
  v = String(v==null?'':v);
  if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function exportAllStatsCSV(){
  // Group games by season
  const bySeason={};
  publishedGames.forEach(g=>{
    const sk=String(g.season||'?');
    if(!bySeason[sk]) bySeason[sk]=[];
    bySeason[sk].push(g);
  });
  const seasonKeys=Object.keys(bySeason).sort((a,b)=>{
    const na=parseFloat(a), nb=parseFloat(b);
    if(!isNaN(na)&&!isNaN(nb)) return na-nb;
    return a.localeCompare(b);
  });

  const sections=[
    {key:'passing',  label:'PASSING',   cols:['Player','Team','Week','CMP','ATT','YDS','TD','INT','RTG','LNG']},
    {key:'rushing',  label:'RUSHING',   cols:['Player','Team','Week','ATT','YDS','TD','YPC','LNG','FUM']},
    {key:'receiving',label:'RECEIVING', cols:['Player','Team','Week','TGT','REC','YDS','TD','DROP','LNG']},
    {key:'defense',  label:'DEFENSE',   cols:['Player','Team','Week','TAK','TFL','SCK','SAF','SWAT','INT','PBU','TD']},
  ];

  let out='';
  seasonKeys.forEach(sk=>{
    out += `SEASON ${sk}\n`;
    sections.forEach(sec=>{
      out += `\n${sec.label}\n`;
      out += sec.cols.map(csvEscape).join(',') + '\n';
      bySeason[sk].forEach(g=>{
        (g.teams||[]).forEach(team=>{
          const tname=team.publishedName||team.name||'';
          const arr=team[sec.key];
          if(!arr) return;
          arr.forEach(p=>{
            let row;
            if(sec.key==='passing') row=[p.name,tname,g.week,p.cmp,p.att,p.yds,p.td,p.int,p.rtg,p.lng];
            else if(sec.key==='rushing') row=[p.name,tname,g.week,p.att,p.yds,p.td,p.ypc,p.lng,p.fum];
            else if(sec.key==='receiving') row=[p.name,tname,g.week,p.tgt,p.rec,p.yds,p.td,p.drop,p.lng];
            else row=[p.name,tname,g.week,p.tak,p.tfl,p.sck,p.saf,p.swat,p.int,p.pbu,p.td];
            out += row.map(csvEscape).join(',') + '\n';
          });
        });
      });
    });
    out += '\n\n';
  });

  const blob = new Blob([out], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `UFF_stats_export_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ══════════════════════════════════════════════

function getCoinsFor(uid){ return flagCoins[uid]??2000; }
function getMyUid(){ if(!playerSession) return ''; return playerSession.uid||playerSession.id||''; }

// Has this uid ever won a given award (any season)? Returns the list of seasons where they were the #1 (winner) candidate.
function getAwardWinSeasons(uid, awardId){
  const seasons=['s1','s2','s3','s4','s5'];
  const account=playerAccountsCache.find(p=>(p.id||p.uid)===uid);
  const myName=(account&&(account.username||account.displayName))||(playerSession&&(playerSession.displayName||playerSession.username))||'';
  if(!myName) return [];
  const won=[];
  seasons.forEach(s=>{
    const list=(awardsData[s]&&awardsData[s][awardId])||[];
    if(list.length && String(list[0]).toLowerCase()===String(myName).toLowerCase()) won.push(s);
  });
  return won;
}
const SEASON_LABELS={s1:'Season 1',s2:'Season 2',s3:'Season 3',s4:'Season 4',s5:'Season 5'};

function buildRedeemPage(){
  const isLoggedIn=!!playerSession;
  const uid=getMyUid();
  const myCoins=isLoggedIn?getCoinsFor(uid):0;

  let content='';
  if(currentRedeemTab==='shop') content=buildRedeemShopTab(uid,isLoggedIn,myCoins);
  else if(currentRedeemTab==='awardredeem') content=buildRedeemAwardsTab(uid,isLoggedIn);
  else if(currentRedeemTab==='leaderboard') content=buildRedeemLeaderboardTab();
  else if(currentRedeemTab==='admin-redeem'&&authed) content=buildRedeemAdminPanel();

  return `<div class="odds-page">
    <div class="odds-hero">
      <div class="odds-hero-kicker">🎁 FlagCoin Rewards</div>
      <div class="odds-hero-title">Redeem Center</div>
      <div class="odds-hero-sub">Spend FlagCoins on in-game cosmetics, or cash in award wins for bonus coins.</div>
      ${isLoggedIn?`<div class="odds-coins-pill"><span class="coin-icon">🪙</span><span class="coin-val">${myCoins.toLocaleString()}</span><span class="coin-lbl">FlagCoins</span></div>`:''}
    </div>
    <div class="odds-tabs">
      <div class="odds-tab${currentRedeemTab==='shop'?' active':''}" data-redeem-tab="shop">In-Game Rewards</div>
      <div class="odds-tab${currentRedeemTab==='awardredeem'?' active':''}" data-redeem-tab="awardredeem">Redeem FlagCoins</div>
      <div class="odds-tab${currentRedeemTab==='leaderboard'?' active':''}" data-redeem-tab="leaderboard">Leaderboard</div>
      ${authed?`<div class="odds-tab${currentRedeemTab==='admin-redeem'?' active':''}" data-redeem-tab="admin-redeem" style="color:var(--gold)">Admin</div>`:''}
    </div>
    <div class="odds-section">${content}</div>
  </div>`;
}

    return `<div class="redeem-shop-card">

    ${!isLoggedIn?`<div style="background:rgba(240,180,41,.07);border:1px solid rgba(240,180,41,.2);border-radius:10px;padding:14px 16px;text-align:center;margin-bottom:1rem"><div style="font-size:12px;color:var(--gold);font-weight:700;margin-bottom:4px">Login to redeem rewards</div><button class="odds-submit-btn" style="margin-top:.5rem;max-width:220px;margin-left:auto;margin-right:auto" onclick="currentPage='player-access';render()">Go to Player Access →</button></div>`:''}

// ── TAB: Redeem FlagCoins via Awards ──
function buildRedeemAwardsTab(uid,isLoggedIn){
  if(!isLoggedIn){
    return `<div style="background:rgba(240,180,41,.07);border:1px solid rgba(240,180,41,.2);border-radius:10px;padding:14px 16px;text-align:center"><div style="font-size:12px;color:var(--gold);font-weight:700;margin-bottom:4px">Login to check your award eligibility</div><button class="odds-submit-btn" style="margin-top:.5rem;max-width:220px;margin-left:auto;margin-right:auto" onclick="currentPage='player-access';render()">Go to Player Access →</button></div>`;
  }
  const rows=REDEEM_AWARDS.map(a=>{
    const wonSeasons=getAwardWinSeasons(uid,a.id);
    const unclaimedSeasons=wonSeasons.filter(s=>!redeemAwardClaims[`${s}:${a.id}:${uid}`]);
    const hasAward=wonSeasons.length>0;
    const canClaim=unclaimedSeasons.length>0;
    const claimedSeasons=wonSeasons.filter(s=>redeemAwardClaims[`${s}:${a.id}:${uid}`]);
    return `<div class="redeem-award-card${hasAward?' has-award':''}">
      <div class="redeem-award-top">
        <div>
          <div class="redeem-award-abbr">${esc(a.abbr)}</div>
          <div class="redeem-award-name">${esc(a.name)}</div>
        </div>
        <span class="fc-badge">🪙 ${a.cost}</span>
      </div>
      ${hasAward?`<div class="redeem-award-seasons">Won: ${wonSeasons.map(s=>`<span class="redeem-season-chip${claimedSeasons.includes(s)?' claimed':''}">${SEASON_LABELS[s]}${claimedSeasons.includes(s)?' ✓':''}</span>`).join('')}</div>`:''}
      <button class="redeem-award-btn" ${canClaim?`data-claim-award="${a.id}" data-claim-season="${unclaimedSeasons[0]}" data-claim-cost="${a.cost}"`:'disabled'}>
        ${canClaim?`Redeem ${a.cost} FlagCoins (${SEASON_LABELS[unclaimedSeasons[0]]})`:hasAward?'Already Redeemed':'Obtain Award First!'}
      </button>
    </div>`;
  }).join('');

  return `
    <div class="odds-section-title">Cash In Your Award Wins</div>
    <div style="font-size:11px;color:var(--text2);margin-bottom:.85rem">If you've won a UFF season award, redeem it here for bonus FlagCoins. Each award win can be redeemed once. MVP, OPOY &amp; DPOY pay out <strong style="color:var(--gold)">500</strong> FlagCoins — all other awards pay <strong style="color:var(--gold)">250</strong>.</div>
    <div class="redeem-award-grid">${rows}</div>
  `;
}

// ── TAB: FlagCoin Leaderboard ──
function buildRedeemLeaderboardTab(){
  const ranked=playerAccountsCache.map(p=>{
    const uid=p.id||p.uid||'';
    return {uid,username:p.username||p.displayName||'Unknown',teamName:p.teamName||'Unassigned',coins:getCoinsFor(uid)};
  }).sort((a,b)=>b.coins-a.coins);
  const myUid=getMyUid();

  if(!ranked.length){
    return `<div class="odds-section-title">🏆 FlagCoin Leaderboard</div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:.85rem">See who's stacked the most FlagCoins across the league.</div>
      <div style="text-align:center;padding:2rem;color:var(--text2);font-size:12px">No player accounts yet.</div>`;
  }

  const topThree=ranked.slice(0,3);
  const rest=ranked.slice(3);
  const maxCoins=ranked[0].coins||1;
  const initials=name=>esc(String(name||'?').trim().slice(0,2).toUpperCase());

  // Podium order on screen: 2nd — 1st — 3rd
  const podiumOrder=[topThree[1],topThree[0],topThree[2]];
  const podiumHTML=podiumOrder.map(r=>{
    if(!r) return `<div class="fc-podium-slot fc-podium-empty"></div>`;
    const rank=topThree.indexOf(r)+1;
    const isMe=r.uid===myUid&&myUid;
    const tier=rank===1?'gold':rank===2?'silver':'bronze';
    const medal=rank===1?'🥇':rank===2?'🥈':'🥉';
    return `<div class="fc-podium-slot fc-podium-${tier}${isMe?' is-me':''}">
      <div class="fc-podium-medal">${medal}</div>
      <div class="fc-podium-avatar">${initials(r.username)}</div>
      <div class="fc-podium-name">${esc(r.username)}${isMe?' <span class="fc-you-tag">YOU</span>':''}</div>
      <div class="fc-podium-team">${esc(r.teamName)}</div>
      <div class="fc-podium-coins">🪙 ${r.coins.toLocaleString()}</div>
      <div class="fc-podium-bar"></div>
    </div>`;
  }).join('');

  const restHTML=rest.length?rest.map((r,idx)=>{
    const rank=idx+4;
    const isMe=r.uid===myUid&&myUid;
    const pct=Math.max(4,Math.round((r.coins/maxCoins)*100));
    return `<div class="fc-rank-row${isMe?' is-me':''}">
      <div class="fc-rank-num">#${rank}</div>
      <div class="fc-rank-avatar">${initials(r.username)}</div>
      <div class="fc-rank-mid">
        <div class="fc-rank-name">${esc(r.username)}${isMe?' <span class="fc-you-tag">YOU</span>':''}</div>
        <div class="fc-rank-team">${esc(r.teamName)}</div>
        <div class="fc-rank-bar-track"><div class="fc-rank-bar-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="fc-rank-coins">🪙 ${r.coins.toLocaleString()}</div>
    </div>`;
  }).join(''):'';

  return `
    <div class="odds-section-title">🏆 FlagCoin Leaderboard</div>
    <div style="font-size:11px;color:var(--text2);margin-bottom:1rem">See who's stacked the most FlagCoins across the league.</div>
    <div class="fc-podium-wrap">${podiumHTML}</div>
    ${restHTML?`<div class="fc-rank-list">${restHTML}</div>`:''}
  `;
}

    <div style="margin-bottom:.75rem"><label>Paste Full Stat Block</label><textarea id="stat-input" placeholder="Paste full stat block. Format: TEAM NAME Stats&#10;Passing player | stats...&#10;Receiving player | stats...&#10;Defense player | stats...&#10;TEAM 2 NAME Stats&#10;..."></textarea></div>
    <button class="btn btn-primary" id="parse-btn">Parse & Import</button>
    <div id="parse-error" style="display:none" class="err"></div>
  </div>`;
  if(parsedData&&parsedData.teams){
    html+=`<div class="card"><div class="card-title">Parsed Results</div>
      <p style="font-size:11px;color:var(--muted);margin-bottom:1rem">Season <b style="color:#fff">${esc(parsedData.season)}</b> · Week <b style="color:#fff">${esc(parsedData.week)}</b> · ${parsedData.teams.length} teams</p>`;
    parsedData.teams.forEach((team,ti)=>{
      html+=`<div class="team-block"><div class="team-header">${esc(team.name)}
        <div style="margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="font-size:10px;color:var(--muted)">Assign to:</span>
          <select id="tassign-${ti}" style="background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:11px;outline:none">
            ${parsedData.teams.map(t=>`<option value="${esc(t.name)}"${t.name===team.name?' selected':''}>${esc(t.name)}</option>`).join('')}
            <option value="__custom__">Custom...</option>
          </select>
          <input type="text" id="tcustom-${ti}" placeholder="Custom name" style="display:none;width:140px;padding:4px 8px;font-size:11px">
        </div>
      </div>`;
      ['passing','rushing','receiving','defense'].forEach(sec=>{
        if(!team[sec]||!team[sec].length) return;
        html+=`<div class="sec-div">${sec.toUpperCase()}</div>`;
        team[sec].forEach((p,pi)=>{
          let stats='';
          if(sec==='passing') stats=`${p.cmp||'?'}/${p.att||'?'} · ${p.yds||0} YDS · ${p.td||0} TD · ${p.int||0} INT`;
          else if(sec==='rushing') stats=`${p.att||0} ATT · ${p.yds||0} YDS · ${p.td||0} TD`;
          else if(sec==='receiving') stats=`${p.rec||0}/${p.tgt||0} REC · ${p.yds||0} YDS · ${p.td||0} TD`;
          else stats=`${p.tak||0} TAK · ${p.int||0} INT · ${p.sck||0} SCK`;
          html+=`<div class="player-row"><span class="pname">${esc(p.name)}</span><span class="pstats">${stats}</span>
            <div class="passign"><select id="passign-${ti}-${sec}-${pi}">${parsedData.teams.map(t=>`<option value="${esc(t.name)}"${t.name===team.name?' selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
          </div>`;
        });
      });
      html+=`</div>`;
    });
    html+=`<button class="btn btn-publish" id="pub-btn">Publish Game</button><div id="pub-msg" style="display:none" class="ok"></div></div>`;
  }
  return html;
}

function buildHomePage(){
  // Compute performers & data
  const allPass=[],allRush=[],allRec=[],allDef=[];
  publishedGames.forEach(g=>{
    g.teams.forEach(team=>{
      const tn=team.publishedName||team.name;
      if(team.passing)team.passing.forEach(p=>allPass.push({...p,teamName:tn}));
      if(team.rushing)team.rushing.forEach(p=>allRush.push({...p,teamName:tn}));
      if(team.receiving)team.receiving.forEach(p=>allRec.push({...p,teamName:tn}));
      if(team.defense)team.defense.forEach(p=>allDef.push({...p,teamName:tn}));
    });
  });
  allPass.sort((a,b)=>(+b.yds||0)-(+a.yds||0));
  allRush.sort((a,b)=>(+b.yds||0)-(+a.yds||0));
  allRec.sort((a,b)=>(+b.yds||0)-(+a.yds||0));
  allDef.sort((a,b)=>((+b.tak||0)+(+b.sck||0)*2+(+b.int||0)*2)-((+a.tak||0)+(+a.sck||0)*2+(+a.int||0)*2));
  const tp=allPass[0],tr=allRush[0],trec=allRec[0],td=allDef[0];

  // Season status config
  const cfg={
    'IN-SEASON':{label:'Series 1',sub:'4 series → Playoffs W9',playoffs:'Week 9',series:'Series 1'},
    'PRE-SEASON':{label:'Pre-Season',sub:'Season starting soon',playoffs:'TBD',series:'Pre'},
    'POST-SEASON':{label:'Post-Season',sub:'Season complete',playoffs:'Complete',series:'Final'},
  };
  const sc=cfg[seasonStatus]||cfg['IN-SEASON'];

  // Conference leaders from teams
  const confGroups={};
  teams.forEach(t=>{
    const conf=t.conference||'GRAND CENTRAL';
    if(!confGroups[conf]) confGroups[conf]=[];
    confGroups[conf].push(t);
  });
  const confKeys=Object.keys(confGroups);

  // Top performers list (top 3 passers)
  const perfRows=allPass.slice(0,3).map((p,i)=>`
    <div class="hm-perf-row">
      <div class="hm-perf-rank">${i+1}</div>

        <div class="hm-perf-cat">YDS</div>
      </div>

  // Power rankings from teams (by record if available, else order)
  const rankRows=teams.slice(0,5).map((t,i)=>{
    const posClass=i<3?`hm-rank-pos-${i+1}`:'hm-rank-pos-n';

  const qaItems=[
    {icon:'📅',label:'Schedule',sub:'Week 8 Results',page:'public-games'},
    {icon:'🏆',label:'Playoffs',sub:'Starting Week 9',page:'public-games'},

      <div class="info-card" style="display:inline-block;min-width:160px">
        <div class="info-card-label">#1 SEED</div>
        <div class="info-card-val" style="color:#fff;font-size:16px">${teams.length?esc(teams[0].name.substring(0,10).toUpperCase())+' 0-0':'ALA 0-0'}</div>
      </div>
    </div>

    <!-- Three Widget Row: Top Performers | Power Rankings | Recent Trades -->
    <div class="home-main-grid" style="padding:.25rem 1.25rem .75rem">
      <!-- Top Performers -->
      <div class="hm-card">
        <div class="hm-card-hdr">
          <span class="hm-card-icon">⭐</span>
          <span class="hm-card-title">TOP PERFORMERS</span>
          <span class="hm-card-action" data-page="public-lb">View All ›</span>
        </div>
        ${allPass.length?perfRows:`<div class="hm-empty">No stats yet.</div>`}
      </div>

      <!-- Power Rankings -->
      <div class="hm-card">
        <div class="hm-card-hdr">
          <span class="hm-card-icon">📊</span>
          <span class="hm-card-title">POWER RANKINGS</span>
          <span class="hm-card-action" data-page="public-teams">Full ›</span>
        </div>
        ${teams.length?rankRows:`<div class="hm-empty">No teams yet.</div>`}

      <!-- Recent Trades -->
      <div class="hm-card">
        <div class="hm-card-hdr">
          <span class="hm-card-icon">🔄</span>
          <span class="hm-card-title">RECENT TRADES</span>

    <div class="home-section-grid">

      <div class="hm-card">
        <div class="hm-card-hdr">
          <span class="hm-card-title">QUICK ACCESS</span>

          ${qaItems.map(q=>`<div class="qa-item" data-page="${q.page}">
            <div class="qa-icon">${q.icon}</div>
            <div class="qa-label">${q.label}</div>
            <div class="qa-sub">${q.sub}</div>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function buildGamesList(){

  publishedGames.forEach((g,i)=>{
    const t0=g.teams[0],t1=g.teams[1];
    const n0=t0?(t0.publishedName||t0.name):(g.homeName||'TBD');
    const n1=t1?(t1.publishedName||t1.name):(g.awayName||'TBD');
    const s0=g.homeScore!==undefined?g.homeScore:'?';
    const s1=g.awayScore!==undefined?g.awayScore:'?';
    const r0=g.homeRank?`<span style="color:var(--gold);font-size:10px;font-weight:700">#${esc(g.homeRank)} </span>`:'';
    const r1=g.awayRank?`<span style="color:var(--gold);font-size:10px;font-weight:700">#${esc(g.awayRank)} </span>`:'';

    const sc=status==='LIVE'?'#f87171':status==='UPCOMING'?'#60a5fa':'var(--muted)';
    html+=`<div class="gc" data-gidx="${i}">

          ${g.homeImage?`<img src="${g.homeImage}" class="gc-team-logo">`:`<div class="gc-team-logo-placeholder">⬡</div>`}

        <div class="gc-team">

      </div>
    </div>`;
  });
  return html+`</div>`;

  html+=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;text-align:center">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;letter-spacing:3px;color:var(--lime);margin-bottom:4px">🏆 UFB · UNITED FLAG BOWL 🏆</div>
    <div style="display:inline-flex;align-items:center;gap:5px;background:rgba(200,241,53,.12);border:1px solid rgba(200,241,53,.3);border-radius:20px;padding:3px 12px;font-size:10px;font-weight:700;color:var(--lime);font-family:'Barlow Condensed',sans-serif;margin-bottom:1.25rem">Week 11 · UFB</div>
