<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFF — United Football League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --lime:#c8f135;
  --cyan:#00d4ff;
  --blue:#1d6ef5;
  --red:#ff3b3b;
  --gold:#f0b429;
  --muted:#4b5a6e;
  --surface:#080e17;
  --surface2:#0d1520;
  --surface3:#121f2e;
  --surface4:#182638;
  --border:#1a2a3d;
  --border2:#1e3248;
  --text:#dce8f5;
  --text2:#6b8099;
}

/* ── LOADING SCREEN ── */
#loading-screen{
  position:fixed;inset:0;z-index:9999;
  background:var(--surface);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity .5s ease;
}
#loading-screen.fade-out{opacity:0;pointer-events:none}
.ls-logo-wrap{position:relative;width:100px;height:100px;margin-bottom:2.2rem;}
.ls-ring{
  position:absolute;inset:-10px;border-radius:50%;
  border:2px solid transparent;
  border-top-color:var(--lime);
  border-right-color:rgba(200,241,53,.3);
  animation:lspin 1.2s linear infinite;
}
@keyframes lspin{to{transform:rotate(360deg)}}
.ls-logo{width:100px;height:100px;border-radius:50%;object-fit:cover;display:block;border:2px solid rgba(200,241,53,.25);}
.ls-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;letter-spacing:5px;text-transform:uppercase;color:#fff;margin-bottom:2px;}
.ls-sub{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:8px;text-transform:uppercase;color:var(--lime);margin-bottom:2.5rem;}
.ls-track{width:200px;height:2px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;margin-bottom:10px;}
.ls-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--lime),var(--cyan));border-radius:4px;transition:width .2s ease;}
.ls-pct{font-size:11px;font-weight:600;letter-spacing:2px;color:var(--cyan);}
.ls-msg{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:8px;}

/* ── BODY ── */
html,body{height:100%;overflow-x:hidden;}
body{
  font-family:'Inter',sans-serif;
  background:var(--surface);
  color:var(--text);
  min-height:100vh;
}

/* ── TOP BAR ── */
.top-bar{
  position:fixed;top:0;left:0;right:0;
  height:58px;z-index:200;
  background:rgba(8,14,23,.95);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 1.25rem;
  gap:1rem;
  backdrop-filter:blur(12px);
}
.top-bar-left{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.top-bar-logo{width:36px;height:36px;border-radius:8px;object-fit:cover;border:1.5px solid rgba(200,241,53,.3);}
.top-bar-brand{}
.top-bar-name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;letter-spacing:2px;text-transform:uppercase;color:#fff;line-height:1;}
.top-bar-sub{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--lime);line-height:1;}
.top-bar-right{flex:1;max-width:320px;}
.top-search-wrap{display:flex;align-items:center;gap:8px;background:var(--surface3);border:1px solid var(--border);border-radius:8px;padding:7px 12px;}
.top-search-icon{font-size:13px;color:var(--text2);flex-shrink:0;}
.top-search{background:none;border:none;outline:none;color:var(--text);font-size:12px;width:100%;font-family:'Inter',sans-serif;}
.top-search::placeholder{color:var(--text2)}

/* ── PAGE BODY ── */
.page-body{
  margin-top:58px;
  margin-bottom:64px;
  min-height:calc(100vh - 58px - 64px);
}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:64px;z-index:200;
  background:rgba(8,14,23,.97);
  border-top:1px solid var(--border);
  display:flex;align-items:center;
  backdrop-filter:blur(12px);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:3px;cursor:pointer;padding:6px 4px;
  transition:all .15s;
}
.bn-item:hover .bn-icon{color:#fff}
.bn-item:hover .bn-label{color:#fff}
.bn-icon{font-size:18px;color:var(--text2);transition:all .15s;line-height:1;}
.bn-label{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2);transition:all .15s;}
.bn-item.active .bn-icon{color:var(--lime);}
.bn-item.active .bn-label{color:var(--lime);}
.bn-item.active{position:relative;}
.bn-item.active::before{
  content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:32px;height:2px;background:var(--lime);border-radius:0 0 4px 4px;
}

/* ── HOME WRAP ── */
.home-wrap{padding-bottom:.5rem;}

/* ── HOME HERO ── */
.home-hero-section{
  padding:1rem 1.25rem .75rem;
  background:var(--surface);
}
.home-hero-search{
  display:flex;align-items:center;gap:10px;
  background:var(--surface3);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 14px;
}
.hhs-icon{font-size:14px;color:var(--text2);}
.hhs-input{background:none;border:none;outline:none;color:var(--text);font-size:13px;width:100%;font-family:'Inter',sans-serif;}
.hhs-input::placeholder{color:var(--text2)}

/* ── INFO CARDS ROW ── */
.home-info-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
  gap:.5rem;
  padding:.75rem 1.25rem;
  background:var(--surface);
}
.info-card{
  background:var(--surface3);
  border:1px solid var(--border);
  border-radius:10px;
  padding:.75rem .9rem;
  min-width:0;
}
.info-card-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:4px;font-family:'Barlow Condensed',sans-serif;}
.info-card-val{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;line-height:1;color:var(--lime);}
.info-card-sub{font-size:9px;color:var(--text2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── HOME MAIN GRID ── */
.home-main-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:.75rem;
  padding:.75rem 1.25rem;
}
@media(max-width:900px){.home-main-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:600px){.home-main-grid{grid-template-columns:1fr;}}

/* ── HM CARD ── */
.hm-card{
  background:var(--surface3);
  border:1px solid var(--border);
  border-radius:12px;
  padding:1rem;
  margin:0 1.25rem .75rem;
}
.home-main-grid .hm-card{margin:0;}
.hm-card-hdr{
  display:flex;align-items:center;gap:7px;
  margin-bottom:.85rem;
  padding-bottom:.6rem;
  border-bottom:1px solid var(--border);
}
.hm-card-icon{font-size:13px;opacity:.7;}
.hm-card-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
  color:#fff;flex:1;
}
.hm-card-action{
  font-size:10px;font-weight:600;
  color:var(--lime);cursor:pointer;
  letter-spacing:.5px;transition:opacity .15s;
  white-space:nowrap;
}
.hm-card-action:hover{opacity:.7}

/* ── PERFORMERS ── */
.perf-list{display:flex;flex-direction:column;gap:6px;}
.perf-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);}
.perf-row:last-child{border-bottom:none}
.perf-avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,rgba(200,241,53,.2),rgba(0,212,255,.1));
  border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:14px;
  color:var(--lime);flex-shrink:0;
}
.perf-info{flex:1;min-width:0;}
.perf-name{font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.perf-team{font-size:9px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.perf-right{text-align:right;flex-shrink:0;}
.perf-val{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--lime);}
.perf-cat{font-size:8px;letter-spacing:1.5px;color:var(--text2);text-transform:uppercase;font-weight:600;}

/* ── POWER RANKINGS ── */
.rank-list{display:flex;flex-direction:column;gap:5px;}
.rank-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);}
.rank-row:last-child{border-bottom:none}
.rank-pos{
  width:22px;height:22px;border-radius:6px;
  font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.rank-pos-1{background:rgba(200,241,53,.15);color:var(--lime);}
.rank-pos-2{background:rgba(148,163,184,.1);color:#94a3b8;}
.rank-pos-3{background:rgba(205,127,50,.1);color:#cd7f32;}
.rank-pos-4,.rank-pos-5{background:var(--surface4);color:var(--text2);}
.rank-name{flex:1;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-rec{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text2);flex-shrink:0;}

/* ── CONF LEADERS ── */
.home-section-grid{
  display:grid;grid-template-columns:1fr 2fr;
  gap:.75rem;padding:.25rem 1.25rem;
}
@media(max-width:700px){.home-section-grid{grid-template-columns:1fr;}}
.conf-list{display:flex;flex-direction:column;gap:.6rem;}
.conf-group{padding:.6rem 0;border-bottom:1px solid var(--border);}
.conf-group:last-child{border-bottom:none}
.conf-group-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:5px;font-family:'Barlow Condensed',sans-serif;}
.conf-team-row{display:flex;align-items:center;justify-content:space-between;}
.conf-team-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;letter-spacing:1px;color:#fff;text-transform:uppercase;}
.conf-team-rec{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text2);}

/* ── QUICK ACCESS GRID ── */
.qa-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:.5rem;
}
.qa-item{
  background:var(--surface4);
  border:1px solid var(--border);
  border-radius:10px;
  padding:.75rem .6rem;
  cursor:pointer;transition:all .15s;
  text-align:center;
}
.qa-item:hover{border-color:var(--lime);background:rgba(200,241,53,.06);}
.qa-icon{font-size:18px;margin-bottom:5px;}
.qa-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#fff;line-height:1.1;}
.qa-sub{font-size:9px;color:var(--text2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── HM WIDGET ROWS ── */
.hm-perf-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);}
.hm-perf-row:last-child{border-bottom:none}
.hm-perf-rank{width:16px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--text2);flex-shrink:0;}
.hm-perf-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,rgba(200,241,53,.2),rgba(0,212,255,.1));border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:12px;color:var(--lime);flex-shrink:0;}
.hm-perf-info{flex:1;min-width:0;}
.hm-perf-name{font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hm-perf-team{font-size:9px;color:var(--text2);margin-top:1px;}
.hm-perf-right{text-align:right;flex-shrink:0;}
.hm-perf-val{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--lime);}
.hm-perf-cat{font-size:8px;letter-spacing:1.5px;color:var(--text2);text-transform:uppercase;}
.hm-rank-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);}
.hm-rank-row:last-child{border-bottom:none}
.hm-rank-pos{width:20px;height:20px;border-radius:5px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hm-rank-pos-1{background:rgba(200,241,53,.15);color:var(--lime);}
.hm-rank-pos-2{background:rgba(148,163,184,.1);color:#94a3b8;}
.hm-rank-pos-3{background:rgba(205,127,50,.1);color:#cd7f32;}
.hm-rank-pos-n{background:var(--surface4);color:var(--text2);}
.hm-rank-name{flex:1;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hm-rank-rec{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--text2);flex-shrink:0;}
.hm-conf-list{display:flex;flex-direction:column;gap:.5rem;}
.hm-conf-group{padding:.5rem 0;border-bottom:1px solid var(--border);}
.hm-conf-group:last-child{border-bottom:none}
.hm-conf-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--lime);margin-bottom:5px;font-family:'Barlow Condensed',sans-serif;}
.hm-conf-row{display:flex;align-items:center;justify-content:space-between;}
.hm-conf-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:1px;color:#fff;text-transform:uppercase;}
.hm-conf-rec{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--text2);}
.hm-empty{font-size:11px;color:var(--text2);padding:.5rem 0;text-align:center;}

.de-toggle-label{display:flex;align-items:center;gap:4px;cursor:pointer;padding:3px 7px;border-radius:6px;border:1px solid rgba(200,241,53,.3);background:rgba(200,241,53,.06);transition:all .15s;}
.de-toggle-label:has(input:checked){background:rgba(200,241,53,.16);border-color:var(--lime);}
.de-tak-toggle{accent-color:var(--lime);width:12px;height:12px;cursor:pointer;}
.de-toggle-text{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;color:var(--lime);text-transform:uppercase;}

/* ── RECENT GAMES ── */
.rg-row{
  display:flex;align-items:center;gap:.5rem;
  padding:8px 0;border-bottom:1px solid var(--border);
}
.rg-row:last-child{border-bottom:none}
.rg-side{display:flex;align-items:center;gap:7px;flex:1;min-width:0;}
.rg-side-r{flex-direction:row-reverse;text-align:right;}
.rg-logo{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border);}
.rg-logo-ph{background:var(--surface4);display:flex;align-items:center;justify-content:center;font-size:10px;}
.rg-tname{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:#fff;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rg-mid{text-align:center;flex-shrink:0;min-width:80px;}
.rg-score{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;color:#fff;}
.rg-st{font-size:8px;letter-spacing:2px;text-transform:uppercase;font-weight:700;}
.empty-sm{font-size:11px;color:var(--text2);padding:.75rem 0;text-align:center;}

/* ── INNER PAGES (Games/LB/Teams/Admin) ── */
.inner-page{min-height:100%;}
.inner-page-header{
  padding:1.25rem 1.25rem 1rem;
  background:var(--surface2);
  border-bottom:1px solid var(--border);
}
.iph-eyebrow{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:3px;
  text-transform:uppercase;color:var(--lime);margin-bottom:.3rem;
}
.iph-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:32px;font-weight:900;letter-spacing:1px;
  text-transform:uppercase;color:#fff;line-height:1;
}
.iph-title .role-badge{font-size:12px;vertical-align:middle;margin-left:8px;}
.iph-sub{font-size:11px;color:var(--text2);margin-top:.3rem;}

.role-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:2px 10px;border-radius:20px;text-transform:uppercase;}
.role-owner{background:rgba(167,139,250,.15);color:#a78bfa;border:1px solid rgba(167,139,250,.3);}
.role-admin{background:rgba(200,241,53,.1);color:var(--lime);border:1px solid rgba(200,241,53,.25);}

.inner-content{padding:1.25rem;}

/* ── CARDS / FORMS ── */
.card{background:var(--surface3);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;}
.card-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--lime);margin-bottom:.9rem;}
textarea{width:100%;background:var(--surface4);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-family:'Inter',sans-serif;font-size:12px;resize:vertical;min-height:140px;outline:none;transition:border-color .2s;}
textarea:focus{border-color:var(--lime)}
input[type=text],input[type=password]{background:var(--surface4);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;font-family:'Inter',sans-serif;font-size:13px;outline:none;width:100%;transition:border-color .2s;}
input[type=text]:focus,input[type=password]:focus{border-color:var(--lime)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem}
label{font-size:9px;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:5px;font-weight:600;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--lime);color:#080e17}
.btn-primary:hover{background:#d8f540;}
.btn-publish{background:linear-gradient(135deg,var(--lime),var(--cyan));color:#080e17;width:100%;justify-content:center;padding:12px;font-size:12px;font-weight:800;letter-spacing:1.5px;border-radius:8px;}
.btn-publish:hover{opacity:.9}
.btn-danger{background:rgba(255,59,59,.1);color:#ff6666;border:1px solid rgba(255,59,59,.25);}
.btn-danger:hover{background:rgba(255,59,59,.2)}
.btn-sm{padding:5px 10px;font-size:10px}
.err{background:rgba(255,59,59,.08);border:1px solid rgba(255,59,59,.25);border-radius:8px;padding:9px 12px;color:#ff7070;font-size:11px;margin-top:8px;}
.ok{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:8px;padding:9px 12px;color:#4ade80;font-size:11px;margin-top:8px;}

/* ── TABS ── */
.stat-tabs{display:flex;gap:3px;margin-bottom:1rem;flex-wrap:wrap;background:var(--surface4);padding:4px;border-radius:10px;border:1px solid var(--border);}
.stat-tab{padding:7px 14px;border-radius:7px;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;color:var(--text2);transition:all .15s;border:none;background:transparent;}
.stat-tab:hover{color:#fff}
.stat-tab.active{background:var(--lime);color:#080e17;font-weight:700}

.lb-tab-dropdown{position:relative;display:inline-block;}
/* Awards page transparent glass style */
.awards-glass-bg{
  background:linear-gradient(135deg,rgba(8,14,23,.85) 0%,rgba(13,21,32,.9) 100%);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, setDoc, getDoc, getDocs, onSnapshot, collection, writeBatch } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDUFgudK3DG_oDVlbvzPtg8aB3OC6KO31o",
  authDomain: "uff-league-website.firebaseapp.com",
  projectId: "uff-league-website",
  storageBucket: "uff-league-website.firebasestorage.app",
  messagingSenderId: "823407844978",
  appId: "1:823407844978:web:85535ef71113a255a26ceb"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const REF = doc(db, 'league', 'state');
const TEAMS_COL = collection(db, 'teams');

// Save main state WITHOUT images, save each team image separately
window._dbSave = async function() {
  const s = window._S;
  if (!s) return;
  try {
    // Strip images from teams before saving to main doc (avoids 1MB Firestore limit)
    const teamsNoImages = s.teams.map(t => ({
      name: t.name,
      headCoach: t.headCoach || '',
      owner: t.owner || '',
      imageIsFile: !!t.imageIsFile,
      // store a flag so we know image lives in teams collection
      hasImage: !!(t.image && t.imageIsFile),
      // keep URL-based images inline (they're tiny strings, not base64 blobs)
      image: t.imageIsFile ? '' : (t.image || ''),
    }));

    // Save main state doc without base64 images
    await setDoc(REF, {
      teams: teamsNoImages,
      publishedGames: s.publishedGames,
      playerRegistry: s.playerRegistry,
      awardsData: s.awardsData,
      adminAccounts: s.adminAccounts,
      conferences: s.conferences,
      playoffBracket: s.playoffBracket,
      playoffEnabled: s.playoffEnabled,
      nattyEnabled: s.nattyEnabled,
      seasonNum: s.seasonNum,
      seasonStatus: s.seasonStatus,
      currentAwardsSeason: s.currentAwardsSeason,
    }, {merge:true});

    // Save each team with a file image into its own document in the 'teams' collection
    for (const t of s.teams) {
      if (t.image && t.imageIsFile) {
        const teamRef = doc(db, 'teams', t.name.replace(/[^a-zA-Z0-9_-]/g, '_'));
        await setDoc(teamRef, { name: t.name, image: t.image }, {merge:true});
      }
    }
  } catch(e) { console.warn('Save failed', e); }
};

function applyData(d, teamImages) {
  const s = window._S;
  if (!s) return;
  if (Array.isArray(d.teams)) {
    // Restore images from teamImages map into each team
    s.teams = d.teams.map(t => ({
      ...t,
      image: t.imageIsFile ? (teamImages[t.name.replace(/[^a-zA-Z0-9_-]/g, '_')] || '') : (t.image || ''),
    }));
  }
  if (Array.isArray(d.publishedGames)) s.publishedGames = d.publishedGames;
  if (d.playerRegistry && typeof d.playerRegistry==='object') s.playerRegistry = d.playerRegistry;
  if (d.awardsData && typeof d.awardsData==='object') s.awardsData = d.awardsData;
  if (Array.isArray(d.adminAccounts)) s.adminAccounts = d.adminAccounts;
  if (d.conferences && typeof d.conferences==='object') s.conferences = d.conferences;
  if (d.playoffBracket && typeof d.playoffBracket==='object') s.playoffBracket = d.playoffBracket;
  if (typeof d.playoffEnabled!=='undefined') s.playoffEnabled = d.playoffEnabled;
  if (typeof d.nattyEnabled!=='undefined') s.nattyEnabled = d.nattyEnabled;
  if (d.seasonNum) s.seasonNum = d.seasonNum;
  if (d.seasonStatus) s.seasonStatus = d.seasonStatus;
  if (d.currentAwardsSeason) s.currentAwardsSeason = d.currentAwardsSeason;
}

function waitAndBoot() {
  if (!window._S) { setTimeout(waitAndBoot, 50); return; }

  // Load main state + all team image docs in parallel
  Promise.all([
    getDoc(REF),
    getDocs(TEAMS_COL)
  ]).then(([snap, teamSnaps]) => {
    // Build a map of teamKey -> image
    const teamImages = {};
    teamSnaps.forEach(d => { teamImages[d.id] = d.data().image || ''; });

    if (snap.exists()) applyData(snap.data(), teamImages);
    window._dbReady = true;
    if (typeof window._firebaseReady === 'function') window._firebaseReady();
  }).catch(e => {
    console.warn('DB load failed:', e);
    window._dbReady = true;
    if (typeof window._firebaseReady === 'function') window._firebaseReady();
  });

  // Live updates from other sessions (main state only; images rarely change live)
  onSnapshot(REF, snap => {
    if (!window._dbReady || !snap.exists()) return;
    // Re-fetch team images when main state updates so images stay in sync
    getDocs(TEAMS_COL).then(teamSnaps => {
      const teamImages = {};
      teamSnaps.forEach(d => { teamImages[d.id] = d.data().image || ''; });
      applyData(snap.data(), teamImages);
      if (typeof window._render === 'function') window._render();
    });
  });
}
waitAndBoot();

// Debounced auto-save — fires 1.5s after any render
let _saveTimer = null;
function scheduleSave(){
  if(!window._dbReady) return;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(()=>{ if(window._dbSave) window._dbSave(); }, 1500);
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  attachEvents();

}

function buildNav(){
  const items=[
    {id:'public-home', label:'Home', icon:'⊞'},
    {id:'public-games', label:'Games', icon:'◉'},
    {id:'public-lb', label:'Leaderboards', icon:'▦'},

  const adminId=authed?'admin':'login';
  return `

  <div class="sidebar-toggle" id="sidebar-toggle">☰</div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="${BADGE}" alt="UFF">
      <div class="sidebar-logo-text"><span>UFF</span><br>Statistics</div>
    </div>
    <nav class="sidebar-nav">
      ${items.map(t=>`
        <div class="sidebar-item${currentPage===t.id?' active':''}" data-page="${t.id}">
          <span class="si-icon">${t.icon}</span>
          <span>${t.label}</span>
          ${currentPage===t.id?'<span class="si-dot"></span>':''}
        </div>`).join('')}
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-admin-btn${(currentPage==='admin'||currentPage==='login')?' active':''}" data-page="${adminId}">

      ${authed?`<div class="sidebar-admin-btn" id="logout-btn" style="color:var(--red)"><span class="si-icon">⏏</span><span>Logout</span></div>`:''}
    </div>
  </aside>`;
}

function buildPageContent(){
  if(currentPage==='login') return buildLoginPage();
  if(currentPage==='admin') return buildAdminPage();
  if(currentPage==='public-home') return buildHomePage();
  if(currentPage==='public-games') return buildGamesPage();
  if(currentPage==='public-lb') return buildLeaderboardPage();
  if(currentPage==='public-teams') return buildTeamsPage();
  if(currentPage==='public-awards') return buildAwardsPage();
  if(currentPage==='public-watchlist') return buildWatchlistPage();
  return '';
}

function buildImportTab(){
  let html=`<div class="card">
    <div class="card-title">Import Stat Block</div>
    <div class="row2">
      <div><label>Season</label><input type="text" id="inp-season" value="9" placeholder="e.g. 9"></div>
      <div><label>Week</label><input type="text" id="inp-week" placeholder="e.g. 11"></div>
    </div>
    <div style="margin-bottom:.75rem"><label>Paste Full Stat Block</label><textarea id="stat-input" placeholder="Paste full stat block. Format: TEAM NAME Stats&#10;Passing player | stats...&#10;Receiving player | stats...&#10;Defense player | stats...&#10;TEAM 2 NAME Stats&#10;..."></textarea></div>
    <button class="btn btn-primary" id="parse-btn">Parse & Import</button>
    <div id="parse-error" style="display:none" class="err"></div>
  </div>`;
  if(parsedData&&parsedData.teams){
    html+=`<div class="card"><div class="card-title">Parsed Results</div>
      <p style="font-size:11px;color:var(--muted);margin-bottom:1rem">Season <b style="color:#fff">${esc(parsedData.season)}</b> · Week <b style="color:#fff">${esc(parsedData.week)}</b> · ${parsedData.teams.length} teams</p>`;
    parsedData.teams.forEach((team,ti)=>{
      html+=`<div class="team-block"><div class="team-header">${esc(team.name)}
        <div style="margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="font-size:10px;color:var(--muted)">Assign to:</span>
          <select id="tassign-${ti}" style="background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:11px;outline:none">
            ${parsedData.teams.map(t=>`<option value="${esc(t.name)}"${t.name===team.name?' selected':''}>${esc(t.name)}</option>`).join('')}
            <option value="__custom__">Custom...</option>
          </select>
          <input type="text" id="tcustom-${ti}" placeholder="Custom name" style="display:none;width:140px;padding:4px 8px;font-size:11px">
        </div>
      </div>`;
      ['passing','rushing','receiving','defense'].forEach(sec=>{
        if(!team[sec]||!team[sec].length) return;
        html+=`<div class="sec-div">${sec.toUpperCase()}</div>`;
        team[sec].forEach((p,pi)=>{
          let stats='';
          if(sec==='passing') stats=`${p.cmp||'?'}/${p.att||'?'} · ${p.yds||0} YDS · ${p.td||0} TD · ${p.int||0} INT`;
          else if(sec==='rushing') stats=`${p.att||0} ATT · ${p.yds||0} YDS · ${p.td||0} TD`;
          else if(sec==='receiving') stats=`${p.rec||0}/${p.tgt||0} REC · ${p.yds||0} YDS · ${p.td||0} TD`;
          else stats=`${p.tak||0} TAK · ${p.int||0} INT · ${p.sck||0} SCK`;
          html+=`<div class="player-row"><span class="pname">${esc(p.name)}</span><span class="pstats">${stats}</span>
            <div class="passign"><select id="passign-${ti}-${sec}-${pi}">${parsedData.teams.map(t=>`<option value="${esc(t.name)}"${t.name===team.name?' selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
          </div>`;
        });
      });
      html+=`</div>`;
    });
    html+=`<button class="btn btn-publish" id="pub-btn">Publish Game</button><div id="pub-msg" style="display:none" class="ok"></div></div>`;
  }
  return html;
}

function buildManageTab(){
  if(!publishedGames.length) return `<div class="card"><div class="empty">No games published yet.</div></div>`;
  let html=`<div class="card"><div class="card-title">Published Games</div>`;
  publishedGames.forEach((g,i)=>{
    const names=g.teams.map(t=>t.publishedName||t.name);
    const hasScore=(g.homeScore&&g.homeScore!=='?')||(g.awayScore&&g.awayScore!=='?');
    const scoreLabel=hasScore?`${g.homeScore}–${g.awayScore}`:'No score';
    const scoreBadge=hasScore
      ?`<span style="font-size:11px;font-weight:700;color:#fff;background:rgba(200,241,53,.12);border:1px solid rgba(200,241,53,.3);border-radius:6px;padding:2px 8px">${esc(scoreLabel)}</span>`
      :`<span style="font-size:11px;font-weight:700;color:var(--red);background:rgba(255,59,59,.1);border:1px solid rgba(255,59,59,.25);border-radius:6px;padding:2px 8px">⚠ No score</span>`;
    html+=`<div class="game-row-admin">
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:700;color:#fff">${esc(names[0]||'?')} vs ${esc(names[1]||'?')}</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:3px">
          <span style="font-size:10px;color:var(--muted)">S${esc(g.season)} · W${esc(g.week)} · ${g.date||''}</span>
          ${scoreBadge}
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button class="btn btn-sm" style="background:rgba(200,241,53,.12);border:1px solid rgba(200,241,53,.3);color:var(--lime)" data-editscore="${i}">Edit Score</button>
        <button class="btn btn-danger btn-sm" data-del="${i}">Delete</button>
      </div>
    </div>`;
  });
  return html+`</div>`;
}

function buildTeamOptions(selectedName){

  if(!teams.length) opts=`<option value="">No teams yet — add them in the Teams tab</option>`;
  return opts;
}

function buildHomePage(){
  // Compute performers & data
  const allPass=[],allRush=[],allRec=[],allDef=[];
  publishedGames.forEach(g=>{
    g.teams.forEach(team=>{
      const tn=team.publishedName||team.name;
      if(team.passing)team.passing.forEach(p=>allPass.push({...p,teamName:tn}));
      if(team.rushing)team.rushing.forEach(p=>allRush.push({...p,teamName:tn}));
      if(team.receiving)team.receiving.forEach(p=>allRec.push({...p,teamName:tn}));
      if(team.defense)team.defense.forEach(p=>allDef.push({...p,teamName:tn}));
    });
  });
  allPass.sort((a,b)=>(+b.yds||0)-(+a.yds||0));
  allRush.sort((a,b)=>(+b.yds||0)-(+a.yds||0));
  allRec.sort((a,b)=>(+b.yds||0)-(+a.yds||0));
  allDef.sort((a,b)=>((+b.tak||0)+(+b.sck||0)*2+(+b.int||0)*2)-((+a.tak||0)+(+a.sck||0)*2+(+a.int||0)*2));
  const tp=allPass[0],tr=allRush[0],trec=allRec[0],td=allDef[0];

  // Season status config
  const cfg={
    'IN-SEASON':{label:'Series 1',sub:'4 series → Playoffs W9',playoffs:'Week 9',series:'Series 1'},
    'PRE-SEASON':{label:'Pre-Season',sub:'Season starting soon',playoffs:'TBD',series:'Pre'},
    'POST-SEASON':{label:'Post-Season',sub:'Season complete',playoffs:'Complete',series:'Final'},
  };
  const sc=cfg[seasonStatus]||cfg['IN-SEASON'];

  // Conference leaders from teams
  const confGroups={};
  teams.forEach(t=>{
    const conf=t.conference||'GRAND CENTRAL';
    if(!confGroups[conf]) confGroups[conf]=[];
    confGroups[conf].push(t);
  });
  const confKeys=Object.keys(confGroups);

  // Top performers list (top 3 passers)
  const perfRows=allPass.slice(0,3).map((p,i)=>`
    <div class="hm-perf-row">
      <div class="hm-perf-rank">${i+1}</div>

        <div class="hm-perf-name">${esc(p.name||'Unknown')}</div>
        <div class="hm-perf-team">${esc(p.teamName||'—')}</div>
      </div>
      <div class="hm-perf-right">
        <div class="hm-perf-val">${esc(p.yds||0)}</div>
        <div class="hm-perf-cat">YDS</div>
      </div>

    return `<div class="hm-rank-row">
      <div class="hm-rank-pos ${posClass}">${i+1}</div>

    return `<div class="hm-conf-group">

        ${logo}

    </div>`;
  }).join(''):`<div class="hm-empty" style="padding:.75rem 0">No teams yet.</div>`;

  // Quick access items
  const qaItems=[
    {icon:'📅',label:'Schedule',sub:'Week 8 Results',page:'public-games'},
    {icon:'🏆',label:'Playoffs',sub:'Starting Week 9',page:'public-games'},
    {icon:'📊',label:'Stat Leaders',sub:'Top Stats',page:'public-lb'},
    {icon:'👁️',label:'Watchlist',sub:'Your Players',page:'public-lb'},

    {icon:'📋',label:'Matchups',sub:'This Week',page:'public-games'},

        <div class="info-card-val">1</div>

        <div class="info-card-label">SERIES</div>

        <div class="info-card-label">#1 SEED</div>
        <div class="info-card-val" style="color:#fff;font-size:16px">${teams.length?esc(teams[0].name.substring(0,10).toUpperCase())+' 0-0':'ALA 0-0'}</div>
      </div>
    </div>

    <!-- Three Widget Row: Top Performers | Power Rankings | Recent Trades -->
    <div class="home-main-grid" style="padding:.25rem 1.25rem .75rem">
      <!-- Top Performers -->
      <div class="hm-card">
        <div class="hm-card-hdr">
          <span class="hm-card-icon">⭐</span>
          <span class="hm-card-title">TOP PERFORMERS</span>
          <span class="hm-card-action" data-page="public-lb">View All ›</span>

        ${allPass.length?perfRows:`<div class="hm-empty">No stats yet.</div>`}

          <span class="hm-card-icon">📊</span>

        html+=`<div style="overflow-x:auto"><table class="lb-table"><thead><tr><th style="width:30%">Player</th><th>ATT</th><th>YDS</th><th>TD</th><th>YPC</th><th>LNG</th></tr></thead><tbody>`;

        html+=`</tbody></table></div>`;

        html+=`<div style="overflow-x:auto"><table class="lb-table"><thead><tr><th style="width:28%">Player</th><th>TGT</th><th>REC</th><th>YDS</th><th>TD</th><th>LNG</th></tr></thead><tbody>`;
        team.receiving.forEach(p=>{html+=`<tr><td class="pcell">${esc(p.name)}</td><td>${esc(p.tgt||'-')}</td><td>${esc(p.rec||'-')}</td><td class="sval">${esc(p.yds||'-')}</td><td>${esc(p.td||'-')}</td><td>${esc(p.lng||'-')}</td></tr>`;});

        html+=`</tbody></table></div>`;
      }
      html+=`</div>`;
    });
    html+=`</div>`;
  });
  return html;
}

/* buildLeaderboardPage: see below */

function buildLbInner(tab){
  // ── DE leaderboard ───────────────────────────────────────
  if(tab==='de'){
    rebuildPlayerRegistry();
    // Collect all defense players who are labeled DE
    const deMap={};
    publishedGames.forEach(g=>{
      g.teams.forEach(team=>{
        const tname=team.publishedName||team.name;
        if(!team.defense) return;
        team.defense.forEach(p=>{
          if(!p.name) return;
          const pkey=p.name.toLowerCase().trim();
          const reg=playerRegistry[pkey];
          const pos=(reg&&reg.position||'').toUpperCase();
          if(pos!=='DE') return;
          if(!deMap[pkey]) deMap[pkey]={name:p.name,teamName:tname,sck:0,tak:0,int:0,pbu:0};
          // If admin enabled tak-as-sck override, add tackles as sacks; else use raw sck
          if(reg&&reg._takAsSck){
            deMap[pkey].sck+=(+p.tak||0);
          } else {
            deMap[pkey].sck+=(+p.sck||0);
          }
          deMap[pkey].tak+=(+p.tak||0);
          deMap[pkey].int+=(+p.int||0);
          deMap[pkey].pbu+=(+p.pbu||0);
        });
      });
    });
    const dePlayers=Object.values(deMap).sort((a,b)=>b.sck-a.sck);
    if(!dePlayers.length) return `<div class="card">
      <div style="padding:.75rem 0 .4rem;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--lime);text-transform:uppercase;font-family:'Barlow Condensed',sans-serif">Defensive Ends</div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:.5rem">Players labeled <b style="color:#fff">DE</b> in the Admin → Players tab appear here. Their tackles count as sacks when the override is enabled.</div>
      <div class="empty">No DE players found. Label players as DE in the Admin → Players tab.</div>
    </div>`;
    let rows='';
    dePlayers.forEach((p,i)=>{
      const rc=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-n';
      rows+=`<tr><td><span class="${rc}" style="font-size:11px">${i+1}</span></td><td class="pcell">${esc(p.name)}</td><td><span class="tpill">${esc(p.teamName)}</span></td><td class="sval">${esc(p.sck)}</td><td>${esc(p.tak)}</td><td>${esc(p.int||'-')}</td><td>${esc(p.pbu||'-')}</td></tr>`;
    });
    return `<div class="card" style="padding:0 0 0 0;overflow:hidden">
      <div style="padding:.9rem 1rem .5rem;border-bottom:1px solid var(--border)">
        <div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--lime);text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;margin-bottom:3px">Defensive Ends</div>
        <div style="font-size:10px;color:var(--text2)">Tackles count as sacks for DEs with the override enabled in Admin → Players.</div>
      </div>
      <div style="overflow-x:auto"><table class="lb-table">
        <thead><tr><th style="width:32px">#</th><th>Player</th><th>Team</th><th>SCK</th><th>TAK</th><th>INT</th><th>PBU</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }

  // ── Standard tabs — aggregate by player key so stats stack across weeks ──
  const dataKey=tab==='db'?'defense':tab;
  const agg={};
  rebuildPlayerRegistry();
  publishedGames.forEach(function(g){
    g.teams.forEach(function(team){
      const tname=team.publishedName||team.name;
      const srcArr=(tab==='db'||tab==='passing'||tab==='rushing'||tab==='receiving')
        ? (tab==='db'?team.defense:team[tab])
        : team[dataKey];
      if(!srcArr) return;
      srcArr.forEach(function(p){
        if(!p.name) return;
        const pkey=p.name.toLowerCase().trim();
        const reg=playerRegistry[pkey];
        const pos=(reg&&reg.position||'').toUpperCase();
        // DB filter: skip DEs
        if(tab==='db' && pos==='DE') return;
        if(!agg[pkey]){
          agg[pkey]={name:p.name,teamName:tname,
            yds:0,td:0,int:0,cmp:0,att:0,lng:0,rec:0,tgt:0,tak:0,sck:0,pbu:0};
        }
        // stack all numeric fields
        ['yds','td','int','cmp','att','lng','rec','tgt','tak','sck','pbu'].forEach(function(f){
          agg[pkey][f]+=(+p[f]||0);
        });
        // always keep most recent team name
        agg[pkey].teamName=tname;
      });
    });
  });
  const all=Object.values(agg);
  if(!all.length) return `<div class="card"><div class="empty">No data yet. Publish some games first.</div></div>`;
  let sorted,cols;
  if(tab==='passing'){sorted=all.sort((a,b)=>b.yds-a.yds);cols=['Player','Team','YDS','TD','INT','CMP','ATT'];}
  else if(tab==='rushing'){sorted=all.sort((a,b)=>b.yds-a.yds);cols=['Player','Team','YDS','TD','ATT','LNG'];}
  else if(tab==='receiving'){sorted=all.sort((a,b)=>b.yds-a.yds);cols=['Player','Team','YDS','TD','REC','TGT'];}
  else{sorted=all.sort((a,b)=>b.tak-a.tak);cols=['Player','Team','TAK','INT','SCK','PBU'];}
  let rows='';
  sorted.slice(0,20).forEach(function(p,i){
    const rc=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-n';
    let cells='';
    if(tab==='passing') cells=`<td class="sval">${p.yds}</td><td>${p.td||'-'}</td><td>${p.int||'-'}</td><td>${p.cmp||'-'}</td><td>${p.att||'-'}</td>`;
    else if(tab==='rushing') cells=`<td class="sval">${p.yds}</td><td>${p.td||'-'}</td><td>${p.att||'-'}</td><td>${p.lng||'-'}</td>`;
    else if(tab==='receiving') cells=`<td class="sval">${p.yds}</td><td>${p.td||'-'}</td><td>${p.rec||'-'}</td><td>${p.tgt||'-'}</td>`;
    else cells=`<td class="sval">${p.tak}</td><td>${p.int||'-'}</td><td>${p.sck||'-'}</td><td>${p.pbu||'-'}</td>`;
    rows+=`<tr><td><span class="${rc}" style="font-size:11px">${i+1}</span></td><td class="pcell">${esc(p.name)}</td><td><span class="tpill">${esc(p.teamName)}</span></td>${cells}</tr>`;
  });
  return `<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="lb-table">
    <thead><tr><th style="width:32px">#</th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div></div>`;
}

        <th style="padding:7px 8px;text-align:center;font-size:9px;letter-spacing:1px;color:var(--text2);font-weight:700">PF</th>
        <th style="padding:7px 8px;text-align:center;font-size:9px;letter-spacing:1px;color:var(--text2);font-weight:700">PA</th>
        <th style="padding:7px 8px;text-align:center;font-size:9px;letter-spacing:1px;color:var(--lime);font-weight:700">PD</th>
      </tr></thead><tbody>`;
    rows.forEach(function(r,i){
      const pd=r.pf-r.pa;
      const gp=r.wins+r.losses+r.ties;
      const pdColor=pd>0?'#4ade80':pd<0?'var(--red)':'var(--text2)';
      const pdStr=(pd>0?'+':'')+pd;
      const teamObj=teams.find(function(t){return t.name===r.name;});
      const logo=teamObj&&teamObj.image
        ?`<img src="${esc(teamObj.image)}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex-shrink:0">`
        :`<div style="width:20px;height:20px;border-radius:50%;background:var(--surface4);display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0">⬡</div>`;
      t+=`<tr style="border-bottom:1px solid var(--border);${i===0?'background:rgba(200,241,53,.04)':''}">
        <td style="padding:8px 10px">
          <div style="display:flex;align-items:center;gap:7px">
            ${logo}
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.5px;color:#fff;text-transform:uppercase">${esc(r.name)}</span>
            ${i===0?`<span style="font-size:8px;font-weight:700;letter-spacing:1px;color:var(--lime);background:rgba(200,241,53,.1);border:1px solid rgba(200,241,53,.3);border-radius:4px;padding:1px 5px">DIV LEADER</span>`:''}
          </div>
        </td>
        <td style="padding:8px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#4ade80">${r.wins}</td>
        <td style="padding:8px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--red)">${r.losses}</td>
        <td style="padding:8px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text2)">${r.ties}</td>
        <td style="padding:8px;text-align:center;font-size:11px;color:var(--text2)">${r.pf}</td>
        <td style="padding:8px;text-align:center;font-size:11px;color:var(--text2)">${r.pa}</td>
        <td style="padding:8px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;color:${pdColor}">${gp?pdStr:'—'}</td>
      </tr>`;
    });
    t+=`</tbody></table>`;
    return t;
  }

  const confKeys=['conf1','conf2'];
  const anyConf=confKeys.some(function(ck){
    return ['north','south'].some(function(dk){
      return conferences[ck].divisions[dk].teams.filter(Boolean).length>0;
    });
  });

  if(anyConf){
    // Render by conference + division
    confKeys.forEach(function(ck){
      const conf=conferences[ck];
      html+=`<div style="margin-bottom:1.5rem">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#fff;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:2px solid var(--lime)">${esc(conf.name)}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">`;
      ['north','south'].forEach(function(dk){
        const div=conf.divisions[dk];
        const divTeams=div.teams.filter(Boolean);
        html+=`<div class="card" style="padding:0;overflow:hidden">
          <div style="padding:.6rem 1rem;border-bottom:1px solid var(--border);background:var(--surface4)">
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--cyan)">${esc(div.name)}</span>
          </div>
          ${divTeams.length?standingsTable(divTeams):`<div style="padding:1.5rem;text-align:center;font-size:11px;color:var(--text2)">No teams assigned</div>`}
        </div>`;
      });
      html+=`</div></div>`;
    });
  } else {
    // No conferences configured — fall back to flat standings
    const allNames=teams.map(function(t){return t.name;});
    if(allNames.length){
      html+=`<div class="card" style="padding:0;overflow:hidden;margin-bottom:1rem">
        <div style="padding:.75rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
          <span style="font-size:13px">🏆</span>
          <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#fff">STANDINGS</span>
        </div>
        ${standingsTable(allNames)}
      </div>`;
    } else {
      html+=`<div class="card"><div class="empty">No teams have been added yet.</div></div>`;
    }
  }

  // Franchise cards — always shown below
  if(teams.length){
    html+=`<div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-top:1.5rem;margin-bottom:.6rem">FRANCHISES</div>`;
    html+=`<div class="teams-grid">`;
    teams.forEach(function(t){
      const rec=standings[t.name];
      const gp=rec?(rec.wins+rec.losses+rec.ties):0;
      const recStr=rec?`${rec.wins}-${rec.losses}${rec.ties?'-'+rec.ties:''}`:'0-0';
      const pd=rec?rec.pf-rec.pa:0;
      const pdStr=gp?(pd>0?'+'+pd:String(pd)):null;
      // Find which conference + division this team belongs to
      let confLabel='';
      ['conf1','conf2'].forEach(function(ck){
        ['north','south'].forEach(function(dk){
          if(conferences[ck].divisions[dk].teams.includes(t.name)){
            confLabel=`${conferences[ck].name} · ${conferences[ck].divisions[dk].name}`;
          }
        });
      });
      var imgHtml=t.image
        ?`<div class="team-card-img-wrap"><img src="${esc(t.image)}" alt="${esc(t.name)}" class="team-card-img" onerror="this.parentNode.innerHTML='<div style=font-size:52px;color:var(--border)>⬡</div>'"></div>`
        :`<div class="team-card-img-placeholder">⬡</div>`;
      html+=`<div class="team-card">${imgHtml}
        <div class="team-card-body">
          <div class="team-card-name">${esc(t.name)}</div>
          ${confLabel?`<div style="font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);margin-bottom:6px">${esc(confLabel)}</div>`:''}
          <div class="team-card-info">
            <div class="team-card-row"><span class="team-card-label">Record</span><span class="team-card-val" style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;color:#fff">${recStr}${pdStr!==null?` <span style="font-size:10px;color:${pd>=0?'#4ade80':'var(--red)'}">(${pdStr})</span>`:''}</span></div>
            <div class="team-card-row"><span class="team-card-label">Head Coach</span><span class="team-card-val">${esc(t.headCoach||'—')}</span></div>
            <div class="team-card-row"><span class="team-card-label">Owner</span><span class="team-card-val">${esc(t.owner||'—')}</span></div>
          </div>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  return html;
}

function buildTeamsPage(){
  const standings={};
  teams.forEach(function(t){ standings[t.name]={name:t.name,wins:0,losses:0,ties:0,pf:0,pa:0}; });
  publishedGames.forEach(function(g){
    if(g.status!=='FINAL') return;
    const n0=(g.teams[0]&&(g.teams[0].publishedName||g.teams[0].name))||(g.homeName||'');
    const n1=(g.teams[1]&&(g.teams[1].publishedName||g.teams[1].name))||(g.awayName||'');
    const s0=parseInt(g.homeScore)||0, s1=parseInt(g.awayScore)||0;
    if(!standings[n0]) standings[n0]={name:n0,wins:0,losses:0,ties:0,pf:0,pa:0};
    if(!standings[n1]) standings[n1]={name:n1,wins:0,losses:0,ties:0,pf:0,pa:0};
    standings[n0].pf+=s0; standings[n0].pa+=s1;
    standings[n1].pf+=s1; standings[n1].pa+=s0;
    if(s0>s1){standings[n0].wins++;standings[n1].losses++;}
    else if(s1>s0){standings[n1].wins++;standings[n0].losses++;}
    else{standings[n0].ties++;standings[n1].ties++;}
  });
  let html=`<div><div class="hero"><img src="${BADGE}" alt="UFF" class="hero-logo"><div class="hero-text"><h1>Teams</h1><p>UFF Statistics — all franchises</p></div></div><div class="content">`;
  html+=buildConferenceStandingsHTML(standings);
  html+=`</div></div>`;
  return html;
}

// ── PLAYER REGISTRY HELPERS ──────────────────────────────────────────────
function rebuildPlayerRegistry(){
  // Collect every unique player name from all published games
  // playerRegistry[name] = {name, teamName, position, statTypes:[]}
  const seen={};
  publishedGames.forEach(function(g){
    if(!g.teams) return;
    g.teams.forEach(function(t){
      const tname=t.publishedName||t.name||'';
      const sections=['passing','rushing','receiving','defense'];
      sections.forEach(function(sec){
        if(!t[sec]||!t[sec].length) return;
        t[sec].forEach(function(p){
          if(!p.name) return;
          const key=p.name.toLowerCase().trim();
          // Auto-infer position from stat section if not set
          let inferPos='';
          if(sec==='passing') inferPos='QB';
          else if(sec==='rushing') inferPos='RB';
          else if(sec==='receiving') inferPos='WR';
          else if(sec==='defense') inferPos='DE';
          if(!seen[key]){
            seen[key]={
              name:p.name,
              teamName:playerRegistry[key]?playerRegistry[key].teamName:(tname||''),
              position:playerRegistry[key]?playerRegistry[key].position:inferPos,
              statTypes:[]
            };
          }
          if(!seen[key].statTypes.includes(sec)) seen[key].statTypes.push(sec);
          // If team not manually overridden, keep synced to latest game data
          if(!playerRegistry[key]||!playerRegistry[key]._teamOverride){
            seen[key].teamName=tname;
          }
        });
      });
    });
  });
  // Merge manual overrides (position, team) back in
  Object.keys(playerRegistry).forEach(function(key){
    if(seen[key]){
      if(playerRegistry[key]._teamOverride) seen[key].teamName=playerRegistry[key].teamName;
      if(playerRegistry[key]._posOverride)  seen[key].position=playerRegistry[key].position;
      seen[key]._teamOverride=playerRegistry[key]._teamOverride;
      seen[key]._posOverride=playerRegistry[key]._posOverride;
      seen[key]._takAsSck=playerRegistry[key]._takAsSck;
    }
  });
  playerRegistry=seen;
}

function posClass(pos){
  const map={QB:'pos-qb',WR:'pos-wr',TE:'pos-te',RB:'pos-rb',DE:'pos-de',LB:'pos-lb',DB:'pos-db',K:'pos-k'};
  return map[(pos||'').toUpperCase()]||'pos-db';
}

function playerStatSummary(p){
  const parts=[];
  if(p.statTypes.includes('passing'))  parts.push('Passing');
  if(p.statTypes.includes('rushing'))  parts.push('Rushing');
  if(p.statTypes.includes('receiving'))parts.push('Receiving');
  if(p.statTypes.includes('defense'))  parts.push('Defense');
  return parts.join(' · ')||'No stats';
}

function buildPlayersAdminTab(){
  rebuildPlayerRegistry();
  const allPlayers=Object.values(playerRegistry).sort((a,b)=>a.name.localeCompare(b.name));
  if(!allPlayers.length){
    return `<div class="card">
      <div class="card-title">Players</div>
      <div class="empty" style="padding:2rem 0">No players found. Publish a game with imported stats to see players here.</div>
    </div>`;
  }
  const positions=['QB','WR','TE','RB','DE','LB','DB','K'];
  // Group by team
  const teamGroups={};
  const noTeamKey='__noteam__';
  allPlayers.forEach(function(p){
    const key=(p.teamName||'').trim()||noTeamKey;
    if(!teamGroups[key]) teamGroups[key]=[];
    teamGroups[key].push(p);
  });
  // Sort group keys: real teams first, then unknown
  const groupKeys=Object.keys(teamGroups).sort(function(a,b){
    if(a===noTeamKey) return 1;
    if(b===noTeamKey) return -1;
    return a.localeCompare(b);
  });
  // Team name options
  const teamOpts=teams.map(function(t){return `<option value="${esc(t.name)}">${esc(t.name)}</option>`;}).join('');
  const teamOptsFull=`<option value="">— Unknown —</option>${teamOpts}`;

  let html=`<div class="card">
    <div class="card-title" style="display:flex;align-items:center;justify-content:space-between">
      <span>Players <span style="font-size:10px;color:var(--muted);font-weight:400;letter-spacing:0">(${allPlayers.length} total)</span></span>
      <span style="font-size:10px;color:var(--muted)">Changes save instantly</span>
    </div>`;

  groupKeys.forEach(function(gkey){
    const gPlayers=teamGroups[gkey];
    const teamObj=teams.find(function(t){return t.name===gkey;});
    const logoHtml=teamObj&&teamObj.image
      ?`<img src="${esc(teamObj.image)}" class="team-section-logo">`
      :`<div class="team-section-logo" style="display:flex;align-items:center;justify-content:center;font-size:14px">\u2b21</div>`;
    const groupLabel=gkey===noTeamKey?'Unknown Team':esc(gkey);
    html+=`<div style="margin-top:1rem">
      <div class="team-section-hdr">
        ${gkey!==noTeamKey?logoHtml:''}
        <span class="team-section-name">${groupLabel}</span>
        <span class="team-section-count">${gPlayers.length} player${gPlayers.length!==1?'s':''}</span>
      </div>`;
    gPlayers.forEach(function(p){
      const pkey=p.name.toLowerCase().trim();
      const pos=(p.position||'').toUpperCase();
      const posOpts=positions.map(function(pos2){
        return `<option value="${pos2}"${pos===pos2?' selected':''}>${pos2}</option>`;
      }).join('');
      const isDE=pos==='DE';
      const takAsSck=!!(p._takAsSck);
      html+=`<div class="player-row">
        <div class="player-avatar">${esc(p.name.charAt(0).toUpperCase())}</div>
        <div style="flex:1;min-width:120px">
          <div class="player-name">${esc(p.name)}</div>
          <div class="player-stats-mini">${playerStatSummary(p)}</div>
        </div>
        <div class="player-controls">
          <span class="pos-badge ${posClass(pos)}" style="margin-right:4px">${pos||'?'}</span>
          <select class="mini-select player-pos-sel" data-pkey="${esc(pkey)}">
            ${posOpts}
          </select>
          <select class="mini-select player-team-sel" data-pkey="${esc(pkey)}">
            ${teamOptsFull.replace(`value="${esc(p.teamName)}"`,`value="${esc(p.teamName)}" selected`)}
          </select>
          ${isDE?`<label class="de-toggle-label" title="Count tackles as sacks in DE leaderboard">
            <input type="checkbox" class="de-tak-toggle" data-pkey="${esc(pkey)}"${takAsSck?' checked':''}>
            <span class="de-toggle-text">TAK→SCK</span>
          </label>`:''}
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  html+=`</div>`;
  return html;
}

function attachEvents(){
  const tog=document.getElementById('sidebar-toggle');
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sidebar-overlay');
  if(tog) tog.addEventListener('click',()=>{sb.classList.toggle('open');ov.classList.toggle('open');});
  if(ov) ov.addEventListener('click',()=>{sb.classList.remove('open');ov.classList.remove('open');});
  document.querySelectorAll('[data-page]').forEach(el=>{
    el.addEventListener('click',()=>{
      const p=el.dataset.page;
      if(sb)sb.classList.remove('open');if(ov)ov.classList.remove('open');
      if(p==='login'&&authed){currentPage='admin';render();return;}
      currentPage=p;if(p==='public-games'||p==='public-home')viewingGame=null;render();
    });
  });
  const lo=document.getElementById('logout-btn');
  if(lo) lo.addEventListener('click',()=>{authed=false;authRole=null;currentPage='public-games';render();});
  const lb=document.getElementById('login-btn');
  if(lb) lb.addEventListener('click',doLogin);
  const lp=document.getElementById('l-pass');
  if(lp) lp.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  document.querySelectorAll('[data-atab]').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.atab!=='addgame'){pendingScoreGame=null;editingScoreIdx=null;}adminTab=el.dataset.atab;parsedData=null;render();}));
  document.querySelectorAll('[data-lbtab]').forEach(el=>el.addEventListener('click',()=>{
    currentLbTab=el.dataset.lbtab;
    const inner=document.getElementById('lb-inner');if(inner)inner.innerHTML=buildLbInner(currentLbTab);
    document.querySelectorAll('[data-lbtab]').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  }));
  document.querySelectorAll('[data-dtab]').forEach(el=>el.addEventListener('click',()=>{
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));

function parseStatBlock(raw){
  // Split into paragraphs by blank lines — each team block is separated by an empty line
  const paragraphs = raw.split(/\n[ \t]*\n/);
  const allTeams = [];
  let i = 0;
  while(i < paragraphs.length){
    const para = paragraphs[i].trim();
    const firstLine = para.split(/\n/)[0].trim();
    // Team header: "TEAM NAME Stats" alone on a line (all-caps name + "Stats")
    const headerMatch = firstLine.match(/^([A-Z][A-Z0-9 ]{1,}?)\s+Stats\s*$/i);
    if(headerMatch){
      const teamName = headerMatch[1].trim();
      // Collect stat content: rest of this paragraph + following non-header paragraphs
      let statContent = para.slice(firstLine.length).trim();
      let j = i + 1;
      while(j < paragraphs.length){
        const nextPara = paragraphs[j].trim();
        const nextFirst = nextPara.split(/\n/)[0].trim();
        if(nextFirst.match(/^[A-Z][A-Z0-9 ]{1,}?\s+Stats\s*$/i)) break;
        statContent += ' ' + nextPara;
        j++;
      }
      const team = parseTeamBlock(teamName, statContent.trim());
      if(team) allTeams.push(team);
      i = j;
    } else {
      i++;
    }
  }
  if(!allTeams.length) throw new Error('No teams found. Make sure each team section starts with a blank line, then: TEAM NAME Stats');
  return allTeams;
}

function parseTeamBlock(name, block){
  const team = {name, passing:[], rushing:[], receiving:[], defense:[]};
  const sectionRe = /\b(Passing|Rushing|Receiving|Defense)\b/gi;
  const spos = [];
  let sm;
  while((sm = sectionRe.exec(block)) !== null){
    spos.push({key: sm[1].toLowerCase(), idx: sm.index + sm[0].length});
  }
  spos.sort((a,b) => a.idx - b.idx);
  for(let i = 0; i < spos.length; i++){
    const chunk = block.slice(spos[i].idx, i+1 < spos.length ? spos[i+1].idx : block.length).trim();
    splitPipeEntries(chunk).forEach(entry => {
      const parsed = parseLine(entry, spos[i].key);
      if(parsed) team[spos[i].key].push(parsed);
    });
  }
  return team;
}

function splitPipeEntries(chunk){
  const STAT_KEYS = new Set(['YDS','TD','INT','ATT','REC','TGT','DROP','LNG','RTG','CMP','AVG','SCK','TAK','TFL','SAF','SWAT','PBU','SCKED','FUM','YPC','20+','PTS','TFL']);
  // Player name = word(s) immediately before the first | that aren't pure stat keys or numbers
  const pattern = /(?<![/\d])([A-Za-z][A-Za-z0-9_]*)\s*\|/g;
  const positions = [];
  let pm;
  while((pm = pattern.exec(chunk)) !== null){
    const w = pm[1];
    if(STAT_KEYS.has(w.toUpperCase())) continue;
    if(/^\d+$/.test(w)) continue;
    positions.push(pm.index);
  }
  const entries = [];
  for(let i = 0; i < positions.length; i++){
    const end = i+1 < positions.length ? positions[i+1] : chunk.length;
    const e = chunk.slice(positions[i], end).trim();
    if(e) entries.push(e);
  }
  return entries;
}

function parseLine(line, sec){
  const pipeIdx = line.indexOf('|');
  if(pipeIdx < 0) return null;
  const name = line.slice(0, pipeIdx).trim();
  if(!name) return null;
  const STAT_KEYS = new Set(['YDS','TD','INT','ATT','REC','TGT','DROP','LNG','RTG','CMP','AVG','SCK','TAK','TFL','SAF','SWAT','PBU','SCKED','FUM','YPC','20+','PTS']);
  if(STAT_KEYS.has(name.toUpperCase())) return null;

  // Strip % from percentages like 72.0% so numbers parse cleanly
  const cleanLine = line.replace(/(\d+\.?\d*)%/g, '$1');

  const ex = (key) => {
    // "N KEY" — value before the label (handle negatives like -13 YDS)
    const fwd = cleanLine.match(new RegExp('[|\\s](-?[\\d.]+)\\s+' + key + '(?:\\s|\\||$)', 'i'));
    if(fwd) return fwd[1];
    // "KEY N" — label before value (e.g. LNG 86)
    const rev = cleanLine.match(new RegExp('\\b' + key + '\\s+(-?[\\d.]+)', 'i'));
    if(rev) return rev[1];
    return null;
  };

  if(sec === 'passing'){
    const ca = cleanLine.match(/(\d+)\/(\d+)/);
    if(!ca && !ex('YDS')) return null;
    return {name, cmp:ca?ca[1]:null, att:ca?ca[2]:null, yds:ex('YDS'), td:ex('TD'), int:ex('INT'), rtg:ex('RTG'), avg:ex('AVG'), lng:ex('LNG'), scked:ex('SCKED')};
  }
  if(sec === 'rushing') return {name, att:ex('ATT'), yds:ex('YDS'), td:ex('TD'), ypc:ex('YPC'), lng:ex('LNG'), fum:ex('FUM')};
  if(sec === 'receiving') return {name, tgt:ex('TGT'), rec:ex('REC'), yds:ex('YDS'), td:ex('TD'), drop:ex('DROP'), lng:ex('LNG')};
  if(sec === 'defense') return {name, tak:ex('TAK'), tfl:ex('TFL'), sck:ex('SCK'), saf:ex('SAF'), swat:ex('SWAT'), int:ex('INT'), pbu:ex('PBU'), td:ex('TD')};
  return null;
}

function buildHomePage(){
  const allPass=[],allRush=[],allRec=[],allDef=[];
  publishedGames.forEach(g=>{

      if(team.passing)team.passing.forEach(p=>allPass.push({...p,teamName:tn}));
      if(team.rushing)team.rushing.forEach(p=>allRush.push({...p,teamName:tn}));
      if(team.receiving)team.receiving.forEach(p=>allRec.push({...p,teamName:tn}));
      if(team.defense)team.defense.forEach(p=>allDef.push({...p,teamName:tn}));
    });
  });
  allPass.sort((a,b)=>(+b.yds||0)-(+a.yds||0));
  allRush.sort((a,b)=>(+b.yds||0)-(+a.yds||0));
  allRec.sort((a,b)=>(+b.yds||0)-(+a.yds||0));
  allDef.sort((a,b)=>((+b.tak||0)+(+b.sck||0)*2+(+b.int||0)*2)-((+a.tak||0)+(+a.sck||0)*2+(+a.int||0)*2));
  const tp=allPass[0],tr=allRush[0],trec=allRec[0],td=allDef[0];

  const recentGames=publishedGames.slice(0,5);

  // Conference leaders (top team by points if any games)
  const teamScores = {};
  publishedGames.forEach(g=>{
    const n0=(g.teams[0]&&(g.teams[0].publishedName||g.teams[0].name))||(g.homeName||'TBD');
    const n1=(g.teams[1]&&(g.teams[1].publishedName||g.teams[1].name))||(g.awayName||'TBD');
    if(!teamScores[n0]) teamScores[n0]={wins:0,losses:0};
    if(!teamScores[n1]) teamScores[n1]={wins:0,losses:0};
    if(g.status==='FINAL'){
      const s0=parseInt(g.homeScore)||0, s1=parseInt(g.awayScore)||0;
      if(s0>s1){teamScores[n0].wins++;teamScores[n1].losses++;}
      else if(s1>s0){teamScores[n1].wins++;teamScores[n0].losses++;}
    }
  });
  const sortedTeams = Object.entries(teamScores).sort((a,b)=>b[1].wins-a[1].wins);
  const leader1 = sortedTeams[0], leader2 = sortedTeams[1];

  const statInfoCards = [
    {label:'Teams', val: teams.length||0, sub:'', color:'var(--lime)'},
    {label:'Week', val: '1', sub:'', color:'var(--cyan)'},

  const recentHtml = recentGames.length ? recentGames.map(g=>{
    const n0=(g.teams[0]&&(g.teams[0].publishedName||g.teams[0].name))||(g.homeName||'TBD');

    const s1=g.awayScore!==undefined?g.awayScore:'?';
    const status=g.status||'FINAL';
    const stcolor=status==='LIVE'?'#f87171':status==='UPCOMING'?'#60a5fa':'var(--muted)';
    const img0=g.homeImage?`<img src="${g.homeImage}" class="rg-logo">`:`<div class="rg-logo rg-logo-ph">⬡</div>`;
    const img1=g.awayImage?`<img src="${g.awayImage}" class="rg-logo">`:`<div class="rg-logo rg-logo-ph">⬡</div>`;
    return `<div class="rg-row">
      <div class="rg-side">${img0}<span class="rg-tname">${esc(n0)}</span></div>
      <div class="rg-mid"><div class="rg-score">${esc(s0)} – ${esc(s1)}</div><div class="rg-st" style="color:${stcolor}">${esc(status)}</div></div>

  // Top performers mini
  const perfRows = [

    tr   ? {cat:'RUSHING',  name:tr.name,   val:tr.yds+' YDS',  team:tr.teamName}    : null,

}

function getPlayerSeasonStats(){
  // Build aggregated season stats per player from all published games
  const players={};
  publishedGames.forEach(g=>{
    const allSections=['passing','rushing','receiving','defense'];
    g.teams.forEach(team=>{
      const tname=team.publishedName||team.name;
      // team W/L
      const isHome=(g.teams[0]===team);
      const homeScore=parseFloat(g.homeScore)||0;
      const awayScore=parseFloat(g.awayScore)||0;
      let result='?';
      if(g.homeScore!=='?'&&g.awayScore!=='?'){
        if(isHome) result=homeScore>awayScore?'W':homeScore<awayScore?'L':'T';
        else result=awayScore>homeScore?'W':awayScore<homeScore?'L':'T';
      }
      allSections.forEach(sec=>{
        if(!team[sec]) return;
        team[sec].forEach(p=>{
          if(!p.name) return;
          const key=p.name.toLowerCase().trim();
          if(!players[key]){
            const reg=playerRegistry[key]||{};
            players[key]={
              name:p.name,team:tname,pos:reg.position||'—',
              passing:{yds:0,td:0,int:0,cmp:0,att:0},
              rushing:{yds:0,td:0,att:0},
              receiving:{yds:0,td:0,rec:0,tgt:0},
              defense:{tak:0,sck:0,int:0,pbu:0},
              games:[],wins:0,losses:0
            };
          }
          // stack stats
          if(sec==='passing'){
            players[key].passing.yds+=(+p.yds||0);
            players[key].passing.td+=(+p.td||0);
            players[key].passing.int+=(+p.int||0);
            players[key].passing.cmp+=(+p.cmp||0);
            players[key].passing.att+=(+p.att||0);
          } else if(sec==='rushing'){
            players[key].rushing.yds+=(+p.yds||0);
            players[key].rushing.td+=(+p.td||0);
            players[key].rushing.att+=(+p.att||0);
          } else if(sec==='receiving'){
            players[key].receiving.yds+=(+p.yds||0);
            players[key].receiving.td+=(+p.td||0);
            players[key].receiving.rec+=(+p.rec||0);
            players[key].receiving.tgt+=(+p.tgt||0);
          } else if(sec==='defense'){
            players[key].defense.tak+=(+p.tak||0);
            players[key].defense.sck+=(+p.sck||0);
            players[key].defense.int+=(+p.int||0);
            players[key].defense.pbu+=(+p.pbu||0);
          }
          // track game
          if(!players[key].games.find(gk=>gk.id===g.id)){
            players[key].games.push({id:g.id,week:g.week,result});
            if(result==='W') players[key].wins++;
            else if(result==='L') players[key].losses++;
          }
        });
      });
    });
  });
  return players;
}

function buildPlayerProfile(pl, allPlayers){
  const reg=playerRegistry[pl.name.toLowerCase().trim()]||{};
  const pos=(reg.position||'—').toUpperCase();
  const hasPass=pl.passing.yds>0||pl.passing.att>0;
  const hasRush=pl.rushing.yds>0||pl.rushing.att>0;
  const hasRec=pl.receiving.yds>0||pl.receiving.rec>0;
  const hasDef=pl.defense.tak>0||pl.defense.sck>0||pl.defense.int>0;

  const statBox=(val,label)=>`<div style="background:var(--surface3);border:1px solid var(--border);border-radius:10px;padding:1rem;text-align:center">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;color:#fff;line-height:1">${val}</div>
    <div style="font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-top:4px">${label}</div>
  </div>`;

  let statsGrid='';
  if(hasPass){
    statsGrid+=statBox(pl.passing.yds,'Pass YDS');
    statsGrid+=statBox(pl.passing.td,'Pass TD');
    statsGrid+=statBox(pl.passing.int,'INT');
    statsGrid+=statBox(pl.passing.cmp+'/'+pl.passing.att,'CMP/ATT');
  }
  if(hasRush){
    statsGrid+=statBox(pl.rushing.yds,'Rush YDS');
    statsGrid+=statBox(pl.rushing.td,'Rush TD');
    statsGrid+=statBox(pl.rushing.att,'Carries');
  }
  if(hasRec){
    statsGrid+=statBox(pl.receiving.yds,'Rec YDS');
    statsGrid+=statBox(pl.receiving.td,'Rec TD');
    statsGrid+=statBox(pl.receiving.rec+'/'+pl.receiving.tgt,'REC/TGT');
  }
  if(hasDef){
    statsGrid+=statBox(pl.defense.tak,'Tackles');
    statsGrid+=statBox(pl.defense.sck,'Sacks');
    statsGrid+=statBox(pl.defense.int,'INT');
    statsGrid+=statBox(pl.defense.pbu,'PBU');
  }
  if(!statsGrid) statsGrid=`<div style="color:var(--text2);font-size:11px;padding:1rem 0">No stat data available.</div>`;

  // Game log
  let gameRows='';
  publishedGames.forEach(g=>{
    const pkey=pl.name.toLowerCase().trim();
    // find player in this game
    let found=false;
    g.teams.forEach(team=>{
      const tname=team.publishedName||team.name;
      ['passing','rushing','receiving','defense'].forEach(sec=>{
        if(!team[sec])return;
        const match=team[sec].find(p=>p.name.toLowerCase().trim()===pkey);
        if(match&&!found){
          found=true;
          const isHome=(g.teams[0]===team);
          const hs=parseFloat(g.homeScore)||0;
          const as_=parseFloat(g.awayScore)||0;
          let result='—',resColor='var(--text2)';
          if(g.homeScore!=='?'&&g.awayScore!=='?'){
            const won=isHome?(hs>as_):(as_>hs);
            const tied=hs===as_;
            result=tied?'T':won?`W ${g.homeScore}-${g.awayScore}`:`L ${g.homeScore}-${g.awayScore}`;
            resColor=tied?'var(--text2)':won?'#4ade80':'var(--red)';
          }
          const opp=g.teams.find(t=>t!==team);
          const oppName=opp?opp.publishedName||opp.name:'?';
          let statStr='';
          if(sec==='passing') statStr=`${match.cmp||0}/${match.att||0} · ${match.yds||0} YDS · ${match.td||0} TD`;
          else if(sec==='rushing') statStr=`${match.att||0} ATT · ${match.yds||0} YDS · ${match.td||0} TD`;
          else if(sec==='receiving') statStr=`${match.rec||0}/${match.tgt||0} · ${match.yds||0} YDS · ${match.td||0} TD`;
          else statStr=`${match.tak||0} TAK · ${match.sck||0} SCK · ${match.int||0} INT`;
          gameRows+=`<tr style="border-bottom:1px solid var(--border)">
            <td style="padding:8px 12px;font-size:11px;color:var(--text2)">Wk ${esc(g.week)}</td>
            <td style="padding:8px 12px;font-size:11px;color:#fff;font-weight:600">${esc(tname)}</td>
            <td style="padding:8px 12px;font-size:11px;color:var(--text2)">vs ${esc(oppName)}</td>
            <td style="padding:8px 12px;font-size:11px;font-weight:700;color:${resColor}">${esc(result)}</td>
            <td style="padding:8px 12px;font-size:11px;color:var(--text2)">${esc(statStr)}</td>
          </tr>`;
        }
      });
    });
  });

  const wl=`${pl.wins}-${pl.losses}`;
  return `<div class="lb-page">
    <div class="lb-page-hdr">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <div id="back-to-watchlist" style="font-size:11px;color:var(--lime);cursor:pointer;font-weight:700;letter-spacing:1px">← PLAYERS</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,rgba(200,241,53,.2),rgba(0,212,255,.1));border:2px solid rgba(200,241,53,.3);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:var(--lime)">${esc(pl.name[0].toUpperCase())}</div>
        <div>
          <div class="lb-page-title" style="font-size:24px">${esc(pl.name)}</div>
          <div style="display:flex;gap:6px;margin-top:4px">
            <span style="font-size:9px;font-weight:700;letter-spacing:1.5px;padding:2px 8px;border-radius:10px;background:var(--surface4);color:var(--text2);border:1px solid var(--border)">${esc(pos)}</span>
            <span style="font-size:9px;font-weight:700;letter-spacing:1.5px;padding:2px 8px;border-radius:10px;background:var(--surface4);color:var(--text2);border:1px solid var(--border)">${esc(pl.team||'FA')}</span>
            <span style="font-size:9px;font-weight:700;letter-spacing:1.5px;padding:2px 8px;border-radius:10px;background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.25)">${wl} W-L</span>
          </div>
        </div>
      </div>
    </div>
    <div style="padding:.75rem 1.25rem">
      <div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--lime);text-transform:uppercase;margin-bottom:.5rem;font-family:'Barlow Condensed',sans-serif">Season Totals</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.5rem;margin-bottom:1rem">
        ${statsGrid}
      </div>
      <div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--lime);text-transform:uppercase;margin-bottom:.5rem;font-family:'Barlow Condensed',sans-serif">Game Log (${pl.games.length} games)</div>
      <div style="background:var(--surface3);border:1px solid var(--border);border-radius:10px;overflow:hidden">
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:12px">
            <thead><tr style="background:var(--surface4)">
              <th style="padding:8px 12px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);font-weight:700">WK</th>
              <th style="padding:8px 12px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);font-weight:700">TEAM</th>
              <th style="padding:8px 12px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);font-weight:700">OPPONENT</th>
              <th style="padding:8px 12px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);font-weight:700">RESULT</th>
              <th style="padding:8px 12px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);font-weight:700">STATS</th>
            </tr></thead>
            <tbody>${gameRows||'<tr><td colspan="5" style="text-align:center;padding:1.5rem;color:var(--text2);font-size:11px">No game data</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}

function buildTeamsPage(){
  // compute standings
  const standings={};
  teams.forEach(function(t){ standings[t.name]={name:t.name,wins:0,losses:0,ties:0,pf:0,pa:0}; });
  publishedGames.forEach(function(g){
    if(g.status!=='FINAL') return;
    const n0=(g.teams[0]&&(g.teams[0].publishedName||g.teams[0].name))||(g.homeName||'');
    const n1=(g.teams[1]&&(g.teams[1].publishedName||g.teams[1].name))||(g.awayName||'');
    const s0=parseInt(g.homeScore)||0, s1=parseInt(g.awayScore)||0;
    if(!standings[n0]) standings[n0]={name:n0,wins:0,losses:0,ties:0,pf:0,pa:0};
    if(!standings[n1]) standings[n1]={name:n1,wins:0,losses:0,ties:0,pf:0,pa:0};
    standings[n0].pf+=s0; standings[n0].pa+=s1;
    standings[n1].pf+=s1; standings[n1].pa+=s0;
    if(s0>s1){standings[n0].wins++;standings[n1].losses++;}
    else if(s1>s0){standings[n1].wins++;standings[n0].losses++;}
    else{standings[n0].ties++;standings[n1].ties++;}
  });

  let html=`<div class="inner-page">
    <div class="inner-page-header">
      <div class="iph-eyebrow">⬡ Franchises</div>
      <div class="iph-title">TEAMS</div>
    </div>
    <div class="inner-content">`;
  html+=buildConferenceStandingsHTML(standings);
  html+=`</div></div>`;
  return html;
}
