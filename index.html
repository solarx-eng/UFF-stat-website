function buildGameDetail(g){
  const t0=g.teams[0],t1=g.teams[1];
  const n0=t0?(t0.publishedName||t0.name):(g.homeName||'Team A');
  const n1=t1?(t1.publishedName||t1.name):(g.awayName||'Team B');
  const r0=g.homeRank?`<span style="color:var(--gold);font-size:10px">#${esc(g.homeRank)} </span>`:'';
  const r1=g.awayRank?`<span style="color:var(--gold);font-size:10px">#${esc(g.awayRank)} </span>`:'';
  const status=g.status||'FINAL';
  let html=`<div class="back-btn" id="back-to-games">← Back to Games</div>
  <div class="score-banner"><div class="score-banner-inner">
    <div class="sb-team">
      ${g.homeImage?`<img src="${g.homeImage}" class="sb-team-logo">`:`<div class="sb-team-logo-placeholder">⬡</div>`}
      <div class="sb-name">${r0}${esc(n0)}</div><div class="sb-score">${esc(g.homeScore!==undefined?g.homeScore:'?')}</div></div>
    <div class="sb-divider"><span class="sb-vs">vs</span><span class="sb-final">${esc(status)}</span><div style="font-size:9px;color:var(--muted);margin-top:2px">S${esc(g.season)} · W${esc(g.week)}</div></div>
    <div class="sb-team">
      ${g.awayImage?`<img src="${g.awayImage}" class="sb-team-logo">`:`<div class="sb-team-logo-placeholder">⬡</div>`}
      <div class="sb-name">${r1}${esc(n1)}</div><div class="sb-score">${esc(g.awayScore!==undefined?g.awayScore:'?')}</div></div>
  </div></div>`;
  const hasStats=g.teams&&g.teams.some(t=>t.passing&&t.passing.length);
  if(!hasStats) return html+`<div class="card"><div class="empty">No detailed stats for this game.</div></div>`;
  const secs=[{key:'passing',label:'Passing'},{key:'rushing',label:'Rushing'},{key:'receiving',label:'Receiving'},{key:'defense',label:'Defense'}];
  html+=`<div class="stat-tabs">`;
  secs.forEach((s,si)=>{html+=`<div class="stat-tab${si===0?' active':''}" data-dtab="${s.key}">${s.label}</div>`;});
  html+=`</div>`;
  secs.forEach((s,si)=>{
    html+=`<div id="dtab-${s.key}" class="tab-content${si===0?' active':''}">`;
    g.teams.forEach(team=>{
      if(!team[s.key]||!team[s.key].length) return;
      html+=`<div class="team-block"><div class="team-header">${esc(team.publishedName||team.name)}</div>`;
      if(s.key==='passing'){
        html+=`<div style="overflow-x:auto"><table class="lb-table"><thead><tr><th style="width:25%">Player</th><th>CMP/ATT</th><th>YDS</th><th>TD</th><th>INT</th><th>RTG</th></tr></thead><tbody>`;
        team.passing.forEach(p=>{html+=`<tr><td class="pcell">${esc(p.name)}</td><td>${esc(p.cmp||'-')}/${esc(p.att||'-')}</td><td class="sval">${esc(p.yds||'-')}</td><td>${esc(p.td||'-')}</td><td>${esc(p.int||'-')}</td><td>${esc(p.rtg||'-')}</td></tr>`;});
        html+=`</tbody></table></div>`;
      } else if(s.key==='rushing'){
        html+=`<div style="overflow-x:auto"><table class="lb-table"><thead><tr><th style="width:30%">Player</th><th>ATT</th><th>YDS</th><th>TD</th><th>YPC</th><th>LNG</th></tr></thead><tbody>`;
        team.rushing.forEach(p=>{html+=`<tr><td class="pcell">${esc(p.name)}</td><td>${esc(p.att||'-')}</td><td class="sval">${esc(p.yds||'-')}</td><td>${esc(p.td||'-')}</td><td>${esc(p.ypc||'-')}</td><td>${esc(p.lng||'-')}</td></tr>`;});
        html+=`</tbody></table></div>`;
      } else if(s.key==='receiving'){
        html+=`<div style="overflow-x:auto"><table class="lb-table"><thead><tr><th style="width:28%">Player</th><th>TGT</th><th>REC</th><th>YDS</th><th>TD</th><th>LNG</th></tr></thead><tbody>`;
        team.receiving.forEach(p=>{html+=`<tr><td class="pcell">${esc(p.name)}</td><td>${esc(p.tgt||'-')}</td><td>${esc(p.rec||'-')}</td><td class="sval">${esc(p.yds||'-')}</td><td>${esc(p.td||'-')}</td><td>${esc(p.lng||'-')}</td></tr>`;});
        html+=`</tbody></table></div>`;
      } else {
        html+=`<div style="overflow-x:auto"><table class="lb-table"><thead><tr><th style="width:28%">Player</th><th>TAK</th><th>TFL</th><th>SCK</th><th>INT</th><th>PBU</th></tr></thead><tbody>`;
        team.defense.forEach(p=>{html+=`<tr><td class="pcell">${esc(p.name)}</td><td class="sval">${esc(p.tak||'-')}</td><td>${esc(p.tfl||'-')}</td><td>${esc(p.sck||'-')}</td><td>${esc(p.int||'-')}</td><td>${esc(p.pbu||'-')}</td></tr>`;});
        html+=`</tbody></table></div>`;
      }
      html+=`</div>`;
    });
    html+=`</div>`;
  });
  return html;
}

/* buildLeaderboardPage: see below */

function buildLbInner(tab){
  // ── DE leaderboard ───────────────────────────────────────
  if(tab==='de'){
    rebuildPlayerRegistry();
    // Collect all defense players who are labeled DE
    const deMap={};
    publishedGames.forEach(g=>{
      g.teams.forEach(team=>{
        const tname=team.publishedName||team.name;
        if(!team.defense) return;
        team.defense.forEach(p=>{
          if(!p.name) return;
          const pkey=p.name.toLowerCase().trim();
          const reg=playerRegistry[pkey];
          const pos=(reg&&reg.position||'').toUpperCase();
          if(pos!=='DE') return;
          if(!deMap[pkey]) deMap[pkey]={name:p.name,teamName:p.assignedTeam||tname,sck:0,tak:0,int:0,pbu:0};
          // If admin enabled tak-as-sck override, add tackles as sacks; else use raw sck
          if(reg&&reg._takAsSck){
            deMap[pkey].sck+=(+p.tak||0);
          } else {
            deMap[pkey].sck+=(+p.sck||0);
          }
          deMap[pkey].tak+=(+p.tak||0);
          deMap[pkey].int+=(+p.int||0);
          deMap[pkey].pbu+=(+p.pbu||0);
        });
      });
    });
    const dePlayers=Object.values(deMap).sort((a,b)=>b.sck-a.sck);
    if(!dePlayers.length) return `<div class="card">
      <div style="padding:.75rem 0 .4rem;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--lime);text-transform:uppercase;font-family:'Barlow Condensed',sans-serif">Defensive Ends</div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:.5rem">Players labeled <b style="color:#fff">DE</b> in the Admin → Players tab appear here. Their tackles count as sacks when the override is enabled.</div>
      <div class="empty">No DE players found. Label players as DE in the Admin → Players tab.</div>
    </div>`;
    let rows='';
    dePlayers.forEach((p,i)=>{
      const rc=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-n';
      rows+=`<tr><td><span class="${rc}" style="font-size:11px">${i+1}</span></td><td class="pcell">${esc(p.name)}</td><td><span class="tpill">${esc(p.teamName)}</span></td><td class="sval">${esc(p.sck)}</td><td>${esc(p.tak)}</td><td>${esc(p.int||'-')}</td><td>${esc(p.pbu||'-')}</td></tr>`;
    });
    return `<div class="card" style="padding:0 0 0 0;overflow:hidden">
      <div style="padding:.9rem 1rem .5rem;border-bottom:1px solid var(--border)">
        <div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--lime);text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;margin-bottom:3px">Defensive Ends</div>
        <div style="font-size:10px;color:var(--text2)">Tackles count as sacks for DEs with the override enabled in Admin → Players.</div>
      </div>
      <div style="overflow-x:auto"><table class="lb-table">
        <thead><tr><th style="width:32px">#</th><th>Player</th><th>Team</th><th>SCK</th><th>TAK</th><th>INT</th><th>PBU</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }

  // ── Standard tabs — aggregate by player key so stats stack across weeks ──
  const dataKey=tab==='db'?'defense':tab;
  const agg={};
  rebuildPlayerRegistry();
  publishedGames.forEach(function(g){
    g.teams.forEach(function(team){
      const tname=team.publishedName||team.name;
      const srcArr=(tab==='db'||tab==='passing'||tab==='rushing'||tab==='receiving')
        ? (tab==='db'?team.defense:team[tab])
        : team[dataKey];
      if(!srcArr) return;
      srcArr.forEach(function(p){
        if(!p.name) return;
        const pkey=p.name.toLowerCase().trim();
        const reg=playerRegistry[pkey];
        const pos=(reg&&reg.position||'').toUpperCase();
        // DB filter: skip DEs
        if(tab==='db' && pos==='DE') return;
        if(!agg[pkey]){
          agg[pkey]={name:p.name,teamName:p.assignedTeam||tname,
            yds:0,td:0,int:0,cmp:0,att:0,lng:0,rec:0,tgt:0,tak:0,sck:0,pbu:0};
        }
        // stack all numeric fields
        ['yds','td','int','cmp','att','lng','rec','tgt','tak','sck','pbu'].forEach(function(f){
          agg[pkey][f]+=(+p[f]||0);
        });
        // always keep most recent team name
        agg[pkey].teamName=p.assignedTeam||tname;
      });
    });
  });
  const all=Object.values(agg);
  if(!all.length) return `<div class="card"><div class="empty">No data yet. Publish some games first.</div></div>`;
  let sorted,cols;
  if(tab==='passing'){sorted=all.sort((a,b)=>b.yds-a.yds);cols=['Player','Team','YDS','TD','INT','CMP','ATT'];}
  else if(tab==='rushing'){sorted=all.sort((a,b)=>b.yds-a.yds);cols=['Player','Team','YDS','TD','ATT','LNG'];}
  else if(tab==='receiving'){sorted=all.sort((a,b)=>b.yds-a.yds);cols=['Player','Team','YDS','TD','REC','TGT'];}
  else{sorted=all.sort((a,b)=>b.tak-a.tak);cols=['Player','Team','TAK','INT','SCK','PBU'];}
  let rows='';
  sorted.slice(0,20).forEach(function(p,i){
    const rc=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-n';
    let cells='';
    if(tab==='passing') cells=`<td class="sval">${p.yds}</td><td>${p.td||'-'}</td><td>${p.int||'-'}</td><td>${p.cmp||'-'}</td><td>${p.att||'-'}</td>`;
    else if(tab==='rushing') cells=`<td class="sval">${p.yds}</td><td>${p.td||'-'}</td><td>${p.att||'-'}</td><td>${p.lng||'-'}</td>`;
    else if(tab==='receiving') cells=`<td class="sval">${p.yds}</td><td>${p.td||'-'}</td><td>${p.rec||'-'}</td><td>${p.tgt||'-'}</td>`;
    else cells=`<td class="sval">${p.tak}</td><td>${p.int||'-'}</td><td>${p.sck||'-'}</td><td>${p.pbu||'-'}</td>`;
    rows+=`<tr><td><span class="${rc}" style="font-size:11px">${i+1}</span></td><td class="pcell">${esc(p.name)}</td><td><span class="tpill">${esc(p.teamName)}</span></td>${cells}</tr>`;
  });
  return `<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="lb-table">
    <thead><tr><th style="width:32px">#</th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody>
  </table></div></div>`;
}


// ── SHARED: conference standings + franchise cards ────────
function buildConferenceStandingsHTML(standings){
  let html='';

  function standingsTable(teamNames){
    const rows=teamNames
      .map(function(n){ return standings[n]||{name:n,wins:0,losses:0,ties:0,pf:0,pa:0}; })
      .sort(function(a,b){
        if(b.wins!==a.wins) return b.wins-a.wins;
        const pdA=a.pf-a.pa, pdB=b.pf-b.pa;
        if(pdB!==pdA) return pdB-pdA;
        return b.pf-a.pf;
      });
    let t=`<table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="background:var(--surface4);border-bottom:1px solid var(--border)">
        <th style="padding:7px 10px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);font-weight:700">TEAM</th>
        <th style="padding:7px 8px;text-align:center;font-size:9px;letter-spacing:1px;color:var(--text2);font-weight:700">W</th>
        <th style="padding:7px 8px;text-align:center;font-size:9px;letter-spacing:1px;color:var(--text2);font-weight:700">L</th>
        <th style="padding:7px 8px;text-align:center;font-size:9px;letter-spacing:1px;color:var(--text2);font-weight:700">T</th>
        <th style="padding:7px 8px;text-align:center;font-size:9px;letter-spacing:1px;color:var(--text2);font-weight:700">PF</th>
        <th style="padding:7px 8px;text-align:center;font-size:9px;letter-spacing:1px;color:var(--text2);font-weight:700">PA</th>
        <th style="padding:7px 8px;text-align:center;font-size:9px;letter-spacing:1px;color:var(--lime);font-weight:700">PD</th>
      </tr></thead><tbody>`;
    rows.forEach(function(r,i){
      const pd=r.pf-r.pa;
      const gp=r.wins+r.losses+r.ties;
      const pdColor=pd>0?'#4ade80':pd<0?'var(--red)':'var(--text2)';
      const pdStr=(pd>0?'+':'')+pd;
      const teamObj=teams.find(function(t){return t.name===r.name;});
      const logo=teamObj&&teamObj.image
        ?`<img src="${esc(teamObj.image)}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex-shrink:0">`
        :`<div style="width:20px;height:20px;border-radius:50%;background:var(--surface4);display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0">⬡</div>`;
      t+=`<tr style="border-bottom:1px solid var(--border);${i===0?'background:rgba(200,241,53,.04)':''}">
        <td style="padding:8px 10px">
          <div style="display:flex;align-items:center;gap:7px">
            ${logo}
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.5px;color:#fff;text-transform:uppercase">${esc(r.name)}</span>
            ${i===0?`<span style="font-size:8px;font-weight:700;letter-spacing:1px;color:var(--lime);background:rgba(200,241,53,.1);border:1px solid rgba(200,241,53,.3);border-radius:4px;padding:1px 5px">DIV LEADER</span>`:''}
          </div>
        </td>
        <td style="padding:8px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#4ade80">${r.wins}</td>
        <td style="padding:8px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--red)">${r.losses}</td>
        <td style="padding:8px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text2)">${r.ties}</td>
        <td style="padding:8px;text-align:center;font-size:11px;color:var(--text2)">${r.pf}</td>
        <td style="padding:8px;text-align:center;font-size:11px;color:var(--text2)">${r.pa}</td>
        <td style="padding:8px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;color:${pdColor}">${gp?pdStr:'—'}</td>
      </tr>`;
    });
    t+=`</tbody></table>`;
    return t;
  }

  const confKeys=['conf1','conf2'];
  const anyConf=confKeys.some(function(ck){
    return ['north','south'].some(function(dk){
      return conferences[ck].divisions[dk].teams.filter(Boolean).length>0;
    });

  if(anyConf){
    // Render by conference + division
    confKeys.forEach(function(ck){
      const conf=conferences[ck];
      html+=`<div style="margin-bottom:1.5rem">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#fff;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:2px solid var(--lime)">${esc(conf.name)}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">`;
      ['north','south'].forEach(function(dk){
        const div=conf.divisions[dk];
        const divTeams=div.teams.filter(Boolean);
        html+=`<div class="card" style="padding:0;overflow:hidden">
          <div style="padding:.6rem 1rem;border-bottom:1px solid var(--border);background:var(--surface4)">
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--cyan)">${esc(div.name)}</span>
          </div>
          ${divTeams.length?standingsTable(divTeams):`<div style="padding:1.5rem;text-align:center;font-size:11px;color:var(--text2)">No teams assigned</div>`}
        </div>`;
      });
      html+=`</div></div>`;
    });
  } else {
    // No conferences configured — fall back to flat standings
    const allNames=teams.map(function(t){return t.name;});
    if(allNames.length){
      html+=`<div class="card" style="padding:0;overflow:hidden;margin-bottom:1rem">
        <div style="padding:.75rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px">
          <span style="font-size:13px">🏆</span>
          <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#fff">STANDINGS</span>
        </div>
        ${standingsTable(allNames)}
      </div>`;
    } else {
      html+=`<div class="card"><div class="empty">No teams have been added yet.</div></div>`;
    }
  }

  // Franchise cards — always shown below
  if(teams.length){
    html+=`<div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-top:1.5rem;margin-bottom:.6rem">FRANCHISES</div>`;
    html+=`<div class="teams-grid">`;
    teams.forEach(function(t){
      const rec=standings[t.name];
      const gp=rec?(rec.wins+rec.losses+rec.ties):0;
      const recStr=rec?`${rec.wins}-${rec.losses}${rec.ties?'-'+rec.ties:''}`:'0-0';
      const pd=rec?rec.pf-rec.pa:0;
      const pdStr=gp?(pd>0?'+'+pd:String(pd)):null;
      // Find which conference + division this team belongs to
      let confLabel='';
      ['conf1','conf2'].forEach(function(ck){
        ['north','south'].forEach(function(dk){
          if(conferences[ck].divisions[dk].teams.includes(t.name)){
            confLabel=`${conferences[ck].name} · ${conferences[ck].divisions[dk].name}`;
          }
        });
      });
      var imgHtml=t.image
        ?`<div class="team-card-img-wrap"><img src="${esc(t.image)}" alt="${esc(t.name)}" class="team-card-img" onerror="this.parentNode.innerHTML='<div style=font-size:52px;color:var(--border)>⬡</div>'"></div>`
        :`<div class="team-card-img-placeholder">⬡</div>`;
      html+=`<div class="team-card">${imgHtml}
        <div class="team-card-body">
          <div class="team-card-name">${esc(t.name)}</div>
          ${confLabel?`<div style="font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);margin-bottom:6px">${esc(confLabel)}</div>`:''}
          <div class="team-card-info">
            <div class="team-card-row"><span class="team-card-label">Record</span><span class="team-card-val" style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;color:#fff">${recStr}${pdStr!==null?` <span style="font-size:10px;color:${pd>=0?'#4ade80':'var(--red)'}">(${pdStr})</span>`:''}</span></div>
            <div class="team-card-row"><span class="team-card-label">Head Coach</span><span class="team-card-val">${esc(t.headCoach||'—')}</span></div>
            <div class="team-card-row"><span class="team-card-label">Owner</span><span class="team-card-val">${esc(t.owner||'—')}</span></div>
          </div>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }
  return html;
}

function buildTeamsPage(){
  const standings={};
  teams.forEach(function(t){ standings[t.name]={name:t.name,wins:0,losses:0,ties:0,pf:0,pa:0}; });
  publishedGames.forEach(function(g){
    if(g.status!=='FINAL') return;
    const n0=(g.teams[0]&&(g.teams[0].publishedName||g.teams[0].name))||(g.homeName||'');
    const n1=(g.teams[1]&&(g.teams[1].publishedName||g.teams[1].name))||(g.awayName||'');
    const s0=parseInt(g.homeScore)||0, s1=parseInt(g.awayScore)||0;
    if(!standings[n0]) standings[n0]={name:n0,wins:0,losses:0,ties:0,pf:0,pa:0};
    if(!standings[n1]) standings[n1]={name:n1,wins:0,losses:0,ties:0,pf:0,pa:0};
    standings[n0].pf+=s0; standings[n0].pa+=s1;
    standings[n1].pf+=s1; standings[n1].pa+=s0;
    if(s0>s1){standings[n0].wins++;standings[n1].losses++;}
    else if(s1>s0){standings[n1].wins++;standings[n0].losses++;}
    else{standings[n0].ties++;standings[n1].ties++;}
  });
  let html=`<div><div class="hero"><img src="${BADGE}" alt="UFF" class="hero-logo"><div class="hero-text"><h1>Teams</h1><p>UFF Statistics — all franchises</p></div></div><div class="content">`;
  html+=buildConferenceStandingsHTML(standings);
  html+=`</div></div>`;
  return html;
}

// ── PLAYER REGISTRY HELPERS ──────────────────────────────────────────────
function rebuildPlayerRegistry(){
  // Collect every unique player name from all published games
  // playerRegistry[name] = {name, teamName, position, statTypes:[]}
  const seen={};
  publishedGames.forEach(function(g){
    if(!g.teams) return;
    g.teams.forEach(function(t){
      const tname=t.publishedName||t.name||'';
      const sections=['passing','rushing','receiving','defense'];
      sections.forEach(function(sec){
        if(!t[sec]||!t[sec].length) return;
        t[sec].forEach(function(p){
          if(!p.name) return;
          const key=p.name.toLowerCase().trim();
          // Auto-infer position from stat section if not set
          let inferPos='';
          if(sec==='passing') inferPos='QB';
          else if(sec==='rushing') inferPos='RB';
          else if(sec==='receiving') inferPos='WR';
          else if(sec==='defense') inferPos='DE';
          if(!seen[key]){
            seen[key]={
              name:p.name,
              teamName:playerRegistry[key]?playerRegistry[key].teamName:(p.assignedTeam||tname||''),
              position:playerRegistry[key]?playerRegistry[key].position:inferPos,
              statTypes:[]
            };
          }
          if(!seen[key].statTypes.includes(sec)) seen[key].statTypes.push(sec);
          // A team selected during import is authoritative for that player.
          if(p.assignedTeam){seen[key].teamName=p.assignedTeam;seen[key]._importTeam=true}
          else if(!playerRegistry[key]||!playerRegistry[key]._teamOverride){seen[key].teamName=tname}
        });
      });
    });
  });
  // Merge manual overrides (position, team) back in
  Object.keys(playerRegistry).forEach(function(key){
    if(seen[key]){
      if(playerRegistry[key]._teamOverride&&!seen[key]._importTeam) seen[key].teamName=playerRegistry[key].teamName;
      if(playerRegistry[key]._posOverride)  seen[key].position=playerRegistry[key].position;
      seen[key]._teamOverride=playerRegistry[key]._teamOverride;
      seen[key]._posOverride=playerRegistry[key]._posOverride;
      seen[key]._takAsSck=playerRegistry[key]._takAsSck;
    }
  });
  Object.keys(seen).forEach(key=>delete seen[key]._importTeam);
  playerRegistry=seen;
}

function posClass(pos){
  const map={QB:'pos-qb',WR:'pos-wr',TE:'pos-te',RB:'pos-rb',DE:'pos-de',LB:'pos-lb',DB:'pos-db',K:'pos-k'};
  return map[(pos||'').toUpperCase()]||'pos-db';
}

function playerStatSummary(p){
  const parts=[];
  if(p.statTypes.includes('passing'))  parts.push('Passing');
  if(p.statTypes.includes('rushing'))  parts.push('Rushing');
  if(p.statTypes.includes('receiving'))parts.push('Receiving');
  if(p.statTypes.includes('defense'))  parts.push('Defense');
  return parts.join(' · ')||'No stats';
}

function buildPlayersAdminTab(){
  rebuildPlayerRegistry();
  const allPlayers=Object.values(playerRegistry).sort((a,b)=>a.name.localeCompare(b.name));
  if(!allPlayers.length){
    return `<div class="card">
      <div class="card-title">Players</div>
      <div class="empty" style="padding:2rem 0">No players found. Publish a game with imported stats to see players here.</div>
    </div>`;
  }
  const positions=['QB','WR','TE','RB','DE','LB','DB','K'];
  // Group by team
  const teamGroups={};
  const noTeamKey='__noteam__';
  allPlayers.forEach(function(p){
    const key=(p.teamName||'').trim()||noTeamKey;
    if(!teamGroups[key]) teamGroups[key]=[];
    teamGroups[key].push(p);
  });
  // Sort group keys: real teams first, then unknown
  const groupKeys=Object.keys(teamGroups).sort(function(a,b){
    if(a===noTeamKey) return 1;
    if(b===noTeamKey) return -1;
    return a.localeCompare(b);
  });
  // Team name options
  const teamOpts=teams.map(function(t){return `<option value="${esc(t.name)}">${esc(t.name)}</option>`;}).join('');
  const teamOptsFull=`<option value="">— Unknown —</option>${teamOpts}`;

  let html=`<div class="card">
    <div class="card-title" style="display:flex;align-items:center;justify-content:space-between">
      <span>Players <span style="font-size:10px;color:var(--muted);font-weight:400;letter-spacing:0">(${allPlayers.length} total)</span></span>
      <span style="font-size:10px;color:var(--muted)">Changes save instantly</span>
    </div>`;

  groupKeys.forEach(function(gkey){
    const gPlayers=teamGroups[gkey];
    const teamObj=teams.find(function(t){return t.name===gkey;});
    const logoHtml=teamObj&&teamObj.image
      ?`<img src="${esc(teamObj.image)}" class="team-section-logo">`
      :`<div class="team-section-logo" style="display:flex;align-items:center;justify-content:center;font-size:14px">\u2b21</div>`;
    const groupLabel=gkey===noTeamKey?'Unknown Team':esc(gkey);
    html+=`<div style="margin-top:1rem">
      <div class="team-section-hdr">
        ${gkey!==noTeamKey?logoHtml:''}
        <span class="team-section-name">${groupLabel}</span>
        <span class="team-section-count">${gPlayers.length} player${gPlayers.length!==1?'s':''}</span>
      </div>`;
    gPlayers.forEach(function(p){
      const pkey=p.name.toLowerCase().trim();
      const pos=(p.position||'').toUpperCase();
      const posOpts=positions.map(function(pos2){
        return `<option value="${pos2}"${pos===pos2?' selected':''}>${pos2}</option>`;
      }).join('');
      const isDE=pos==='DE';
      const takAsSck=!!(p._takAsSck);
      html+=`<div class="player-row">
        <div class="player-avatar">${esc(p.name.charAt(0).toUpperCase())}</div>
        <div style="flex:1;min-width:120px">
          <div class="player-name">${esc(p.name)}</div>
          <div class="player-stats-mini">${playerStatSummary(p)}</div>
        </div>
        <div class="player-controls">
          <span class="pos-badge ${posClass(pos)}" style="margin-right:4px">${pos||'?'}</span>
          <select class="mini-select player-pos-sel" data-pkey="${esc(pkey)}">
            ${posOpts}
          </select>
          <select class="mini-select player-team-sel" data-pkey="${esc(pkey)}">
            ${teamOptsFull.replace(`value="${esc(p.teamName)}"`,`value="${esc(p.teamName)}" selected`)}
          </select>
          ${isDE?`<label class="de-toggle-label" title="Count tackles as sacks in DE leaderboard">
            <input type="checkbox" class="de-tak-toggle" data-pkey="${esc(pkey)}"${takAsSck?' checked':''}>
            <span class="de-toggle-text">TAK→SCK</span>
          </label>`:''}
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  html+=`</div>`;
  return html;
}

function attachEvents(){
  const tog=document.getElementById('sidebar-toggle');
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sidebar-overlay');
  if(tog) tog.addEventListener('click',()=>{sb.classList.toggle('open');ov.classList.toggle('open');});
  if(ov) ov.addEventListener('click',()=>{sb.classList.remove('open');ov.classList.remove('open');});
  document.querySelectorAll('[data-page]').forEach(el=>{
    el.addEventListener('click',()=>{
      const p=el.dataset.page;
      if(sb)sb.classList.remove('open');if(ov)ov.classList.remove('open');
      if(p==='login'&&authed){currentPage='admin';render();return;}
      currentPage=p;if(p==='public-games'||p==='public-home')viewingGame=null;render();
    });
  });
  const lo=document.getElementById('logout-btn');
  if(lo) lo.addEventListener('click',()=>{authed=false;authRole=null;currentPage='public-games';render();});
  const lb=document.getElementById('login-btn');
  if(lb) lb.addEventListener('click',doLogin);
  const lp=document.getElementById('l-pass');
  if(lp) lp.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  document.querySelectorAll('[data-atab]').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.atab!=='addgame')pendingScoreGame=null;adminTab=el.dataset.atab;parsedData=null;render();}));
  document.querySelectorAll('[data-lbtab]').forEach(el=>el.addEventListener('click',()=>{
    currentLbTab=el.dataset.lbtab;
    const inner=document.getElementById('lb-inner');if(inner)inner.innerHTML=buildLbInner(currentLbTab);
    document.querySelectorAll('[data-lbtab]').forEach(t=>t.classList.remove('active'));el.classList.add('active');
  }));
  const exportBtn1=document.getElementById('export-stats-btn');
  if(exportBtn1) exportBtn1.addEventListener('click',exportAllStatsCSV);
  document.querySelectorAll('[data-dtab]').forEach(el=>el.addEventListener('click',()=>{
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('[data-dtab]').forEach(x=>x.classList.remove('active'));
    const tc=document.getElementById('dtab-'+el.dataset.dtab);if(tc)tc.classList.add('active');el.classList.add('active');
  }));
  const pb=document.getElementById('parse-btn');
  if(pb) pb.addEventListener('click',()=>{
    const raw=document.getElementById('stat-input').value.trim();
    const errEl=document.getElementById('parse-error');errEl.style.display='none';
    if(!raw){errEl.textContent='Paste a stat block first.';errEl.style.display='block';return;}
    try{
      const teams=parseStatBlock(raw);
      if(!teams||!teams.length) throw new Error('No teams found.');
      parsedData={season:document.getElementById('inp-season').value||'?',week:document.getElementById('inp-week').value||'?',teams};
      render();
    }catch(e){errEl.textContent=e.message;errEl.style.display='block';}
  });
  const pubBtn=document.getElementById('pub-btn');
  if(pubBtn) pubBtn.addEventListener('click',()=>{
    if(!parsedData) return;
    const gd=JSON.parse(JSON.stringify(parsedData));
    gd.teams.forEach((team,ti)=>{
      const sel=document.getElementById(`tassign-${ti}`);const cust=document.getElementById(`tcustom-${ti}`);
      team.publishedName=sel&&sel.value==='__custom__'&&cust&&cust.value?cust.value:(sel?sel.value:team.name);
      ['passing','rushing','receiving','defense'].forEach(sec=>{
        team[sec].forEach((p,pi)=>{const a=document.getElementById(`passign-${ti}-${sec}-${pi}`);p.assignedTeam=a?a.value:team.name;});
      });
    });
    gd.id=Date.now();gd.date=new Date().toLocaleDateString();gd.homeScore='?';gd.awayScore='?';gd.status='FINAL';
    // Merge stats into existing game for same season/week/teams if present
    const existIdx=publishedGames.findIndex(pg=>
      pg.season===gd.season && pg.week===gd.week &&
      pg.teams.some(pt=>gd.teams.some(nd=>nd.publishedName===pt.publishedName||nd.name===pt.name))
    );
    if(existIdx>=0){
      const eg=publishedGames[existIdx];
      gd.teams.forEach(newTeam=>{
        const match=eg.teams.find(et=>et.publishedName===newTeam.publishedName||et.name===newTeam.name);
        if(match){
          ['passing','rushing','receiving','defense'].forEach(sec=>{
            newTeam[sec].forEach(np=>{
              const ep=match[sec].find(p=>p.name===np.name);
              if(ep){
                // stack numeric stats
                ['yds','td','int','cmp','att','rec','tgt','tak','sck','tfl','pbu','lng','fum'].forEach(k=>{
                  if(np[k]!=null) ep[k]=(parseFloat(ep[k])||0)+(parseFloat(np[k])||0);
                });
              } else { match[sec].push(np); }
            });
          });
        } else { eg.teams.push(newTeam); }
      });
      parsedData=null;
      const msg=document.getElementById('pub-msg');if(msg){msg.textContent=`Stats stacked onto S${gd.season} · W${gd.week}`;msg.style.display='block';}
      setTimeout(()=>render(),700);
    } else {

function parseStatBlock(raw){
  const lines=String(raw||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const allTeams=[];let currentTeam=null,currentSection='';
  lines.forEach(line=>{
    const teamMatch=line.match(/^(.+?)\s+Stats\s*$/i);
    if(teamMatch){
      currentTeam={name:teamMatch[1].trim(),passing:[],rushing:[],receiving:[],defense:[]};
      allTeams.push(currentTeam);currentSection='';return;
    }
    const sectionMatch=line.match(/\b(Passing|Rushing|Receiving|Defense)\b/i);
    if(sectionMatch&&!line.includes('|')){currentSection=sectionMatch[1].toLowerCase();return}
    if(!currentTeam||!currentSection||!line.includes('|'))return;
    const parsed=parseLine(line,currentSection);
    if(parsed)currentTeam[currentSection].push(parsed);
  });
  if(!allTeams.length)throw new Error('No teams found. Start each section with: TEAM NAME Stats');
  if(!allTeams.some(t=>t.passing.length||t.rushing.length||t.receiving.length||t.defense.length))throw new Error('Teams were found, but no player rows were parsed. Keep each player on its own line.');
  return allTeams;
}

function parseTeamBlock(name, block){
  const team = {name, passing:[], rushing:[], receiving:[], defense:[]};
  const sectionRe = /\b(Passing|Rushing|Receiving|Defense)\b/gi;
  const spos = [];
  let sm;
  while((sm = sectionRe.exec(block)) !== null){
    spos.push({key: sm[1].toLowerCase(), idx: sm.index + sm[0].length});
  }
  spos.sort((a,b) => a.idx - b.idx);
  for(let i = 0; i < spos.length; i++){
    const chunk = block.slice(spos[i].idx, i+1 < spos.length ? spos[i+1].idx : block.length).trim();
    splitPipeEntries(chunk).forEach(entry => {
      const parsed = parseLine(entry, spos[i].key);
      if(parsed) team[spos[i].key].push(parsed);
    });
  }
  return team;
}

function splitPipeEntries(chunk){
  const STAT_KEYS = new Set(['YDS','TD','INT','ATT','REC','TGT','DROP','LNG','RTG','CMP','AVG','SCK','TAK','TFL','SAF','SWAT','PBU','SCKED','FUM','YPC','20+','PTS','TFL']);
  // Find all player name tokens: a word immediately followed by \s*|
  // Exclude pure stat keys and pure numbers
  const pattern = /(?<![/\d])([A-Za-z][A-Za-z0-9_]*)\s*\|/g;
  const positions = [];
  let pm;
  while((pm = pattern.exec(chunk)) !== null){
    const w = pm[1];
    if(STAT_KEYS.has(w.toUpperCase())) continue;
    if(/^\d+$/.test(w)) continue;
    positions.push(pm.index);
  }
  const entries = [];
  for(let i = 0; i < positions.length; i++){
    const end = i+1 < positions.length ? positions[i+1] : chunk.length;
    const e = chunk.slice(positions[i], end).trim();
    if(e) entries.push(e);
  }
  return entries;
}

function parseLine(line, sec){
  const pipeIdx = line.indexOf('|');
  if(pipeIdx < 0) return null;
  const name = line.slice(0, pipeIdx).trim();
  if(!name) return null;
  const STAT_KEYS = new Set(['YDS','TD','INT','ATT','REC','TGT','DROP','LNG','RTG','CMP','AVG','SCK','TAK','TFL','SAF','SWAT','PBU','SCKED','FUM','YPC','20+','PTS']);
  if(STAT_KEYS.has(name.toUpperCase())) return null;

  const ex = (key) => {
    const rev = line.match(new RegExp('\\b' + key + '\\s+([\\d.]+)', 'i'));
    if(rev) return rev[1];
    const fwd = line.match(new RegExp('[|\\s]([\\d.]+)\\s+' + key + '(?:\\s|\\||$)', 'i'));
    return fwd ? fwd[1] : null;
  };

  if(sec === 'passing'){
    const ca = line.match(/(\d+)\/(\d+)/);
    if(!ca && !ex('YDS')) return null;
    return {name, cmp:ca?ca[1]:null, att:ca?ca[2]:null, yds:ex('YDS'), td:ex('TD'), int:ex('INT'), rtg:ex('RTG'), avg:ex('AVG'), lng:ex('LNG')};
  }
  if(sec === 'rushing') return {name, att:ex('ATT'), yds:ex('YDS'), td:ex('TD'), ypc:ex('YPC'), lng:ex('LNG'), fum:ex('FUM')};
  if(sec === 'receiving') return {name, tgt:ex('TGT'), rec:ex('REC'), yds:ex('YDS'), td:ex('TD'), drop:ex('DROP'), lng:ex('LNG')};
  if(sec === 'defense') return {name, tak:ex('TAK'), tfl:ex('TFL'), sck:ex('SCK'), saf:ex('SAF'), swat:ex('SWAT'), int:ex('INT'), pbu:ex('PBU'), td:ex('TD')};
  return null;
}

function buildAwardsPage(){
  const AWARDS=[
    {id:'mvp',abbr:'MVP',name:'Most Valuable Player'},
    {id:'opoy',abbr:'OPOY',name:'Offensive Player of the Year'},
    {id:'dpoy',abbr:'DPOY',name:'Defensive Player of the Year'},
    {id:'rookieoty',abbr:'ROTY',name:'Rookie of the Year'},
    {id:'eoty',abbr:'EOTY',name:'Executive of the Year'},
    {id:'hcoty',abbr:'HCOTY',name:'Head Coach of the Year'},
    {id:'qboty',abbr:'QBOTY',name:'Quarterback of the Year'},
    {id:'teoty',abbr:'TEOTY',name:'Tight End of the Year'},
    {id:'wroty',abbr:'WROTY',name:'Wide Receiver of the Year'},
    {id:'dboty',abbr:'DBOTY',name:'Defensive Back of the Year'},
    {id:'deoty',abbr:'DEOTY',name:'Defensive End of the Year'},
    {id:'lboty',abbr:'LBOTY',name:'Linebacker of the Year'},
    {id:'mipoty',abbr:'MIPOTY',name:'Most Improved Player of the Year'},
    {id:'jroty',abbr:'JROTY',name:'Journalist of the Year'},

  const sData=awardsData[currentAwardsSeason]||{};
  const isPast=currentAwardsSeason!=='s5';
  const seasonLabel={'s1':'Season 1','s2':'Season 2','s3':'Season 3','s4':'Season 4','s5':'Season 5'}[currentAwardsSeason]||currentAwardsSeason;
  const champName=(seasonChampions&&seasonChampions[currentAwardsSeason])||'';

  const card=(a)=>{
    const candidates=(sData[a.id]||[]);
    const cHTML=candidates.length
      ? candidates.map((name,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)">
          <div style="width:22px;height:22px;border-radius:6px;background:${i===0?'rgba(240,180,41,.18)':'rgba(255,255,255,.06)'};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:${i===0?'var(--gold)':'var(--text2)'};">${i===0?'🏆':i+1}</div>
          <div style="flex:1;font-size:13px;font-weight:700;color:#fff;letter-spacing:.3px">${esc(name)}</div>
          ${i===0&&!isPast?`<div style="font-size:8px;font-weight:700;letter-spacing:1.5px;color:var(--lime);opacity:.8">LEAD</div>`:''}
        </div>`).join('')
      : `<div style="font-size:11px;color:var(--text2);padding:.75rem 0;text-align:center;opacity:.6">No candidates yet</div>`;

      <div style="padding:.65rem 1rem;border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:900;letter-spacing:2px;color:#fff;text-transform:uppercase">${esc(a.abbr)}</div>
          <div style="font-size:9px;color:rgba(255,255,255,.4);margin-top:1px;letter-spacing:.3px">${esc(a.name)}</div>
        </div>
        <div style="font-size:18px;opacity:.18">🏆</div>
      </div>
      <div style="padding:.4rem 1rem .65rem">${cHTML}</div>
    </div>`;
  };

  const seasonOpts=['s1','s2','s3','s4','s5'].map(s=>{
    const lbl={'s1':'Season 1','s2':'Season 2','s3':'Season 3','s4':'Season 4','s5':'Season 5'}[s];
    return `<option value="${s}"${s===currentAwardsSeason?' selected':''}>${lbl}</option>`;
  }).join('');

  return `<div class="lb-page awards-public-page" style="background:transparent">
    <div class="lb-page-hdr" style="background:transparent;border-bottom:1px solid rgba(255,255,255,.08)">
      <div style="font-size:9px;font-weight:700;letter-spacing:2px;color:var(--red);text-transform:uppercase;margin-bottom:4px">◆ ${esc(seasonLabel).toUpperCase()}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
        <div>
          <div class="lb-page-title">AWARD RACES</div>
          <div class="lb-page-sub">${isPast?'Final winners for this season':'Current frontrunners for each major award this season'}</div>
        </div>
        <select id="awards-season-sel" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;padding:7px 14px;border-radius:9px;font-size:12px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;outline:none;cursor:pointer">
          ${seasonOpts}
        </select>
      </div>
    </div>
    ${champName?`<div style="padding:.85rem 1.25rem 0;max-width:900px;margin:0 auto">
      <div style="background:linear-gradient(135deg,rgba(240,180,41,.16),rgba(240,180,41,.04));border:1px solid rgba(240,180,41,.4);border-radius:12px;padding:.9rem 1.1rem;display:flex;align-items:center;gap:12px">
        <div style="font-size:28px">🏆</div>
        <div style="flex:1">
          <div style="font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold)">${esc(seasonLabel).toUpperCase()} UFB CHAMPION</div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:#fff;letter-spacing:.5px;margin-top:2px">${esc(champName)}</div>
        </div>
      </div>
    </div>`:''}
    <div style="padding:.75rem 1.25rem 1rem;display:grid;grid-template-columns:repeat(2,minmax(0,420px));gap:.65rem;justify-content:center;max-width:900px;margin:0 auto">
      ${AWARDS.slice(0,-1).map(a=>card(a)).join('')}
      <div style="grid-column:1/-1;display:flex;justify-content:center;"><div style="width:minmax(0,420px);max-width:420px;flex:0 0 420px;">${card(AWARDS[AWARDS.length-1])}</div></div>
    </div>
  </div>`;
}

// ── CONFERENCES ADMIN TAB ────────────────────────────────
function buildConferencesAdminTab(){
  const confKeys=['conf1','conf2'];
  const divKeys=['north','south'];

  function divSlots(confKey, divKey){
    const slots=conferences[confKey].divisions[divKey].teams;
    // Pad to 6 slots
    while(slots.length<6) slots.push('');
    let html='';
    for(let i=0;i<6;i++){
      const val=slots[i]||'';
      const opts=`<option value="">— Select Team —</option>`
        +teams.map(t=>`<option value="${esc(t.name)}"${t.name===val?' selected':''}>${esc(t.name)}</option>`).join('');
      html+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="font-size:10px;color:var(--text2);width:14px;text-align:right;font-weight:700">${i+1}</span>
        <select class="mini-select conf-team-sel" style="flex:1;padding:6px 8px" data-conf="${confKey}" data-div="${divKey}" data-slot="${i}">
          ${opts}
        </select>
      </div>`;
    }
    return html;
  }

  let html=`<div style="max-width:900px">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text2);margin-bottom:1rem">CONFERENCES — 2 conferences · 2 divisions each · 6 teams per division</div>`;

  confKeys.forEach(function(ck){
    const conf=conferences[ck];
    html+=`<div class="card" style="margin-bottom:1rem;padding:0;overflow:hidden">
      <div style="padding:.75rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
        <input class="mini-input conf-name-input" data-conf="${ck}" value="${esc(conf.name)}"
          style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;letter-spacing:1px;text-transform:uppercase;background:transparent;border:none;border-bottom:1px solid var(--border2);color:#fff;padding:2px 4px;width:220px"
          placeholder="Conference Name">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0">`;

    divKeys.forEach(function(dk,di){
      const div=conf.divisions[dk];
      html+=`<div style="padding:1rem;${di===0?'border-right:1px solid var(--border)':''}">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:.75rem">
            <span style="font-size:9px;font-weight:700;letter-spacing:2px;color:var(--lime);text-transform:uppercase">${dk.toUpperCase()} DIVISION</span>
            <input class="mini-input div-name-input" data-conf="${ck}" data-div="${dk}" value="${esc(div.name)}"
              style="font-size:11px;background:transparent;border:none;border-bottom:1px solid var(--border2);color:var(--text2);padding:1px 4px;width:140px"
              placeholder="Division Name">
          </div>

function getPlayerSeasonStats(){
  // Build aggregated season stats per player from all published games
  const players={};
  publishedGames.forEach(g=>{
    const allSections=['passing','rushing','receiving','defense'];
    g.teams.forEach(team=>{
      const tname=team.publishedName||team.name;
      // team W/L
      const isHome=(g.teams[0]===team);
      const homeScore=parseFloat(g.homeScore)||0;
      const awayScore=parseFloat(g.awayScore)||0;
      let result='?';
      if(g.homeScore!=='?'&&g.awayScore!=='?'){
        if(isHome) result=homeScore>awayScore?'W':homeScore<awayScore?'L':'T';
        else result=awayScore>homeScore?'W':awayScore<homeScore?'L':'T';
      }
      allSections.forEach(sec=>{
        if(!team[sec]) return;
        team[sec].forEach(p=>{
          if(!p.name) return;
          const key=p.name.toLowerCase().trim();
          if(!players[key]){
            const reg=playerRegistry[key]||{};
            players[key]={
              name:p.name,team:p.assignedTeam||tname,pos:reg.position||'—',
              passing:{yds:0,td:0,int:0,cmp:0,att:0},
              rushing:{yds:0,td:0,att:0},
              receiving:{yds:0,td:0,rec:0,tgt:0},
              defense:{tak:0,sck:0,int:0,pbu:0},
              games:[],wins:0,losses:0
            };
          }
          // stack stats
          if(sec==='passing'){
            players[key].passing.yds+=(+p.yds||0);
            players[key].passing.td+=(+p.td||0);
            players[key].passing.int+=(+p.int||0);
            players[key].passing.cmp+=(+p.cmp||0);
            players[key].passing.att+=(+p.att||0);
          } else if(sec==='rushing'){
            players[key].rushing.yds+=(+p.yds||0);
            players[key].rushing.td+=(+p.td||0);
            players[key].rushing.att+=(+p.att||0);
          } else if(sec==='receiving'){
            players[key].receiving.yds+=(+p.yds||0);
            players[key].receiving.td+=(+p.td||0);
            players[key].receiving.rec+=(+p.rec||0);
            players[key].receiving.tgt+=(+p.tgt||0);
          } else if(sec==='defense'){
            players[key].defense.tak+=(+p.tak||0);
            players[key].defense.sck+=(+p.sck||0);
            players[key].defense.int+=(+p.int||0);
            players[key].defense.pbu+=(+p.pbu||0);
          }
          // track game
          if(!players[key].games.find(gk=>gk.id===g.id)){
            players[key].games.push({id:g.id,week:g.week,result});
            if(result==='W') players[key].wins++;
            else if(result==='L') players[key].losses++;
          }
        });
      });
    });
  });
  return players;
}

function buildPlayerProfile(pl, allPlayers){
  const reg=playerRegistry[pl.name.toLowerCase().trim()]||{};
  const pos=(reg.position||'—').toUpperCase();
  const hasPass=pl.passing.yds>0||pl.passing.att>0;
  const hasRush=pl.rushing.yds>0||pl.rushing.att>0;
  const hasRec=pl.receiving.yds>0||pl.receiving.rec>0;
  const hasDef=pl.defense.tak>0||pl.defense.sck>0||pl.defense.int>0;

  const statBox=(val,label)=>`<div style="background:var(--surface3);border:1px solid var(--border);border-radius:10px;padding:1rem;text-align:center">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;color:#fff;line-height:1">${val}</div>
    <div style="font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-top:4px">${label}</div>
  </div>`;

  let statsGrid='';
  if(hasPass){
    statsGrid+=statBox(pl.passing.yds,'Pass YDS');
    statsGrid+=statBox(pl.passing.td,'Pass TD');
    statsGrid+=statBox(pl.passing.int,'INT');
    statsGrid+=statBox(pl.passing.cmp+'/'+pl.passing.att,'CMP/ATT');
  }
  if(hasRush){
    statsGrid+=statBox(pl.rushing.yds,'Rush YDS');
    statsGrid+=statBox(pl.rushing.td,'Rush TD');
    statsGrid+=statBox(pl.rushing.att,'Carries');
  }
  if(hasRec){
    statsGrid+=statBox(pl.receiving.yds,'Rec YDS');
    statsGrid+=statBox(pl.receiving.td,'Rec TD');
    statsGrid+=statBox(pl.receiving.rec+'/'+pl.receiving.tgt,'REC/TGT');
  }
  if(hasDef){
    statsGrid+=statBox(pl.defense.tak,'Tackles');
    statsGrid+=statBox(pl.defense.sck,'Sacks');
    statsGrid+=statBox(pl.defense.int,'INT');
    statsGrid+=statBox(pl.defense.pbu,'PBU');
  }
  if(!statsGrid) statsGrid=`<div style="color:var(--text2);font-size:11px;padding:1rem 0">No stat data available.</div>`;

  // Game log
  let gameRows='';
  publishedGames.forEach(g=>{
    const pkey=pl.name.toLowerCase().trim();
    // find player in this game
    let found=false;
    g.teams.forEach(team=>{
      const tname=team.publishedName||team.name;
      ['passing','rushing','receiving','defense'].forEach(sec=>{
        if(!team[sec])return;
        const match=team[sec].find(p=>p.name.toLowerCase().trim()===pkey);
        if(match&&!found){
          found=true;
          const isHome=(g.teams[0]===team);
          const hs=parseFloat(g.homeScore)||0;
          const as_=parseFloat(g.awayScore)||0;
          let result='—',resColor='var(--text2)';
          if(g.homeScore!=='?'&&g.awayScore!=='?'){
            const won=isHome?(hs>as_):(as_>hs);
            const tied=hs===as_;
            result=tied?'T':won?`W ${g.homeScore}-${g.awayScore}`:`L ${g.homeScore}-${g.awayScore}`;
            resColor=tied?'var(--text2)':won?'#4ade80':'var(--red)';
          }
          const opp=g.teams.find(t=>t!==team);
          const oppName=opp?opp.publishedName||opp.name:'?';
          let statStr='';
          if(sec==='passing') statStr=`${match.cmp||0}/${match.att||0} · ${match.yds||0} YDS · ${match.td||0} TD`;
          else if(sec==='rushing') statStr=`${match.att||0} ATT · ${match.yds||0} YDS · ${match.td||0} TD`;
          else if(sec==='receiving') statStr=`${match.rec||0}/${match.tgt||0} · ${match.yds||0} YDS · ${match.td||0} TD`;
          else statStr=`${match.tak||0} TAK · ${match.sck||0} SCK · ${match.int||0} INT`;
          gameRows+=`<tr style="border-bottom:1px solid var(--border)">
            <td style="padding:8px 12px;font-size:11px;color:var(--text2)">Wk ${esc(g.week)}</td>
            <td style="padding:8px 12px;font-size:11px;color:#fff;font-weight:600">${esc(tname)}</td>
            <td style="padding:8px 12px;font-size:11px;color:var(--text2)">vs ${esc(oppName)}</td>
            <td style="padding:8px 12px;font-size:11px;font-weight:700;color:${resColor}">${esc(result)}</td>
            <td style="padding:8px 12px;font-size:11px;color:var(--text2)">${esc(statStr)}</td>
          </tr>`;
        }
      });
    });
  });

  const wl=`${pl.wins}-${pl.losses}`;
  return `<div class="lb-page">
    <div class="lb-page-hdr">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <div id="back-to-watchlist" style="font-size:11px;color:var(--lime);cursor:pointer;font-weight:700;letter-spacing:1px">← PLAYERS</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,rgba(200,241,53,.2),rgba(0,212,255,.1));border:2px solid rgba(200,241,53,.3);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:var(--lime)">${esc(pl.name[0].toUpperCase())}</div>
        <div>
          <div class="lb-page-title" style="font-size:24px">${esc(pl.name)}</div>
          <div style="display:flex;gap:6px;margin-top:4px">
            <span style="font-size:9px;font-weight:700;letter-spacing:1.5px;padding:2px 8px;border-radius:10px;background:var(--surface4);color:var(--text2);border:1px solid var(--border)">${esc(pos)}</span>
            <span style="font-size:9px;font-weight:700;letter-spacing:1.5px;padding:2px 8px;border-radius:10px;background:var(--surface4);color:var(--text2);border:1px solid var(--border)">${esc(pl.team||'FA')}</span>
            <span style="font-size:9px;font-weight:700;letter-spacing:1.5px;padding:2px 8px;border-radius:10px;background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.25)">${wl} W-L</span>
          </div>
        </div>
      </div>
    </div>
    <div style="padding:.75rem 1.25rem">
      <div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--lime);text-transform:uppercase;margin-bottom:.5rem;font-family:'Barlow Condensed',sans-serif">Season Totals</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.5rem;margin-bottom:1rem">
        ${statsGrid}
      </div>
      <div style="font-size:10px;font-weight:700;letter-spacing:2px;color:var(--lime);text-transform:uppercase;margin-bottom:.5rem;font-family:'Barlow Condensed',sans-serif">Game Log (${pl.games.length} games)</div>
      <div style="background:var(--surface3);border:1px solid var(--border);border-radius:10px;overflow:hidden">
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-size:12px">
            <thead><tr style="background:var(--surface4)">
              <th style="padding:8px 12px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);font-weight:700">WK</th>
              <th style="padding:8px 12px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);font-weight:700">TEAM</th>
              <th style="padding:8px 12px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);font-weight:700">OPPONENT</th>
              <th style="padding:8px 12px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);font-weight:700">RESULT</th>
              <th style="padding:8px 12px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--text2);font-weight:700">STATS</th>
            </tr></thead>
            <tbody>${gameRows||'<tr><td colspan="5" style="text-align:center;padding:1.5rem;color:var(--text2);font-size:11px">No game data</td></tr>'}</tbody>
          </table>
        </div>
      </div>
    </div>
  </div>`;
}

function buildTeamsPage(){
  // compute standings
  const standings={};
  teams.forEach(function(t){ standings[t.name]={name:t.name,wins:0,losses:0,ties:0,pf:0,pa:0}; });
  publishedGames.forEach(function(g){
    if(g.status!=='FINAL') return;
    const n0=(g.teams[0]&&(g.teams[0].publishedName||g.teams[0].name))||(g.homeName||'');
    const n1=(g.teams[1]&&(g.teams[1].publishedName||g.teams[1].name))||(g.awayName||'');
    const s0=parseInt(g.homeScore)||0, s1=parseInt(g.awayScore)||0;
    if(!standings[n0]) standings[n0]={name:n0,wins:0,losses:0,ties:0,pf:0,pa:0};
    if(!standings[n1]) standings[n1]={name:n1,wins:0,losses:0,ties:0,pf:0,pa:0};
    standings[n0].pf+=s0; standings[n0].pa+=s1;
    standings[n1].pf+=s1; standings[n1].pa+=s0;
    if(s0>s1){standings[n0].wins++;standings[n1].losses++;}
    else if(s1>s0){standings[n1].wins++;standings[n0].losses++;}
    else{standings[n0].ties++;standings[n1].ties++;}
  });

  let html=`<div class="inner-page">
    <div class="inner-page-header">
      <div class="iph-eyebrow">⬡ Franchises</div>
      <div class="iph-title">TEAMS</div>
    </div>
    <div class="inner-content">`;
  html+=buildConferenceStandingsHTML(standings);
  html+=`</div></div>`;
  return html;
}

          ['conf1','conf2'].forEach(ck=>{

          });

          playoffBracket.elite8.forEach(m=>{m.teams=m.teams.map(t=>t===oldName?name:t);});
          playoffBracket.f4.forEach(m=>{m.teams=m.teams.map(t=>t===oldName?name:t);});
          playoffBracket.ufb.teams=playoffBracket.ufb.teams.map(t=>t===oldName?name:t);
          // Published games (homeName/awayName/publishedName)
          publishedGames.forEach(g=>{
            if(g.homeName===oldName) g.homeName=name;

          Object.keys(playerRegistry).forEach(k=>{

function getPlayerPortalData(name){
  const key=String(name||'').toLowerCase(),totals={passing:{},rushing:{},receiving:{},defense:{}},statKeys={passing:['cmp','att','yds','td','int'],rushing:['att','yds','td','fum'],receiving:['tgt','rec','yds','td','drop'],defense:['tak','tfl','sck','saf','swat','int','pbu','td']};
  let teamName=(playerRegistry[key]&&playerRegistry[key].teamName)||'';
  publishedGames.forEach(g=>(g.teams||[]).forEach(t=>Object.keys(statKeys).forEach(sec=>(t[sec]||[]).forEach(p=>{
    if(String(p.name||'').toLowerCase()!==key)return;
    teamName=p.assignedTeam||t.publishedName||t.name||teamName;
    statKeys[sec].forEach(k=>totals[sec][k]=(+totals[sec][k]||0)+(+p[k]||0));
  }))));
  const standing=hubStandings().find(s=>String(s.name).toLowerCase()===String(teamName).toLowerCase());
  return {teamName:teamName||'Unassigned',record:standing?`${standing.w}-${standing.l}${standing.t?'-'+standing.t:''}`:'0-0',totals};
}

function hubGameNames(g){
  const a=(g.teams&&g.teams[0]&&(g.teams[0].publishedName||g.teams[0].name))||g.homeName||'TBD';
  const b=(g.teams&&g.teams[1]&&(g.teams[1].publishedName||g.teams[1].name))||g.awayName||'TBD';
  return [a,b];
}
function hubStandings(){
  const rows={};
  teams.forEach(t=>rows[t.name]={name:t.name,w:0,l:0,t:0,pf:0,pa:0});
  publishedGames.forEach(g=>{
    const n=hubGameNames(g),a=n[0],b=n[1];
    if(!rows[a])rows[a]={name:a,w:0,l:0,t:0,pf:0,pa:0};
    if(!rows[b])rows[b]={name:b,w:0,l:0,t:0,pf:0,pa:0};
    if((g.status||'FINAL')!=='FINAL')return;
    const sa=+g.homeScore||0,sb=+g.awayScore||0;
    rows[a].pf+=sa;rows[a].pa+=sb;rows[b].pf+=sb;rows[b].pa+=sa;
    if(sa>sb){rows[a].w++;rows[b].l++}else if(sb>sa){rows[b].w++;rows[a].l++}else{rows[a].t++;rows[b].t++}
  });
  return Object.values(rows).sort((a,b)=>(b.w-a.w)||((b.pf-b.pa)-(a.pf-a.pa))||a.name.localeCompare(b.name));
}
function hubLeaders(){
  const buckets={passing:[],rushing:[],receiving:[],defense:[]};
  publishedGames.forEach(g=>(g.teams||[]).forEach(t=>{
    const team=t.publishedName||t.name||'';
    Object.keys(buckets).forEach(k=>(t[k]||[]).forEach(p=>buckets[k].push({...p,teamName:p.assignedTeam||team})));
  }));
  const defs=[
    ['PASSING','passing','yds','YDS'],['RUSHING','rushing','yds','YDS'],
    ['RECEIVING','receiving','yds','YDS'],['DEFENSE','defense','tak','TAK']
  ];
  return defs.map(([cat,key,metric,suffix])=>{
    const p=buckets[key].sort((a,b)=>(+b[metric]||0)-(+a[metric]||0))[0];
    return p?{cat,name:p.name,team:p.teamName,val:(p[metric]||0)+' '+suffix}:null;
  }).filter(Boolean);
}

      setTimeout(function(){
        const ls=document.getElementById('loading-screen');
        const root=document.getElementById('root');
        ls.classList.add('fade-out');
        root.style.display='';
        render();
        setTimeout(()=>{ls.style.display='none';},600);
      },350);
    }
  }
  setTimeout(next,120);
})();
</script>
</body>
