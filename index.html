        <div class="stat-tab${adminTab==='settings'?' active':''}" data-atab="settings">Settings</div>
        <div class="stat-tab${adminTab==='teams'?' active':''}" data-atab="teams">Teams</div>
        <div class="stat-tab${adminTab==='players'?' active':''}" data-atab="players">Players</div>
        <div class="stat-tab${adminTab==='conferences'?' active':''}" data-atab="conferences">Conferences</div>
        <div class="stat-tab${adminTab==='awards'?' active':''}" data-atab="awards">Awards</div>
        <div class="stat-tab${adminTab==='playoffs'?' active':''}" data-atab="playoffs">Playoffs</div>
        ${isOwner?`<div class="stat-tab${adminTab==='accounts'?' active':''}" data-atab="accounts" style="color:#a78bfa">Accounts</div>`:''}
      </div>
      ${adminTab==='import'?buildImportTab():adminTab==='games'?buildManageTab():adminTab==='addgame'?buildAddGameTab():adminTab==='settings'?buildSettingsTab():adminTab==='teams'?buildTeamsAdminTab():adminTab==='players'?buildPlayersAdminTab():adminTab==='conferences'?buildConferencesAdminTab():adminTab==='awards'?buildAwardsAdminTab():adminTab==='playoffs'?buildPlayoffsAdminTab():adminTab==='accounts'&&isOwner?buildAccountsTab():buildImportTab()}
    </div>
  </div>`;
}

// ── NAV OVERRIDE: attach events ───────────────────────────
const _origAttachEvents = attachEvents;
function attachEvents(){
  // bottom nav
  document.querySelectorAll('.bn-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const p=el.dataset.page;
      if(!p||p==='__more__') return;
      if(p==='login'&&authed){currentPage='admin';render();return;}
      currentPage=p;
      if(p==='public-games'||p==='public-home') viewingGame=null;
      render();
    });
  });
  // qa-items & hm-card-action
  document.querySelectorAll('.qa-item[data-page],.hm-card-action[data-page],.conf-team-row[data-page]').forEach(el=>{
    el.addEventListener('click',()=>{
      const p=el.dataset.page;
      if(p){currentPage=p;render();}
    });
  });
  // logout
  const lo=document.getElementById('logout-btn');
  if(lo) lo.addEventListener('click',()=>{authed=false;authRole=null;currentPage='public-games';render();});
  // login
  const lb=document.getElementById('login-btn');
  if(lb) lb.addEventListener('click',doLogin);
  const lp=document.getElementById('l-pass');
  if(lp) lp.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  // admin tabs
  document.querySelectorAll('[data-atab]').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.atab!=='addgame'){pendingScoreGame=null;editingScoreIdx=null;}adminTab=el.dataset.atab;parsedData=null;render();}));
  // lb tabs
  document.querySelectorAll('[data-lbtab]').forEach(el=>el.addEventListener('click',()=>{
    currentLbTab=el.dataset.lbtab;
    const inner=document.getElementById('lb-inner');if(inner)inner.innerHTML=buildLbInner(currentLbTab);
    // plain offense tabs
    document.querySelectorAll('.lb-tab').forEach(t=>t.classList.remove('active'));
    if(['passing','rushing','receiving'].includes(currentLbTab)) el.classList.add('active');
    // dropdown state
    const dropBtn=document.getElementById('def-drop-btn');
    const dropMenu=document.getElementById('def-drop-menu');
    if(dropBtn){
      const isDefTab=['db','de'].includes(currentLbTab);
      const label=currentLbTab==='db'?'DB':currentLbTab==='de'?'DE':'Defense';
      dropBtn.innerHTML=`${isDefTab?label:'Defense'} <span class="lb-drop-arrow">&#9660;</span>`;
      dropBtn.classList.toggle('active',isDefTab);
    }
    if(dropMenu) dropMenu.style.display='none';
    document.querySelectorAll('.lb-drop-item').forEach(i=>i.classList.toggle('selected',i.dataset.lbtab===currentLbTab));
  }));
  // defense dropdown toggle
  const defDropBtn=document.getElementById('def-drop-btn');
  const defDropMenu=document.getElementById('def-drop-menu');
  if(defDropBtn&&defDropMenu){
    defDropBtn.addEventListener('click',e=>{
      e.stopPropagation();
      defDropMenu.style.display=defDropMenu.style.display==='block'?'none':'block';
    });
    defDropMenu.addEventListener('click',e=>e.stopPropagation());
    document.body.addEventListener('click',()=>{if(defDropMenu)defDropMenu.style.display='none';});
  }
  // stat detail tabs
  document.querySelectorAll('[data-dtab]').forEach(el=>el.addEventListener('click',()=>{
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('[data-dtab]').forEach(x=>x.classList.remove('active'));
    const tc=document.getElementById('dtab-'+el.dataset.dtab);if(tc)tc.classList.add('active');el.classList.add('active');
  }));
  // parse btn
  const pb=document.getElementById('parse-btn');
  if(pb) pb.addEventListener('click',()=>{
    const raw=document.getElementById('stat-input').value.trim();
    const errEl=document.getElementById('parse-error');errEl.style.display='none';
    if(!raw){errEl.textContent='Paste a stat block first.';errEl.style.display='block';return;}
    try{
      const teams=parseStatBlock(raw);
      if(!teams||!teams.length) throw new Error('No teams found.');
      parsedData={season:document.getElementById('inp-season').value||'?',week:document.getElementById('inp-week').value||'?',teams};
      render();
    }catch(e){errEl.textContent=e.message;errEl.style.display='block';}
  });
  const pubBtn=document.getElementById('pub-btn');
  if(pubBtn) pubBtn.addEventListener('click',()=>{
    if(!parsedData) return;
    const gd=JSON.parse(JSON.stringify(parsedData));
    gd.teams.forEach((team,ti)=>{
      const sel=document.getElementById(`tassign-${ti}`);const cust=document.getElementById(`tcustom-${ti}`);
      team.publishedName=sel&&sel.value==='__custom__'&&cust&&cust.value?cust.value:(sel?sel.value:team.name);
      ['passing','rushing','receiving','defense'].forEach(sec=>{
        team[sec].forEach((p,pi)=>{const a=document.getElementById(`passign-${ti}-${sec}-${pi}`);p.assignedTeam=a?a.value:team.name;});
      });
    });
    gd.id=Date.now();gd.date=new Date().toLocaleDateString();gd.homeScore='?';gd.awayScore='?';gd.status='FINAL';
    publishedGames.unshift(gd);parsedData=null;
    if(window._dbSave) window._dbSave(); // save immediately
    const msg=document.getElementById('pub-msg');if(msg){msg.textContent=`Game published! S${gd.season} · W${gd.week}`;msg.style.display='block';}
    setTimeout(()=>render(),700);
  });
  // team assign
  document.querySelectorAll('[id^="tassign-"]').forEach(sel=>{
    const ti=sel.id.replace('tassign-','');
    sel.addEventListener('change',()=>{const c=document.getElementById(`tcustom-${ti}`);if(c)c.style.display=sel.value==='__custom__'?'inline-block':'none';});
  });
  // back btn
  const b=document.getElementById('back-to-games');
  if(b) b.addEventListener('click',()=>{viewingGame=null;const gc=document.getElementById('games-content');if(gc){gc.innerHTML=buildGamesList();attachEvents();}});
  // game cards
  document.querySelectorAll('.gc[data-gidx]').forEach(el=>el.addEventListener('click',()=>{
    viewingGame=publishedGames[parseInt(el.dataset.gidx)];
    const gc=document.getElementById('games-content');
    if(gc){gc.innerHTML=buildGameDetail(viewingGame);attachDetailEvents();}
  }));
  // delete game
  document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>{
    if(confirm('Delete this game?')){publishedGames.splice(parseInt(el.dataset.del),1);if(window._dbSave) window._dbSave();render();}
  }));
  document.querySelectorAll('[data-editscore]').forEach(el=>el.addEventListener('click',()=>{
    editingScoreIdx=parseInt(el.dataset.editscore);
    pendingScoreGame=null;
    adminTab='addgame';render();
  }));
  // season settings
  const seasonNumSel=document.getElementById('season-num-sel');
  if(seasonNumSel) seasonNumSel.addEventListener('change',()=>{seasonNum=parseInt(seasonNumSel.value);if(window._dbSave) window._dbSave();render();});
  document.querySelectorAll('input[name="season-status"]').forEach(el=>el.addEventListener('change',()=>{seasonStatus=el.value;if(window._dbSave) window._dbSave();render();}));
  const nattyBtn=document.getElementById('natty-toggle');
  if(nattyBtn) nattyBtn.addEventListener('click',()=>{nattyEnabled=!nattyEnabled;if(window._dbSave) window._dbSave();render();});
  // team CRUD
  const tmSave=document.getElementById('tm-save-btn');
  if(tmSave) tmSave.addEventListener('click',()=>{
    const name=(document.getElementById('tm-name').value||'').trim();
    const coach=(document.getElementById('tm-coach').value||'').trim();
    const owner=(document.getElementById('tm-owner').value||'').trim();
    const imgUrl=(document.getElementById('tm-imgurl').value||'').trim();
    const fileInput=document.getElementById('tm-imgfile');
    const msg=document.getElementById('tm-msg');
    if(!name){msg.textContent='Team name is required.';msg.className='err';msg.style.display='block';return;}
    const saveTeam=(img,isFile)=>{
      const td={name,headCoach:coach,owner,image:img||'',imageIsFile:!!isFile};
      if(editingTeamIdx!==null){teams[editingTeamIdx]=td;editingTeamIdx=null;}
      else{teams.push(td);}
      msg.textContent='Team saved!';msg.className='ok';msg.style.display='block';
      if(window._dbSave) window._dbSave(); // save immediately to Firebase
      setTimeout(()=>{adminTab='teams';render();},600);
    };
    if(fileInput&&fileInput.files&&fileInput.files[0]){
      const reader=new FileReader();
      reader.onload=e=>saveTeam(e.target.result,true);
      reader.readAsDataURL(fileInput.files[0]);
    } else { saveTeam(imgUrl,false); }
  });
  const tmCancel=document.getElementById('tm-cancel-btn');
  if(tmCancel) tmCancel.addEventListener('click',()=>{editingTeamIdx=null;adminTab='teams';render();});
  document.querySelectorAll('[data-editteam]').forEach(el=>el.addEventListener('click',()=>{editingTeamIdx=parseInt(el.dataset.editteam);adminTab='teams';render();}));
  document.querySelectorAll('[data-delteam]').forEach(el=>el.addEventListener('click',()=>{
    if(confirm('Delete this team?')){teams.splice(parseInt(el.dataset.delteam),1);if(editingTeamIdx!==null)editingTeamIdx=null;adminTab='teams';if(window._dbSave) window._dbSave();render();}
  }));
  const imgFileInput=document.getElementById('tm-imgfile');
  if(imgFileInput) imgFileInput.addEventListener('change',()=>{
    const f=imgFileInput.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=e=>{let prev=document.getElementById('img-preview-el')||document.querySelector('.img-preview');if(prev){prev.src=e.target.result;prev.style.display='block';}};
    reader.readAsDataURL(f);
  });
  // addgame
  function updateTeamPreview(selectId, previewId){
    const sel=document.getElementById(selectId);const preview=document.getElementById(previewId);
    if(!sel||!preview)return;
    const name=sel.value;const team=teams.find(t=>t.name===name);
    if(!team||!name){preview.innerHTML=`<span class="ag-team-preview-empty">Select a team above</span>`;}
    else{
      const logo=team.image?`<img src="${team.image}" class="ag-team-preview-logo" onerror="this.style.display='none'">`:`<div class="ag-team-preview-logo" style="display:flex;align-items:center;justify-content:center;font-size:16px">⬡</div>`;
      preview.innerHTML=logo+`<div><div class="ag-team-preview-name">${esc(team.name)}</div><div style="font-size:10px;color:var(--text2)">${team.headCoach?'Coach: '+esc(team.headCoach):''}</div></div>`;
    }
  }
  const agHomeEl=document.getElementById('ag-home');
  const agAwayEl=document.getElementById('ag-away');
  if(agHomeEl) agHomeEl.addEventListener('change',()=>updateTeamPreview('ag-home','ag-home-preview'));
  if(agAwayEl) agAwayEl.addEventListener('change',()=>updateTeamPreview('ag-away','ag-away-preview'));
  const agBtn=document.getElementById('addgame-btn');
  if(agBtn) agBtn.addEventListener('click',()=>{
    const home=(document.getElementById('ag-home').value||'').trim();
    const away=(document.getElementById('ag-away').value||'').trim();
    const msg=document.getElementById('addgame-msg');
    if(!home||!away){msg.textContent='Select both teams.';msg.className='err';msg.style.display='block';return;}
    if(home===away){msg.textContent='Home and away teams must be different.';msg.className='err';msg.style.display='block';return;}
    const homeTeam=teams.find(t=>t.name===home);const awayTeam=teams.find(t=>t.name===away);
    const gd={id:Date.now(),season:document.getElementById('ag-season').value||'?',week:document.getElementById('ag-week').value||'?',date:new Date().toLocaleDateString(),
      homeName:home,awayName:away,
      homeImage:homeTeam&&homeTeam.image?homeTeam.image:'',awayImage:awayTeam&&awayTeam.image?awayTeam.image:'',
      homeScore:document.getElementById('ag-hscore').value||'?',awayScore:document.getElementById('ag-ascore').value||'?',
      homeRank:document.getElementById('ag-hrank').value||null,awayRank:document.getElementById('ag-arank').value||null,
      status:document.getElementById('ag-status').value,
      teams:[
        {name:home,publishedName:home,image:homeTeam&&homeTeam.image?homeTeam.image:'',passing:[],rushing:[],receiving:[],defense:[]},
        {name:away,publishedName:away,image:awayTeam&&awayTeam.image?awayTeam.image:'',passing:[],rushing:[],receiving:[],defense:[]}
      ]};
    publishedGames.unshift(gd);if(window._dbSave) window._dbSave();
    msg.textContent='Game card added!';msg.className='ok';msg.style.display='block';
    ['ag-season','ag-week','ag-hscore','ag-ascore','ag-hrank','ag-arank'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
    document.getElementById('ag-home').selectedIndex=0;document.getElementById('ag-away').selectedIndex=0;
    updateTeamPreview('ag-home','ag-home-preview');updateTeamPreview('ag-away','ag-away-preview');
  });
  // awards season selector (public page)
  const awsSeasonSel=document.getElementById('awards-season-sel');
  if(awsSeasonSel) awsSeasonSel.addEventListener('change',()=>{currentAwardsSeason=awsSeasonSel.value;render();});
  // awards season selector (admin tab)
  const adminAwsSel=document.getElementById('admin-awards-season-sel');
  if(adminAwsSel) adminAwsSel.addEventListener('change',()=>{currentAwardsSeason=adminAwsSel.value;adminTab='awards';render();});
  // awards admin
  document.querySelectorAll('.award-add-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const aid=btn.dataset.award;
      const inp=document.querySelector(`.award-inp[data-award="${aid}"]`);
      const val=(inp?inp.value:'').trim();
      if(!val)return;
      if(!awardsData[currentAwardsSeason]) awardsData[currentAwardsSeason]={};
      if(!awardsData[currentAwardsSeason][aid]) awardsData[currentAwardsSeason][aid]=[];
      awardsData[currentAwardsSeason][aid].push(val);
      if(inp)inp.value='';
      if(window._dbSave) window._dbSave(); // save immediately
      adminTab='awards';render();
    });
  });
  document.querySelectorAll('.award-remove-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const aid=btn.dataset.award;const idx=parseInt(btn.dataset.idx);
      if(awardsData[currentAwardsSeason]&&awardsData[currentAwardsSeason][aid]) awardsData[currentAwardsSeason][aid].splice(idx,1);
      if(window._dbSave) window._dbSave(); // save immediately
      adminTab='awards';render();
    });
  });
  // playoff admin
  const playoffToggle=document.getElementById('playoff-toggle');
  if(playoffToggle) playoffToggle.addEventListener('click',()=>{playoffEnabled=!playoffEnabled;if(window._dbSave) window._dbSave();adminTab='playoffs';render();});
  const playoffSave=document.getElementById('playoff-save-btn');
  if(playoffSave) playoffSave.addEventListener('click',()=>{
    document.querySelectorAll('[data-po]').forEach(sel=>{
      const key=sel.dataset.po;
      const val=sel.value;
      if(key.startsWith('e8-')){const [,i,t]=key.split('-');if(playoffBracket.elite8[i])playoffBracket.elite8[i].teams[t]=val;}
      else if(key.startsWith('f4-')){const [,i,t]=key.split('-');if(playoffBracket.f4[i])playoffBracket.f4[i].teams[t]=val;}
      else if(key.startsWith('ufb-')){const t=key.split('-')[1];playoffBracket.ufb.teams[t]=val;}
    });
    const msg=document.getElementById('playoff-save-msg');
    if(window._dbSave) window._dbSave(); // save bracket immediately
    if(msg){msg.textContent='Bracket saved!';msg.style.display='block';setTimeout(()=>{msg.style.display='none';},2000);}
  });
  // watchlist player list clicks
  document.querySelectorAll('.player-list-row').forEach(el=>{
    el.addEventListener('mouseenter',()=>{el.style.background='rgba(255,255,255,.03)';});
    el.addEventListener('mouseleave',()=>{el.style.background='';});
    el.addEventListener('click',()=>{
      currentPlayerKey=el.dataset.pkey;
      render();
    });
  });
  // back to watchlist list
  const backWl=document.getElementById('back-to-watchlist');
  if(backWl) backWl.addEventListener('click',()=>{currentPlayerKey=null;render();});
  // player search
  const psi=document.getElementById('player-search-inp');
  if(psi) psi.addEventListener('input',()=>{
    const q=psi.value.toLowerCase();
    document.querySelectorAll('.player-list-row').forEach(row=>{
      const text=row.textContent.toLowerCase();
      row.style.display=text.includes(q)?'':'none';
    });
  });
  // accounts
  document.querySelectorAll('[data-na-add]').forEach(el=>el.addEventListener('click',()=>{
    const u=(document.getElementById('na-user').value||'').trim();
    const p=(document.getElementById('na-pass').value||'').trim();
    const msg=document.getElementById('na-msg');
    if(!u||!p){msg.textContent='Username and password required.';msg.className='err';msg.style.display='block';return;}
    if(adminAccounts.find(a=>a.user===u)){msg.textContent='Username already exists.';msg.className='err';msg.style.display='block';return;}
    adminAccounts.push({user:u,pass:p});msg.textContent='Account added!';msg.className='ok';msg.style.display='block';
    document.getElementById('na-user').value='';document.getElementById('na-pass').value='';
    if(window._dbSave) window._dbSave();
    setTimeout(()=>render(),700);
  }));
  document.querySelectorAll('[data-deladmin]').forEach(el=>el.addEventListener('click',()=>{
    const i=parseInt(el.dataset.deladmin);
    if(confirm('Remove admin account "'+adminAccounts[i].user+'"?')){adminAccounts.splice(i,1);if(window._dbSave) window._dbSave();adminTab='accounts';render();}
  }));
  // player controls
  document.querySelectorAll('.player-pos-sel').forEach(sel=>{
    sel.addEventListener('change',()=>{
      const key=sel.dataset.pkey;
      if(playerRegistry[key]){
        playerRegistry[key].position=sel.value;
        playerRegistry[key]._posOverride=true;
        // Re-render the players tab so the TAK→SCK toggle appears/disappears instantly
        adminTab='players';render();
      }
    });
  });
  document.querySelectorAll('.player-team-sel').forEach(sel=>{
    sel.addEventListener('change',()=>{
      const key=sel.dataset.pkey;
      if(playerRegistry[key]){playerRegistry[key].teamName=sel.value;playerRegistry[key]._teamOverride=true;}
    });
  });
  // DE tak-as-sck toggle
  document.querySelectorAll('.de-tak-toggle').forEach(cb=>{
    cb.addEventListener('change',()=>{
      const key=cb.dataset.pkey;
      if(playerRegistry[key]){playerRegistry[key]._takAsSck=cb.checked;}
    });
  });

  // conference name inputs
  document.querySelectorAll('.conf-name-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ck=inp.dataset.conf;
      if(conferences[ck]) conferences[ck].name=inp.value;
    });
  });
  document.querySelectorAll('.div-name-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const ck=inp.dataset.conf, dk=inp.dataset.div;
      if(conferences[ck]&&conferences[ck].divisions[dk]) conferences[ck].divisions[dk].name=inp.value;
    });
  });
  // conference team slot selects
  document.querySelectorAll('.conf-team-sel').forEach(sel=>{
    sel.addEventListener('change',()=>{
      const ck=sel.dataset.conf, dk=sel.dataset.div, slot=parseInt(sel.dataset.slot);
      if(conferences[ck]&&conferences[ck].divisions[dk]){
        while(conferences[ck].divisions[dk].teams.length<=slot) conferences[ck].divisions[dk].teams.push('');
        conferences[ck].divisions[dk].teams[slot]=sel.value;
      }
    });
  });
  // save conferences button
  const saveConf=document.getElementById('save-conferences');
  if(saveConf){
    saveConf.addEventListener('click',()=>{
      // Trim empty trailing slots
      ['conf1','conf2'].forEach(ck=>{
        ['north','south'].forEach(dk=>{
          conferences[ck].divisions[dk].teams=conferences[ck].divisions[dk].teams.slice(0,6);
        });
      });
      if(window._dbSave) window._dbSave(); // save immediately
      const msg=document.getElementById('conf-saved-msg');
      if(msg){msg.style.display='inline';setTimeout(()=>{msg.style.display='none';},2000);}
      adminTab='conferences';render();
    });
  }
}


/* LOADING */
(function(){
  document.getElementById('ls-img').src = BADGE;
  const fill=document.getElementById('ls-fill');
  const pct=document.getElementById('ls-pct');
  const msg=document.getElementById('ls-msg');
  const stages=[
    {p:10,s:'Initializing'},
    {p:25,s:'Loading Assets'},
    {p:45,s:'Connecting to Database'},
    {p:65,s:'Loading League Data'},
    {p:82,s:'Setting Up Interface'},
    {p:95,s:'Almost Ready'},
    {p:100,s:'Ready!'}
  ];
  let si=0;
  let loaderDone=false;
  let firebaseDone=false;

  function launchApp(){
    if(!loaderDone||!firebaseDone) return;
    const ls=document.getElementById('loading-screen');
    const root=document.getElementById('root');
    ls.classList.add('fade-out');
    root.style.display='';
    render();
    setTimeout(()=>{ls.style.display='none';},600);
  }

  // Called by Firebase module when data is loaded
  window._firebaseReady=function(){
    firebaseDone=true;
    launchApp();
  };

  function next(){
    if(si>=stages.length) return;
    const st=stages[si++];
    fill.style.width=st.p+'%';
    pct.textContent=st.p+'%';
    msg.textContent=st.s;
    if(si<stages.length){
      setTimeout(next, 170+Math.random()*250);
    } else {
      loaderDone=true;
      launchApp();
    }
  }
  setTimeout(next,120);
})();
</script>
